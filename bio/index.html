<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اسأل الأحياء</title>
<meta name="description" content="ابحث عن أي مصطلح في الأحياء واحصل على تعريفه من الكتاب مباشرة">
<meta name="theme-color" content="#0F766E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#16222E; --mut:#64748B; --line:#E2E8F0; --soft:#F6F8FA;
  --key:#0F766E; --keybg:#E6F2F1; --warn:#B3261E; --bg:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8EDF2; --mut:#93A3B4; --line:#2A3542; --soft:#1A232E;
    --key:#5EC5BB; --keybg:#17302E; --warn:#F2928B; --bg:#111821;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EDF2; --mut:#93A3B4; --line:#2A3542; --soft:#1A232E;
  --key:#5EC5BB; --keybg:#17302E; --warn:#F2928B; --bg:#111821;
}
html{-webkit-text-size-adjust:100%}
body{font-family:Tajawal,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.7;padding:0 16px env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:22px 0 60px}
header{text-align:center;margin-bottom:18px}
h1{font-size:25px;font-weight:800;letter-spacing:-.2px}
header p{font-size:13.5px;color:var(--mut);margin-top:4px}
.box{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:5}
.field{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;
  padding:12px 14px;transition:border-color .15s,box-shadow .15s;background:var(--bg)}
.field:focus-within{border-color:var(--key);box-shadow:0 0 0 4px var(--keybg)}
.field svg{flex:none;width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2}
input{flex:1;border:0;outline:0;font:inherit;font-size:17px;background:transparent;color:var(--ink)}
input::placeholder{color:var(--mut);opacity:.85}
.clr{border:0;background:transparent;color:var(--mut);font:inherit;font-size:20px;cursor:pointer;
  line-height:1;padding:0 2px;display:none}
.clr.on{display:block}
.meta{font-size:12.5px;color:var(--mut);margin:8px 2px 0;min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sec{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:9px;
  padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.sec:hover{border-color:var(--key);color:var(--key)}
.sec.on{background:var(--key);border-color:var(--key);color:#fff}
.sec .c{font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.sec.off{opacity:.55}

.toci{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin-bottom:7px;background:transparent;font:inherit;
  text-align:right;color:var(--ink);cursor:pointer}
.toci.no{cursor:default;opacity:.52;border-style:dashed}
.toci:not(.no):hover{border-color:var(--key)}
.toci .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mut)}
.toci:not(.no) .num{background:var(--keybg);color:var(--key)}
.toci .nm{flex:1;min-width:0;font-size:14.5px;font-weight:700;line-height:1.45}
.toci .pgx{flex:none;font-size:11.5px;color:var(--mut)}
.toci .st{flex:none;font-size:11px;font-weight:700;color:var(--key)}
.toci.no .st{color:var(--mut);font-weight:400}
.unote{font-size:12.5px;color:var(--mut);margin-bottom:11px}
.merged{border:1px solid var(--key);background:var(--keybg);border-radius:9px;padding:9px 12px;
  font-size:12.5px;line-height:1.65;margin-bottom:12px}
.merged b{color:var(--key)}
.grp{margin-top:18px}
.grp h3{font-size:14.5px;font-weight:700;margin-bottom:3px}
.grp .sub{font-size:12.5px;color:var(--mut)}
.soon{border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:14px;
  text-align:center;color:var(--mut);font-size:14px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:13.5px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--key);color:var(--key);outline:0}
.card{border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-top:12px;background:var(--bg)}
.card h2{font-size:18.5px;font-weight:800;margin-bottom:6px}
.card .def{font-size:15.5px}
.card .def b{color:var(--key);font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700}
.src{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--mut);
  background:var(--soft);border-radius:8px;padding:4px 10px}

.empty{text-align:center;padding:26px 10px;color:var(--mut);font-size:14.5px}
.none{border:1px solid var(--line);border-right:4px solid var(--warn);border-radius:12px;
  padding:15px 16px;margin-top:12px;background:var(--soft)}
.none b{color:var(--warn)}
.none p{font-size:14.5px;margin-top:4px}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--mut);text-align:center;line-height:1.9}
mark{background:var(--keybg);color:inherit;border-radius:3px;padding:0 2px}
/* ===== الطباعة: الورقة تُولَّد من الموضوع نفسه ===== */
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{background:#fff !important;color:#16222E !important}
  header,.box,.back,.tabs,.merged,.topbar,footer,.hnt,.keyline,.axis,.cycnav,.exl,.parts{display:none !important}
  .wrap{max-width:none;padding:0}
  .tv{column-count:2;column-gap:7mm}
  .tv > h2,.where,.prft{column-span:all}
  .vz:has(.mx){column-span:all}
  .tv > h2{font-size:17pt;font-weight:800;margin-bottom:1mm;
    border-bottom:1.5pt solid #16222E;padding-bottom:1.5mm}
  .where{font-size:8pt;color:#64748B;margin-bottom:3mm}
  .idea{display:none !important}
  .vz.np{display:none !important}
  .vz{margin-bottom:3mm}
  .vz > h3{font-size:10pt;font-weight:800;margin-bottom:1.5mm;break-after:avoid}
  .vz > h3::after{background:#DFE5EA}
  .mx{overflow:visible !important;border-color:#DFE5EA}
  .mx table{min-width:0 !important;width:100% !important;font-size:7.5pt}
  .mx th,.mx td{border-color:#DFE5EA !important;padding:1mm 1.2mm}
  .mx td.h{position:static !important;box-shadow:none !important;background:#F4F7F9 !important}
  .mx .hi{background:transparent !important;box-shadow:none !important}
  .mx td.df{background:#FFF8E6 !important;font-weight:700}
  .lad2{gap:1mm;break-inside:avoid}
  .tree2{break-inside:avoid}
  .rung .bar{height:7mm;background:#E6F2F1 !important;border:0.5pt solid #BFD9D6 !important}
  .rung .bar span{font-size:8pt;color:#0F766E !important}
  .detail{display:none !important}
  .tree2 .node{font-size:9pt;padding:1.2mm 3mm;border-color:#16222E}
  .tag{font-size:7.5pt;padding:0.6mm 2.5mm}
  .ask{font-size:7.5pt}
  .leaf2{font-size:7.5pt;padding:1mm 1.5mm;background:transparent !important;border-color:#DFE5EA !important}
  .leaf2 b{font-size:8pt}.leaf2 span{font-size:6.8pt}
  .svgbox{border:0;padding:0;width:100%;margin:0;break-inside:avoid}
  .svgbox text{font-size:9px}
  .svgbox .sm{font-size:7.5px}
  .trp{font-size:7.2pt;padding:0.9mm 2mm;margin-bottom:0.8mm;background:#FDF7F6 !important;
    border-color:#F0D9D7 !important;break-inside:avoid}
  .loop{break-inside:avoid;margin-bottom:3mm}
  .loop > .lh{font-size:9pt}.loop > .ld{font-size:7.5pt}
  .sta{padding:1mm 2mm;background:transparent !important;border-color:#DFE5EA !important}
  .sta .k{width:5mm;height:5mm;font-size:7pt;background:#E6F2F1 !important;color:#0F766E !important}
  .sta .tx b{font-size:8pt}.sta .tx span{font-size:6.8pt}
  .arr{margin:0.5mm 0;font-size:9pt}
  .back2{font-size:7pt;padding:1mm;margin-top:1mm}
  .qa{break-inside:avoid;border-color:#DFE5EA;padding:2mm 2.5mm;margin-bottom:2mm}
  .qa .n{font-size:7pt}.qa .p{font-size:8.5pt;margin-bottom:1.5mm}
  .opt{font-size:7.5pt;padding:0.8mm 2mm;margin-bottom:1mm;border-color:#DFE5EA !important}
  .exp{font-size:7pt;padding:1mm 2mm}
  .prft{display:block !important;margin-top:4mm;padding-top:2mm;border-top:0.5pt solid #DFE5EA;
    font-size:6.8pt;color:#64748B;display:flex;justify-content:space-between}
}
.prft{display:none}

.src.go{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);cursor:pointer;
  font:inherit;font-size:12.5px;color:var(--ink);background:var(--soft);padding:6px 11px;border-radius:9px}
.src.go:hover{border-color:var(--key);color:var(--key)}
.src.go svg{width:14px;height:14px;fill:currentColor;opacity:.65;flex:none}
.src.go .arw{color:var(--key);font-weight:700;border-right:1px solid var(--line);padding-right:8px;margin-right:2px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--key);
  font:inherit;font-size:14px;cursor:pointer;padding:4px 0;margin-bottom:6px}
.tv h2{font-size:21px;font-weight:800;margin-bottom:2px}
.tv .where{font-size:13px;color:var(--mut);margin-bottom:14px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--mut);
  font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;padding:8px 10px;margin-bottom:-1px}
.tab.on{color:var(--key);border-bottom-color:var(--key)}
.sheet{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sheet img{display:block;width:100%;height:auto}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px;text-align:center}
.qa{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:11px}
.qa .n{font-size:12px;color:var(--key);font-weight:800;margin-bottom:3px}
.qa .p{font-size:15.5px;font-weight:700;margin-bottom:10px}
.opt{display:block;width:100%;text-align:right;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--ink);font:inherit;font-size:14.5px;cursor:pointer;
  padding:9px 12px;margin-bottom:7px}
.opt:hover:not(:disabled){border-color:var(--key)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--key);background:var(--keybg);font-weight:700}
.opt.no{border-color:var(--warn);opacity:.75;text-decoration:line-through}
.exp{font-size:13.5px;color:var(--mut);border-right:3px solid var(--key);
  background:var(--soft);border-radius:8px;padding:9px 12px;margin-top:4px;line-height:1.7}
.score{text-align:center;font-size:14px;color:var(--mut);padding:12px}
/* ===== قواعد الرسم البصري ===== */
.vz{margin-bottom:22px}
.vz > h3{font-size:15px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.vz > h3 .hnt{font-size:11.5px;font-weight:500;color:var(--key);background:var(--keybg);
  border-radius:999px;padding:2px 9px;white-space:nowrap}
.vz > h3::after{content:"";flex:1;height:1px;background:var(--line)}
.topbar{display:flex;gap:8px;align-items:center;margin:2px 0 12px;flex-wrap:wrap}
.paper{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--key);color:var(--key);
  background:var(--keybg);border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;
  font-weight:700;cursor:pointer}
.paper svg{width:14px;height:14px;fill:currentColor}
.paper small{font-weight:400;opacity:.8;font-size:11.5px}
.idea{background:var(--soft);border-right:3px solid var(--key);border-radius:0 10px 10px 0;
  padding:12px 14px;font-size:14.5px;line-height:1.75;margin-bottom:22px}
.idea b{color:var(--key)}
/* الهرم */
.lad2{display:flex;flex-direction:column;gap:4px}
.rung{display:flex;align-items:center;gap:9px;cursor:pointer;border:0;background:transparent;
  padding:0;font:inherit;text-align:right;width:100%}
.rung .bar{height:30px;border-radius:7px;background:var(--keybg);border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;transition:.15s;flex:none}
.rung .bar span{font-size:13px;font-weight:700;color:var(--key);white-space:nowrap}
.rung:hover .bar,.rung.on .bar{border-color:var(--key)}
.rung.on .bar{background:var(--key)}
.rung.on .bar span{color:#fff}
.rung .d{font-size:12.5px;color:var(--mut);flex:1;min-width:0}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin:6px 2px 0}
.keyline{background:var(--keybg);border-radius:9px;padding:9px 12px;margin-top:11px;font-size:13.5px}
.keyline b{color:var(--key);font-size:16px;letter-spacing:1.5px}
/* الشجرة */
.tree2{display:flex;flex-direction:column;align-items:center}
.node{border:1.5px solid var(--ink);border-radius:9px;padding:8px 14px;font-size:14px;font-weight:700;
  background:var(--bg);text-align:center}
.stem{width:2px;height:16px;background:var(--line)}
.fork{display:flex;width:100%;gap:10px}
.limb{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.limb::before{content:"";position:absolute;top:0;height:2px;background:var(--line);width:50%}
.limb:first-child::before{right:50%}
.limb:last-child::before{left:50%}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;margin-top:16px}
.tag.p{background:#FBF1DC;color:#8A5E08}
.tag.e{background:#E3EEF7;color:#17557E}
:root[data-theme="dark"] .tag.p{background:#3A2E12;color:#E0B64A}
:root[data-theme="dark"] .tag.e{background:#15293A;color:#79B6E0}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .tag.p{background:#3A2E12;color:#E0B64A}
 :root:not([data-theme="light"]) .tag.e{background:#15293A;color:#79B6E0}}
.ask{font-size:12.5px;color:var(--mut);margin:7px 0;text-align:center}
.leaves{display:flex;flex-direction:column;gap:6px;width:100%}
.leaf2{border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;
  background:transparent;font:inherit;text-align:right;width:100%}
.leaf2:hover{border-color:var(--key)}
.leaf2.on{border-color:var(--key);background:var(--keybg)}
.leaf2 b{font-size:13.5px;display:block}
.leaf2 span{font-size:11.5px;color:var(--mut)}
.detail{border:1px solid var(--key);background:var(--keybg);border-radius:10px;padding:11px 13px;
  margin-top:12px;font-size:13.5px;line-height:1.7}
.detail b{display:block;margin-bottom:3px}
/* الجدول */
.mx{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.mx table{border-collapse:separate;border-spacing:0;width:100%;min-width:470px;font-size:12.5px}
.mx th,.mx td{border:1px solid var(--line);padding:7px 8px;text-align:center;line-height:1.5}
.mx th{background:var(--soft);font-weight:700;cursor:pointer;white-space:nowrap}
.mx th.pr{color:#8A5E08}.mx th.eu{color:#17557E}
:root[data-theme="dark"] .mx th.pr{color:#E0B64A}
:root[data-theme="dark"] .mx th.eu{color:#79B6E0}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .mx th.pr{color:#E0B64A}
 :root:not([data-theme="light"]) .mx th.eu{color:#79B6E0}}
.mx td.h{text-align:right;font-weight:700;background:var(--soft);white-space:nowrap;
  position:sticky;right:0;z-index:2;box-shadow:-1px 0 0 var(--line)}
.mx .hi{background:var(--keybg);box-shadow:inset 0 0 0 1px var(--key)}
.mx td.df{font-weight:700}
.mxh{font-size:12px;color:var(--mut);margin-top:7px;text-align:center}
/* المصائد */
.trp{display:flex;gap:9px;border:1px solid var(--line);border-right:3px solid var(--warn);
  border-radius:0 9px 9px 0;background:var(--soft);padding:9px 12px;margin-bottom:7px;font-size:13.5px;line-height:1.65}
.trp .x{color:var(--warn);font-weight:800;flex:none}
.trp b{color:var(--warn)}

/* الشرح */
.exl{border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden}
.exl > button{width:100%;text-align:right;border:0;background:var(--soft);font:inherit;
  font-size:14.5px;font-weight:700;padding:11px 13px;cursor:pointer;color:var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.exl > button .cv{color:var(--key);font-size:17px;line-height:1;transition:.2s}
.exl.on > button .cv{transform:rotate(45deg)}
.exl .bd{padding:12px 14px;font-size:14px;line-height:1.85;border-top:1px solid var(--line)}
.exl .bd p{margin-bottom:9px}
.exl .bd p:last-child{margin-bottom:0}
.exl .bd b{color:var(--key)}

/* التركيب المعنون */
.strc{display:flex;flex-direction:column;gap:12px}
.svgbox{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.svgbox svg{display:block;width:100%;height:auto}
.svgbox .shp{fill:var(--soft);stroke:var(--line);stroke-width:2;transition:.18s}
.svgbox .shp.b{fill:#DCE9F4;stroke:#9CC2DE}
.svgbox .shp.r{fill:#F7DEDC;stroke:#E2A9A3}
:root[data-theme="dark"] .svgbox .shp.b{fill:#1B2E3E;stroke:#2E4F6B}
:root[data-theme="dark"] .svgbox .shp.r{fill:#361F1D;stroke:#5E3330}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .svgbox .shp.b{fill:#1B2E3E;stroke:#2E4F6B}
 :root:not([data-theme="light"]) .svgbox .shp.r{fill:#361F1D;stroke:#5E3330}}
.svgbox .shp.on{stroke:var(--key);stroke-width:3.5}
.svgbox text{font-family:inherit;font-size:11.5px;font-weight:700;fill:var(--ink)}
.svgbox .sm{font-size:9.5px;font-weight:400;fill:var(--mut)}
.svgbox .fl{stroke:var(--mut);stroke-width:2;fill:none;marker-end:url(#ah)}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.part{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;
  background:transparent;color:var(--ink);cursor:pointer}
.part:hover{border-color:var(--key)}
.part.on{background:var(--key);border-color:var(--key);color:#fff}
/* الدورة */
.loop{margin-bottom:14px}
.loop > .lh{font-size:13.5px;font-weight:800;color:var(--key);margin-bottom:2px}
.loop > .ld{font-size:12.5px;color:var(--mut);margin-bottom:9px}
.cyc{display:flex;flex-direction:column;align-items:stretch}
.sta{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;background:transparent;font:inherit;text-align:right;cursor:pointer;width:100%}
.sta:hover{border-color:var(--key)}
.sta.on{border-color:var(--key);background:var(--keybg)}
.sta .k{flex:none;width:23px;height:23px;border-radius:50%;background:var(--soft);color:var(--mut);
  font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sta.on .k{background:var(--key);color:#fff}
.sta .tx{flex:1;min-width:0}
.sta .tx b{font-size:14px;display:block}
.sta .tx span{font-size:12px;color:var(--mut);display:block;margin-top:2px}
.arr{align-self:center;color:var(--mut);font-size:15px;line-height:1;margin:3px 0}
.back2{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--key);
  border:1px dashed var(--key);border-radius:9px;padding:6px 11px;margin-top:7px;justify-content:center}
.cycnav{display:flex;gap:7px;margin-top:9px}
.cycnav button{flex:1;border:1px solid var(--key);background:var(--keybg);color:var(--key);

    "<b>علم التصنيف:</b> أحد فروع علم الأحياء، يهتم بتعريف الأنواع وتسميتها وتصنيفها بناءً على صفاتها وعلاقاتها الطبيعية.",
    "<b>المصنّف:</b> مجموعة المخلوقات الحية التي اتخذت اسماً."]},
   {t:"من رتّبها", p:[
    "<b>أرسطو:</b> صنّف الحيوانات تبعاً لوجود الدم الأحمر أو عدمه، وصنّف النباتات إلى أشجار وشجيرات وأعشاب.",
    "<b>كارلوس لينيوس:</b> أوّل من وضع نظاماً رسمياً عالمياً للتصنيف، واعتمد في تصنيفه على شكل المخلوق الحي وسلوكه. ووضع نظام التسمية الثنائية.",
    "والفرق بينهما هو موضع السؤال: أرسطو صنّف أوّلاً، ولينيوس أوّل من وضع <b>نظاماً رسمياً</b>."]},
   {t:"كيف يُكتب الاسم العلمي", p:[
    "يتكوّن من كلمتين باللاتينية: الأولى اسم <b>الجنس</b> وتبدأ بحرف كبير، والثانية اسم <b>النوع</b> وأحرفه كلّها صغيرة.",
    "ويُكتب <b>بخط مائل</b> في المجلّات والكتب المطبوعة، <b>ويوضع تحته خط</b> إذا كُتب بخط اليد.",
    "ويمكن اختصاره في المرّات التالية بكتابة الحرف الأوّل من اسم الجنس بحرف كبير واسم النوع بأحرف صغيرة."]},
   {t:"كيف يُقرأ سلّم المستويات", p:[
    "ثمانية مستويات، من الأوسع إلى الأضيق. وكلّما نزلت درجةً قلّ عدد ما تضمّه وزاد تشابهه.",
    "وطرفا السلّم هما المسؤولان عن أكثر الأسئلة: <b>فوق المملكة</b> أوسع المصنّفات وتضمّ مملكة أو أكثر، و<b>النوع</b> أضيقها ويُعرَّف بقيد زائد على التشابه، وهو التزاوج وإنتاج نسل خصب.",
    "و<b>الشعبة</b> و<b>القسم</b> اسمان لمستوى واحد، ويُستعمل «القسم» في تصنيف البكتيريا والنباتات."]},
   {t:"لماذا ستّ ممالك وثلاث فوق ممالك", p:[
    "<b>فوق الممالك</b> صُنفت حسب نوع الخلية والتركيب، وعددها ثلاث: البدائيات، والبكتيريا، وحقيقية النوى.",
    "<b>والممالك</b> صُنفت حسب نوع الخلية والتركيب والتغذي، وعددها ستّ.",
    "والقسمة غير متساوية: بدائية النوى مملكتان، كلٌّ منهما تحت فوق مملكة مستقلّة. وحقيقية النوى أربع ممالك تحت فوق مملكة واحدة."]}
  ]},

 qs:[
  {p:"مستوًى تصنيفي أصغر من الرتبة وأكبر من الجنس. ما هو؟",
   o:["الطائفة","الفصيلة","الشعبة","النوع"], c:1,
   e:"بترتيب «فمشط رفجن»، ما بين الرتبة والجنس هو الفصيلة. والطائفة والشعبة أعلى من الرتبة، والنوع أصغر من الجنس."},
  {p:"مخلوق وحيد الخلية، بدائي النوى، وجداره خالٍ من الببتيدوجلايكان. إلى أيّ مملكة ينتمي؟",
   o:["البكتيريا","الطلائعيات","البدائيات","الفطريات"], c:2,
   e:"كونه بدائي النوى يحصره في مملكتين، وغياب الببتيدوجلايكان يفصل البدائيات عن البكتيريا. والطلائعيات والفطريات حقيقية النوى."},
  {p:"أيّ الممالك الآتية لا يوجد في خلاياها جدار خلوي؟",
   o:["النباتات","الفطريات","الطلائعيات","الحيوانات"], c:3,
   e:"الحيوانات وحدها بلا جدار. والنباتات سليلوز، والفطريات كايتين، والطلائعيات بعضها سليلوز."},
  {p:"عدد الممالك التي تقع تحت فوق مملكة حقيقية النوى.",
   o:["اثنتان","ثلاث","أربع","ستّ"], c:2,
   e:"الطلائعيات والفطريات والنباتات والحيوانات. والمملكتان الباقيتان بدائيتا النوى، ولكلٍّ منهما فوق مملكة مستقلّة."},
  {p:"أيّ العبارات الآتية صحيحة عن الطلائعيات؟",
   o:["عديدة الخلايا دائماً","وحيدة الخلية أو عديدة","ذاتية التغذية فقط","بدائية النوى"], c:1,
   e:"والطلائعيات أيضاً «ذاتية أو غير ذاتية التغذية»، فالخيار الثالث يقطع بما لم يقله الكتاب. وهي حقيقية النوى، فالرابع خطأ."},
  {p:"كُتب اسم علمي بخطّ اليد. ما الصحيح في كتابته؟",
   o:["يُكتب مائلاً","يوضع تحته خطّ","كلمة واحدة","النوع بحرف كبير"], c:1,
   e:"المائل للمطبوع في المجلّات والكتب، والخطّ تحته لخطّ اليد. والاسم كلمتان: الجنس بحرف كبير والنوع بأحرف صغيرة."},
  {p:"مَن أوّل من وضع نظاماً رسميّاً عالميّاً للتصنيف؟",
   o:["أرسطو","كارلوس لينيوس","علم التصنيف","المصنّف"], c:1,
   e:"وأرسطو صنّف قبله، لكن تصنيفه لم يكن نظاماً رسميّاً عالميّاً. والسؤال يأتي على الفرق بين «أوّل من صنّف» و«أوّل من وضع نظاماً رسميّاً»."},
  {p:"على أيّ أساس صنّف أرسطو الحيوانات؟",
   o:["شكل المخلوق وسلوكه","نوع الخلية","وجود الدم الأحمر من عدمه","التسمية الثنائية"], c:2,
   e:"وصنّف النباتات إلى أشجار وشجيرات وأعشاب. أمّا الشكل والسلوك فأساس لينيوس، وهو صاحب التسمية الثنائية أيضاً."},
  {p:"ما المصطلح المستعمل بدل «الشعبة» في تصنيف البكتيريا والنباتات؟",
   o:["الطائفة","القسم","الرتبة","الفصيلة"], c:1,
   e:"والقسم والشعبة مستوى واحد باسمين، لا مستويان."},
  {p:"أيّ العبارات أدقّ في تعريف النوع؟",
   o:["مخلوقات متشابهة الشكل","أنواع مترابطة","متشابهة تتزاوج وتنتج نسلاً خصباً","أوسع المصنّفات"], c:2,
   e:"التشابه وحده لا يكفي، والفاصل هو إنتاج نسل خصب. والثاني تعريف الجنس، والرابع تعريف فوق المملكة."},
  {p:"مخلوق حقيقي النوى، عديد الخلايا، جداره سليلوز، وذاتي التغذية. ما مملكته؟",
   o:["الطلائعيات","الفطريات","النباتات","البكتيريا"], c:2,
   e:"والطلائعيات «بعضها» سليلوز وقد تكون وحيدة الخلية، والفطريات كايتين وغير ذاتية التغذية، والبكتيريا بدائية النوى."},
  {p:"أيّ الممالك الآتية توصف تغذيتها بأنّها «ذاتية أو غير ذاتية»؟",
   o:["الفطريات","النباتات","الحيوانات","الطلائعيات"], c:3,
   e:"ومعها البدائيات والبكتيريا. أمّا الفطريات والحيوانات فغير ذاتية قطعاً، والنباتات ذاتية قطعاً."}
 ]

 id:"u2-vert", unit:"أحياء 2", name:"طوائف الفقاريات الخمس", page:"21 إلى 26",
 merge:"مواضيع الكتاب من 10 إلى 14 — طوائف الأسماك والبرمائيات والزواحف والطيور والثدييات — مجموعة هنا في مقارنة واحدة، لأن الاختبار يسأل عن الفرق بينها لا عن كلٍّ وحدها.",
 sheet:"sheets/u2-vert.webp",
 viz:[
  {k:"idea", t:"الطوائف الخمس تشترك في العمود الفقري، وتفترق في خمسة محاور يُسأل عنها: الحرارة، والتنفس، وحجرات القلب، والإخصاب، والغطاء الخارجي. فمن أمسك هذه الخمسة أمسك الباب كلّه."},
  {k:"text", h:"الشرح", secs:[
   {t:"ما الذي يجمعها", p:[
    "الفقاريات كلّها عندها <b>عمود فقري</b> حلّ محلّ الحبل الظهري، وهو سلسلة من الفقرات تحيط بالحبل العصبي لحمايته وتعمل كعصا قوية مرنة.",
    "وعندها <b>العرف العصبي</b>، وهو مجموعة من الخلايا تكوّنت من الحبل العصبي، ويساهم في تكوين الدماغ والجمجمة والجيوب البلعومية وبعض الغدد.",
    "وكلّها لها <b>جهاز دوري مغلق</b>، و<b>أعضاء داخلية</b>: كبد وكلى وقلب."]},
   {t:"الحرارة تقسمها قسمين", p:[
    "<b>متغيرة درجة الحرارة:</b> تحصل على حرارة أجسامها من البيئة الخارجية، ولا تستطيع تنظيمها داخلياً من خلال عمليات الأيض. وهي الأسماك والبرمائيات والزواحف.",
    "<b>ثابتة درجة الحرارة:</b> تستطيع تنظيم درجة حرارتها داخلياً. وهي الطيور والثدييات. ودرجة حرارة الطيور 41 مئوية.",
    "وهذا أوّل سؤال تسأله عن أي مخلوق: أثابتة أم متغيرة؟ فتسقط ثلاث طوائف أو تبقى اثنتان."]},
   {t:"القلب يتدرّج", p:[
    "الأسماك: <b>حجرتان</b> — أذين وبطين — ودورة دموية مغلقة واحدة. والبطين يضخّ الدم من القلب إلى الجسم، والأذين يستقبله.",
    "البرمائيات: <b>ثلاث حجرات</b> — أذينان وبطين واحد — ما عدا أبو ذنيبة فحجرتان. ودورتها مزدوجة.",
    "الزواحف: <b>ثلاث حجرات</b>، والتمساحيات أربع.",
    "الطيور والثدييات: <b>أربع حجرات</b> ودورة مزدوجة. وهذا يفصل الدم المؤكسج عن غير المؤكسج، فيصير توصيل الغذاء والأكسجين أكثر فاعلية."]},
   {t:"التنفس يتبع الموطن", p:[
    "الأسماك بالخياشيم، وهي خيوط رقيقة مغطاة بصفائح لاستخلاص الأكسجين من الماء. و<b>الغطاء الخيشومي</b> يحميها، ويوجد في الأسماك العظمية فقط لا الغضروفية مثل القرش. والأنقليس يتنفس عن طريق الجلد.",
    "البرمائيات: في بداية حياتها بالجلد والخياشيم، وعند البلوغ بالرئتين والجلد. والجلد هو ما يمكّن الضفدع من التنفس خلال السبات الشتوي داخل الطين.",
    "الزواحف والثدييات بالرئتين. والطيور بالرئتين و<b>الأكياس الهوائية</b>: يدخل الأكسجين إلى الخلفية أولاً ومنها إلى الأمامية."]},
   {t:"ما يميّز كل طائفة وحدها", p:[
    "<b>الأسماك:</b> مثانة العوم، وهي كيس مملوء بغاز في الأسماك العظمية فقط، يسمح بالتحكّم في عمق الغوص والطفو. وجهاز الخط الجانبي للإحساس بحركة الماء والتوازن واكتشاف الفرائس.",
    "<b>البرمائيات:</b> الغشاء الرامش، جفن شفاف يتحرّك فوق العين لحمايتها من الماء والجفاف. وغشاء الطبلة لسماع الأصوات عالية التردّد.",
    "<b>الزواحف:</b> البيضة الرهلية، والانسلاخ وهو تغيير الجلد القاسي دورياً وهو دليل على النمو، وعضو جاكوبسون في سقف حلق فم الأفعى لتمييز الروائح.",
    "<b>الطيور:</b> الريش من الكيراتين، والحوصلة مستودع لتخزين الطعام، والقانصة تحوي حجارة لطحن الطعام، وعظام مجوفة خفيفة، ولا مثانة بولية لها تخفيفاً للوزن.",
    "<b>الثدييات:</b> الشعر، والحجاب الحاجز وهو عضلة تفصل التجويف الصدري عن البطني، والغدد اللبنية، والمشيمة تنقل الغذاء والأكسجين من الأم إلى الجنين."]}
  ]},

 id:"u3-circ", unit:"أحياء 3", name:"الجهاز الدوراني (الدوري)", page:"39 و40",
 sheet:"",
 viz:[
  {k:"idea", t:"الجهاز الدوري جهاز النقل في الجسم: ينقل الأكسجين والغذاء إلى خلايا الجسم، ويخلّصها من الفضلات وثاني أكسيد الكربون. وكل ما في الموضوع إمّا وعاء ينقل، أو حجرة تضخّ، أو دورة تسير."},
  {k:"text", h:"الشرح", secs:[
   {t:"الأوعية الثلاثة", p:[
    "<b>الشريان:</b> ينقل الدم المؤكسج من القلب لأنحاء الجسم، <b>ما عدا الشريان الرئوي فيحمل دماً غير مؤكسج</b>. وجدرانه سميكة ومرنة ومتينة لتتحمّل ضغط الدم العالي من القلب.",
    "<b>الوريد:</b> يعيد الدم غير المؤكسج من الجسم للقلب، <b>ما عدا الأوردة الرئوية فتحمل دماً مؤكسجاً</b>. ويوجد بها صمامات تمنع عودة الدم، وهي أقلّ سمكاً من الشرايين.",
    "<b>الشعيرات الدموية:</b> جدارها من طبقة واحدة، ويتمّ خلالها تبادل المواد — الغذاء والأكسجين وثاني أكسيد الكربون — بين الدم وخلايا الجسم. وتربط بين الشرايين والأوردة."]},
   {t:"القلب وعمله", p:[
    "القلب عضو عضلي مكوّن من عضلات قلبية بحجم قبضة اليد، في <b>منتصف الصدر</b>، ووظيفته ضخّ الدم بالانقباض والانبساط.",
    "<b>الجزء العلوي:</b> الأذينان، وهما يستقبلان الدم. <b>والجزء السفلي:</b> البطينان، وهما يضخّان الدم.",
    "<b>الصمامات:</b> تفصل بين الأذين والبطين وتمنع عودة الدم للاتجاه المعاكس. وتحرّك الصمامات الدم من الأذين للبطين."]},
   {t:"منظّم النبض وضغط الدم", p:[
    "<b>العقدة الجيبية الأذينية (منظم النبض):</b> تقع عند الأذين الأيمن، وتسبّب انقباض القلب.",
    "<b>النبض:</b> سببه انقباض وانبساط جدار الشريان، وينبض القلب 70 مرّة بالدقيقة. والشرايين مسؤولة عن النبضات التي نحسّ بها في أسفل رسغ اليد — <b>والأوردة لا تنبض</b>.",
    "<b>ضغط الدم:</b> قياس لضغط الدم على جدران الأوعية الدموية. ومعدّله الطبيعي: أقلّ من 120 ضغط انقباضي، 80 ضغط انبساطي."]},
   {t:"مكوّنات الدم", p:[
    "<b>البلازما:</b> سائل أصفر يشكّل أكثر من 50% من الدم، و90% منها ماء. تحمل الغذاء والدواء، وتنقل الفيتامينات والأملاح والهرمونات والبروتينات.",
    "<b>خلايا الدم الحمراء:</b> لا تحتوي نواة · قرصية الشكل مقعّرة · تنقل الأكسجين لخلايا الجسم · تحتوي على الهيموجلوبين وهو بروتين يحتوي على الحديد. ونقص الحديد يؤدّي إلى فقر الدم.",
    "<b>خلايا الدم البيضاء:</b> تحتوي نواة · تدافع عن الجسم وتحذّره ضد الميكروبات والأمراض والبكتيريا.",
    "<b>الصفائح الدموية:</b> تساعد في تجلّط الدم. والفايبرين بروتين يساعد في تخثّر الدم."]},
   {t:"فصائل الدم", p:[
    "<b>مولد الضد (الأنتيجين):</b> جزيئات محدّدة على الغشاء البلازمي لخلايا الدم الحمراء، يتمّ تحديد فصائل الدم بناءً عليها.",
    "<b>O</b> لا مولد ضد لها، وأجسامها المضادة A و B. تعطي جميع الفصائل، ولا تستقبل إلا من O.",
    "<b>AB</b> مولد ضدها AB، ولا أجسام مضادة لها. تعطي AB فقط، وتستقبل من جميع الفصائل.",
    "<b>العامل الريزيسي:</b> الموجب يستقبل من الموجب والسالب، والسالب لا يستقبل من الموجب. وإذا كانت الأمّ سالبة يجب أن تأخذ حقنة عندما تحمل بطفل موجب، لمنع إنتاج أجسام مضادة."]}
  ]},

   "<b>الأوردة لا تنبض.</b> والنبض الذي نحسّه في رسغ اليد من الشرايين.",
   "<b>الأوردة الرئوية أربعة.</b> والعدد يُسأل عنه.",
   "<b>البلازما أكثر من 50% من الدم، و90% منها ماء.</b> ولا يُخلط بين النسبتين.",
   "<b>خلايا الدم الحمراء لا نواة لها، والبيضاء لها نواة.</b>",
   "<b>فصيلة O تعطي الجميع ولا تستقبل إلا من O، و AB تستقبل من الجميع ولا تعطي إلا AB.</b>",
   "<b>السالب لا يستقبل من الموجب.</b> والموجب يستقبل من الاثنين."
  ]}
 ],
 qs:[
  {p:"الوعاء الدموي الوحيد من الشرايين الذي يحمل دماً غير مؤكسج.",
   o:["الشريان الأبهر","الشريان الرئوي","الوريد الأجوف","الشعيرات الدموية"], c:1,
   e:"الشريان الرئوي يحمل الدم غير المؤكسج من البطين الأيمن إلى الرئتين. والأبهر يحمل المؤكسج، والوريد الأجوف وريد لا شريان."},
  {p:"الحجرة التي تستقبل الدم المؤكسج من الرئتين.",
   o:["الأذين الأيمن","البطين الأيمن","الأذين الأيسر","البطين الأيسر"], c:2,
   e:"الأذين الأيسر، عن طريق أربعة أوردة رئوية. والأذين الأيمن يستقبل غير المؤكسج من الوريد الأجوف."},
  {p:"أين تقع العقدة الجيبية الأذينية؟",
   o:["عند الأذين الأيمن","عند البطين الأيسر","في الشريان الأبهر","في الرئة اليمنى"], c:0,
   e:"العقدة الجيبية الأذينية هي منظّم النبض، وتقع عند الأذين الأيمن وتسبّب انقباض القلب."},
  {p:"الوعاء الذي يتمّ خلاله تبادل المواد بين الدم وخلايا الجسم.",
   o:["الشريان","الوريد","الشعيرات الدموية","الصمام"], c:2,
   e:"الشعيرات الدموية جدارها من طبقة واحدة، فيتمّ خلالها تبادل الغذاء والأكسجين وثاني أكسيد الكربون."},
  {p:"مكوّن الدم الذي لا يحتوي على نواة.",
   o:["خلايا الدم البيضاء","خلايا الدم الحمراء","البلازما","الصفائح الدموية"], c:1,
   e:"خلايا الدم الحمراء لا تحتوي نواة، وهي قرصية مقعّرة وتحتوي الهيموجلوبين. والبيضاء تحتوي نواة."},
  {p:"البروتين الذي يحتوي على الحديد وينقل الأكسجين.",
   o:["الفايبرين","الهيموجلوبين","الأنتيجين","البلازما"], c:1,
   e:"الهيموجلوبين، ونقص الحديد يؤدّي إلى فقر الدم. والفايبرين يساعد في تخثّر الدم."},
  {p:"فصيلة الدم التي تعطي جميع الفصائل.",
   o:["A","B","AB","O"], c:3,
   e:"O لا مولد ضد لها فتعطي الجميع، ولا تستقبل إلا من O. و AB تستقبل من الجميع ولا تعطي إلا AB."},
  {p:"أيّ العبارات صحيحة عن العامل الريزيسي؟",
   o:["السالب يستقبل من الموجب","الموجب يستقبل من السالب","الموجب لا يستقبل من الموجب","السالب يعطي الموجب فقط"], c:1,
   e:"الموجب يستقبل من الموجب والسالب، والسالب لا يستقبل من الموجب."},
  {p:"ترتيب الدورة الدموية الصغرى بعد البطين الأيمن.",
   o:["الشريان الأبهر","الشرايين الرئوية","الوريد الأجوف","الشعيرات الدموية"], c:1,
   e:"البطين الأيمن ← الشرايين الرئوية ← الرئتان ← الأوردة الرئوية ← الأذين الأيسر."},
  {p:"سبب النبض الذي نحسّ به في رسغ اليد.",

  {p:"معدّل ضغط الدم الطبيعي.",

 ]

 id:"u2-09", unit:"أحياء 2", name:"شوكيات الجلد واللافقاريات الحبلية", page:"20",
 viz:[
  {k:"idea", t:"شعبتان متجاورتان في الكتاب لأنهما تشتركان في صفة واحدة: كلتاهما ثانوية الفم. وما عدا ذلك تفترقان، فشوكيات الجلد بلا عمود فقري ولا حبل ظهري، والحبليات فيها الحبل الظهري الذي صار عموداً فقرياً في الفقاريات."},
  {k:"text", h:"الشرح", secs:[
   {t:"شوكيات الجلد", p:[
    "حيوانات <b>بحرية، ثانوية الفم</b>، تتميّز بكثرة الحركة. وتتكاثر جنسياً وإخصابها خارجي، <b>ولا يوجد لديها جهاز إخراجي</b>.",
    "<b>الهيكل الداخلي:</b> مكوّن من كربونات الكالسيوم، ومتصل به أشواك للحماية والدعامة.",
    "<b>التناظر:</b> شعاعي في الأفراد البالغة، وجانبي في اليرقات.",
    "<b>الأقدام الأنبوبية:</b> أنابيب صغيرة ممتلئة بسائل، تستخدمها في الحركة والتغذية والتنفس.",
    "<b>الجهاز الوعائي المائي:</b> نظام يتكوّن من أنابيب مغلقة ممتلئة بسائل، يساعد في الحركة والتغذية. و<b>المصفاة</b> فتحة يدخل الماء عبرها إلى هذا الجهاز.",
    "<b>اللواقط القدمية:</b> لواقط صغيرة توجد على الجلد، تساعد على الإمساك بالغذاء وإزالة المواد الغريبة عن الجلد."]},
   {t:"الحبليات وخصائصها الخمس", p:[
    "<b>حبل ظهري:</b> حبل مرن يجعل الحيوانات قادرة على السباحة مثل الأسماك. وهو صفة مكّنت الحيوانات الكبيرة من التخصّص، حيث يتحوّل لعمود فقري في الفقاريات.",
    "<b>ذيل خلف شرجي:</b> يُستخدم للحركة.",
    "<b>حبل عصبي ظهري أنبوبي:</b> حزمة من الأعصاب محمية بسائل، وينمو ليكون الدماغ والحبل الشوكي.",
    "<b>جيوب بلعومية:</b> لترشيح الغذاء وتبادل الغازات.",
    "<b>الغدة الدرقية:</b> في اللافقاريات الحبلية قناة داخلية تفرز بروتينات شبيهة بإفرازات الغدة الدرقية. <b>والفقاريات هي المخلوقات الوحيدة التي لها غدة درقية.</b>"]},
   {t:"أضرار شوكيات الجلد وفوائدها", p:[
    "<b>أضرارها:</b> تدمير المرجان · وتتغذّى ثعالب البحر على قنافذ البحر، وقنافذ البحر تتغذّى على عشب البحر مما يقضي على الأسماك.",
    "<b>فوائدها:</b> أثبتت الدراسات أن الحياة ظهرت أوّلاً في البحار اعتماداً على وجود أحافير لها · وتشكّل مصدر غذاء للإنسان · وتقيم علاقة تعايش مع الحيوانات البحرية مثل الإسفنج."]}
  ]},
  {k:"tree", h:"تصنيف الحبليات", q:"هل له عمود فقري؟", branches:[
   {tag:"نعم — الفقاريات", cls:"e", ask:"الطوائف الخمس", leaves:[
    {n:"الفقاريات", s:"الأسماك · البرمائيات · الزواحف · الطيور · الثدييات",
     d:"لها عمود فقري. وهي المخلوقات الوحيدة التي لها غدة درقية."}
   ]},
   {tag:"لا — اللافقاريات الحبلية", cls:"p", ask:"شعبتان", leaves:[
    {n:"شعبة حبليات الرأس", s:"السهيم (الرميح)",
     d:"حيوان صغير بدون قشور يشبه السمكة، جلده شفاف يفتقر للألوان، ويدفن نفسه في رمال المياه الضحلة. ولاحظ أن الجهاز العصبي يكون في الظهر."},
    {n:"شعبة حبليات الذيل", s:"الكيسيات (القميصيات)",
     d:"يرقة الأسيديا تشبه أبا ذنيبة، ولها جميع صفات الحبليات. وتُسمّى الكيسيات ببخاخات الماء لامتلاكها سيفون زفيري يضخّ الماء بقوة. والصفة الوحيدة التي بقيت مع الكيسيات البالغة هي الفتحات الخيشومية البلعومية."}
   ]}
  ]},
  {k:"matrix", h:"طوائف شوكيات الجلد الستّ", hint:"اضغط اسم الطائفة",
   cols:[{n:"النجميات",c:"pr"},{n:"الثعبانيات",c:"pr"},{n:"الزنبقيات",c:"pr"},
         {n:"القنفذيات",c:"eu"},{n:"القثائيات",c:"eu"},{n:"اللؤلئيات",c:"eu"}],
   rows:[
    {h:"الأذرع", v:["لها أذرع — خمسة","لها أذرع — خمسة","لها أذرع","ليس لها أذرع","ليس لها أذرع","ليس لها أذرع"], df:[0,1,2,3,4,5]},
    {h:"المثال", v:["نجم البحر","نجم البحر الهش","نجم البحر الريشي","دولار الرمل","خيار البحر","أقحوان البحر"], df:[0,1,2,3,4,5]},
    {h:"ما يميّزها", v:["تعيش في المياه الضحلة ولا تتغذّى عليها المخلوقات بسبب جلدها الشوكي · تتغذّى على المحار · تتجدّد عند تقطيعها","تتحرّك بحركة أذرعها · لا تملك ممصات · يتجدّد عند تقطيعه","تكون جالسة في جزء من حياتها · لزنابق البحر ساق","مغطّاة بأشواك · تتّصف بالاختباء · لها جهاز مضغ يسمّى مصباح أرسطو","تحوّرت الأقدام الأنبوبية إلى لوامس تستعملها في التغذية · أعضاء التنفس فيها على شكل شجرة تنفّسية","لا أذرع لها · توجد الأقدام الأنبوبية حول قرص مركزي"], df:[0,1,2,3,4,5]}
   ]},
  {k:"traps", h:"مصائد الاختبار", items:[
   "<b>شوكيات الجلد لا جهاز إخراجي لها.</b> والنفي يُسأل عنه.",
   "<b>التناظر شعاعي في البالغ وجانبي في اليرقة.</b> ولا يُعكس.",
   "<b>النجميات والثعبانيات لكلٍّ منهما خمسة أذرع.</b> والقنفذيات والقثائيات واللؤلئيات بلا أذرع.",
   "<b>مصباح أرسطو جهاز مضغ في القنفذيات</b>، لا في غيرها.",
   "<b>الفقاريات هي المخلوقات الوحيدة التي لها غدة درقية.</b> واللافقاريات الحبلية لها قناة تفرز بروتينات شبيهة فقط.",
   "<b>الصفة الوحيدة التي تبقى مع الكيسيات البالغة هي الفتحات الخيشومية البلعومية.</b>",
   "<b>الحبليات وشوكيات الجلد تشتركان في أنهما ثانوية الفم.</b> وهذا وجه الجمع بينهما في الكتاب."
  ]}
 ],
 qs:[

   o:["الجهاز الوعائي المائي","الجهاز الإخراجي","الهيكل الداخلي","الأقدام الأنبوبية"], c:1,
   e:"شوكيات الجلد تتكاثر جنسياً وإخصابها خارجي، ولا يوجد لديها جهاز إخراجي."},
  {p:"نوع التناظر في الأفراد البالغة من شوكيات الجلد.",
   o:["جانبي","شعاعي","لا تناظر","كروي"], c:1,

  {p:"جهاز المضغ الذي يسمّى مصباح أرسطو يوجد في:",

  {p:"الخاصية التي يتحوّل منها العمود الفقري في الفقاريات.",
   o:["الذيل خلف الشرجي","الحبل الظهري","الجيوب البلعومية","الغدة الدرقية"], c:1,
   e:"الحبل الظهري حبل مرن يتحوّل لعمود فقري في الفقاريات، وهو صفة مكّنت الحيوانات الكبيرة من التخصّص."},
  {p:"وظيفة الجيوب البلعومية في الحبليات.",
   o:["الحركة","ترشيح الغذاء وتبادل الغازات","إفراز الهرمونات","الإخراج"], c:1,

  {p:"الصفة الوحيدة التي تبقى مع الكيسيات البالغة.",
   o:["الحبل الظهري","الذيل خلف الشرجي","الفتحات الخيشومية البلعومية","الحبل العصبي"], c:2,

 ]

 id:"u2-15", unit:"أحياء 2", name:"النباتات اللاوعائية والوعائية", page:"28 و29",
 viz:[
  {k:"idea", t:"النباتات تنقسم أوّلاً بسؤال واحد: أفيها أنسجة وعائية أم لا؟ فإن لم تكن فهي لاوعائية بثلاثة أقسام. وإن كانت، فسؤال ثانٍ: أتتكاثر بالأبواغ أم بالبذور؟ ومن البذور يأتي سؤال ثالث: أبذورها معراة أم مغطّاة؟"},
  {k:"text", h:"الشرح", secs:[
   {t:"النباتات اللاوعائية", p:[
    "<b>ليس لها أنسجة وعائية</b>، وهو سبب التسمية. و<b>الطور المشيجي سائد</b> على البوغي، تتكاثر بالأبواغ، والأجهزة التكاثرية فيها على نفس النبات.",
    "وليس لها جذور حقيقية بل <b>أشباه جذور</b> وسيقان. وتعيش في المناطق الرطبة الظليلة غالباً.",
    "<b>ونباتات صغيرة جداً</b>، مما يساعد على انتقال المواد بسهولة: ينتقل فيها <b>الماء بالخاصية الاسموزية</b> و<b>الغذاء بالانتشار</b>."]},
   {t:"أقسام اللاوعائية الثلاثة", p:[
    "<b>الحزازيات:</b> لديها تراكيب شبيهة بالأوراق وتراكيب شبيهة بالجذور ولها أشباه سيقان. وبعضها ينمو عمودياً وبعضها متدلّياً. ويُستخدم الحزاز (سفاجنوم) في عمل فحم البيت (فحم الخثّ).",
    "<b>الحشائش البوقية:</b> <b>أصغر قسم</b> في النباتات اللاوعائية. والتسمية لأن الطور البوغي فيها يشبه البوق. وتحتوي بلاستيدة واحدة خضراء كبيرة. وتنمو البكتيريا الخضراء (النوستك) في المخاط وتعيش مع الحشائش في علاقة تعايش.",
    "<b>الحشائش الكبدية:</b> سُمّيت لأن مظهرها الخارجي يشبه الكبد، ولاستعمالها قديماً في علاج الكبد. وتنمو موازية لسطح الأرض. و<b>تُعدّ أبسط النباتات اللاوعائية لأنها تفتقر إلى تسلسل DNA</b>. ولها نوعان: ثالوسية (جسمية) وورقية."]},
   {t:"الوعائية اللابذرية", p:[
    "تحوي على <b>أنسجة وعائية</b> — خشب ولحاء. و<b>الطور البوغي سائد</b> على المشيجي. وتتكاثر بالأبواغ ولا تمتلك بذوراً. والطور البوغي على شكل <b>حامل بوغي</b>، وهو تجمّع متراص من التراكيب الحاملة للأبواغ.",
    "<b>النباتات الصولجانية:</b> تُستخدم في صناعة الفحم الحجري (الأحفوري) المستخدم في الوقود. وسُمّيت صولجانية لأن التراكيب التي تنتج الأبواغ صولجانية الشكل تشبه السنبلة، وصنوبرية لأنها تشبه أشجار الصنوبر. ونباتات هوائية تعيش متعلّقة بنباتات أخرى. مثل: سيلانجينا ومخلب الذئب (ليكوبوديوم).",
    "<b>السرخسيات (النباتات المجنحة):</b> مثل الخنشار وذيل الحصان. ينتج الطور البوغي دون إخصاب. و<b>الرايزوم</b> ساق وجذور سميكة تحت الأرض لتخزين الغذاء. وتتكوّن أبواغ الخنشار في تراكيب تسمّى <b>محفظة الأبواغ</b>، وتكوّن تكتّلات المحافظ <b>كيساً بوغياً</b>. والطور البوغي للخنشار أكبر بكثير من الطور المشيجي. ونبات ذيل الحصان نبات التنظيف، ينتج السيليكا التي كانت تُستعمل قديماً لتنظيف الأواني، وينتج الأبواغ في مخاريط عند قمة الساق التكاثرية."]},
   {t:"الوعائية البذرية", p:[
    "<b>الطور البوغي فيها سائد</b> على المشيجي. وتنقسم إلى معراة البذور ومغطّاة البذور.",
    "<b>المخاريط:</b> تراكيب تحمل الأمشاج المذكّرة والمؤنّثة في معراة البذور.",
    "<b>معراة البذور:</b> لا تشكّل بذورها جزءاً من الثمرة، وتتكاثر بالمخاريط. وأقسامها أربعة: السيكادات، والنيتوفايت، والجنكية، والمخروطية.",
    "<b>مغطّاة البذور (النباتات الزهرية):</b> تشكّل بذورها جزءاً من الثمرة، وتتكاثر بالأزهار، وتُشكّل <b>75%</b> من النباتات.",
    "وانتشار البذور في النباتات البذرية مهمّ لأنه يحدّ من التنافس بين الآباء والأبناء. فثمرة جوز الهند والبذرة بداخلها تطفو لمسافات كبيرة مع تيارات المحيط."]},
   {t:"أقسام مغطّاة البذور ودورات حياتها", p:[
    "<b>أقسامها:</b> ذوات الفلقة الواحدة مثل الأرز والقمح · وذوات الفلقتين مثل الفول والعدس. <b>والفلقة</b> تركيب يخزن الغذاء.",
    "<b>دورات الحياة:</b> <b>السنوي</b> دورة حياته في فصل نمو واحد، مثل نبات الحديقة والأعشاب · <b>ثنائي الحول</b> دورة حياته مدى عامين، مثل الجزر واللفت والشمندر · <b>المعمّرة</b> تعيش سنوات عديدة، مثل الفواكه والشجيرات والورد مثل السوسن."]}
  ]},

    {n:"الحشائش الكبدية", s:"تنمو موازية لسطح الأرض · أبسطها",

   ]},

 id:"u2-16", unit:"أحياء 2", name:"الخلايا والأنسجة النباتية", page:"30",
 viz:[
  {k:"idea", t:"ثلاث خلايا أساسية تُبنى منها ثلاثة أنسجة. والفرق بين الخلايا الثلاث سؤال واحد: أقادرة على الانقسام أم لا؟ والفرق بين الخشب واللحاء سؤال واحد كذلك: ماذا ينقل كلٌّ منهما؟"},
  {k:"text", h:"الشرح", secs:[
   {t:"الخلايا النباتية الثلاث", p:[
    "<b>البرنشيمية:</b> قادرة على الانقسام. ومن وظائفها الحماية، وتبادل الغازات، والتخزين، والبناء الضوئي، وتعويض الأنسجة التالفة واستبدالها. والعديد منها بلاستيدات خضراء تقوم بعملية البناء الضوئي فتنتج الجلوكوز.",
    "<b>الاسكلرنشيمية:</b> <b>غير قادرة على الانقسام</b>، بسبب افتقارها إلى السيتوبلازم والنواة عند اكتمال نموها. ووظيفتها الدعامة والنقل. ولها نوعان: <b>الألياف</b> استعملها الإنسان قديماً لصناعة الأقمشة والحبال، و<b>الخلايا الحجرية</b> تشكّل القوام الخشن مثل بذور الإجاص والجوافة.",
    "<b>الكولنشيمية:</b> قادرة على الانقسام. ومن وظائفها دعامة النبات في بداية النمو، وإعطاء النبات المرونة، وتعويض الأنسجة التالفة واستبدالها."]},
   {t:"الأنسجة المولدة (المرستيمية)", p:[
    "خلاياها <b>دائمة الانقسام</b>. وثلاثة أنواع:",
    "<b>القمّية:</b> وظيفتها تسبّب استطالة النبات. وتوجد في قمم الجذور والسيقان.",
    "<b>البينيّة:</b> تتواجد في سيقان ذوات الفلقة الواحدة. وتنمو باستمرار بعد قصّ قممها النامية، مثل حشائش الحديقة.",
    "<b>الجانبية:</b> <b>الكامبيوم الفليني</b> ينتج خلايا لحماية النبات. و<b>الكامبيوم الوعائي</b> يكوّن أوعية النقل، ويزيد من سمك وقطر النبات."]},
   {t:"الأنسجة الخارجية (البشرة)", p:[
    "طبقة من الخلايا تكوّن الغطاء الخارجي للنبات. وأربعة تراكيب:",
    "<b>الكيوتكيل:</b> مادة شمعية لتقليل فقد الماء، ومنع دخول البكتيريا ومسبّبات المرض.",
    "<b>الثغور:</b> فتحات صغيرة يدخل خلالها الماء و CO2 و O2، وتتحكّم فيها <b>الخليتان الحارستان</b>.",
    "<b>الشعيرات:</b> حماية النبات. و<b>الشعيرات الجذرية:</b> تزيد المساحة السطحية للجذور وبالتالي تمتصّ كمية أكبر من الماء والمواد."]},
   {t:"الأنسجة الوعائية", p:[
    "<b>الخشب:</b> ينقل <b>الماء والأملاح المعدنية</b> من الجذور للأوراق. ويتكوّن من أوعية خشبية — وهي أكثر كفاءة في النقل — ومن قصيبات. ويتكوّن الخشب في النباتات الزهرية من أوعية خشبية وقصيبات، بينما في معراة البذور يتكوّن من <b>قصيبات فقط</b>.",
    "<b>اللحاء:</b> ينقل <b>الغذاء الجاهز</b> — السكريات أو الجلوكوز — من الأوراق لجميع أجزاء النبات. ويتكوّن من أنابيب غربالية تنقل الغذاء، ومن خلايا مرافقة تمدّ الأنابيب بالطاقة.",
    "وعند إضافة محلول ملوّن للنبات فإن أوّل جزء يتلوّن بهذا اللون هو <b>الخشب</b>، نظراً لأن الخشب ينقل المحاليل المائية.",
    "وتحتوي خلايا نسيج اللحاء على عدد كبير من الميتوكندريا لتوفير الطاقة اللازمة لعملية نقل السكريات، والميتوكندريا تُعدّ مصنع الطاقة في الخلية."]}
  ]},

   ]},
  {k:"traps", h:"مصائد الاختبار", items:[
   "<b>الاسكلرنشيمية وحدها غير قادرة على الانقسام</b>، والسبب افتقارها للسيتوبلازم والنواة عند اكتمال نموها.",
   "<b>الخشب ينقل الماء والأملاح من الجذور للأوراق، واللحاء ينقل الغذاء من الأوراق لجميع الأجزاء.</b> والاتجاهان معكوسان.",
   "<b>في معراة البذور يتكوّن الخشب من قصيبات فقط.</b> وفي الزهرية من أوعية خشبية وقصيبات.",
   "<b>أوّل جزء يتلوّن عند إضافة محلول ملوّن هو الخشب</b>، لأنه ينقل المحاليل المائية.",
   "<b>الخليتان الحارستان تتحكّمان في الثغور</b>، لا في الكيوتكيل.",
   "<b>البينيّة في سيقان ذوات الفلقة الواحدة</b>، وتنمو بعد قصّ قممها النامية مثل حشائش الحديقة.",
   "<b>الكامبيوم الوعائي يزيد السمك والقطر، والكامبيوم الفليني ينتج خلايا الحماية.</b>",
   "<b>الشعيرات الجذرية تزيد المساحة السطحية فتمتصّ ماءً أكثر</b>، والشعيرات العادية للحماية."
  ]}
 ],

 id:"u2-17", unit:"أحياء 2", name:"الهرمونات واستجابة النبات", page:"31",
 viz:[
  {k:"idea", t:"أربعة هرمونات تحرّك النبات من داخله، ونوعان من الاستجابة لما حوله: استجابة نمو تدوم، واستجابة حركة مؤقتة. والأكسين هو الرابط بينهما، فهو الذي يفسّر الانتحاء الضوئي."},
  {k:"text", h:"الشرح", secs:[
   {t:"الأكسين", p:[
    "يسمّى <b>إندول حمض الخليك</b>، وهو <b>أوّل هرمون نباتي مكتشف</b>.",
    "يحفّز استطالة الخلايا · ويؤثّر في تكوين وسقوط الثمار · و<b>مسؤول عن انحناء النبات</b>.",
    "ويسبّب <b>سيادة القمّة النامية</b>: يتمّ إفرازه بكثرة في القمم النامية للجذر والساق. والقمّة النامية تحوي خلايا تنقسم باستمرار، <b>وعند قصّها يزداد نموّ وكثافة الأغصان</b>."]},
   {t:"الهرمونات الثلاثة الأخرى", p:[
    "<b>الجبريلينات:</b> تسبّب استطالة الخلايا وتحفّز انقسامها · تتحكّم في طول النبات وتعالج التقزّم · <b>تنتقل عبر الأنسجة الوعائية</b>.",
    "<b>الإثيلين:</b> <b>الهرمون الغازي الوحيد</b>، وينتقل <b>عبر اللحاء</b> · يؤثّر في نضج الثمار والمذاق الحلو والطراوة · يوجد في الثمار الناضجة والأوراق والأزهار.",
    "<b>السايتوكاينينات:</b> هرمونات تحفّز النمو والانقسام السريع."]},
   {t:"استجابة النمو", p:[
    "نموّ النبات استجابةً لمنبّه (مثير) خارجي. و<b>النمو الموجب</b> نموّ النبات نحو المنبّه، <b>والنمو السالب</b> نموّه بعيداً عن المنبّه.",
    "<b>الانتحاء الضوئي:</b> استجابة نموّ النبات للضوء، بسبب <b>التوزيع غير المتساوي للأكسين</b>. والمنبّه هو الضوء. فالساق انتحاء ضوئي موجب، والجذر انتحاء ضوئي سالب.",
    "<b>الانتحاء الأرضي:</b> استجابة نموّ النبات نحو مركز الجاذبية، <b>والمنبّه هو الجاذبية</b>. فالجذر انتحاء أرضي موجب، والساق انتحاء أرضي سالب.",
    "<b>الانتحاء اللمسي:</b> استجابة نموّ النبات نحو مؤثّر آلي ميكانيكي (لمس). ومنه النباتات المتسلّقة مثل المستحية ونبات العنب."]},
   {t:"استجابة الحركة", p:[
    "استجابة النبات التي تسبّب الحركة <b>بغض النظر عن اتجاه المنبّه</b>، وهي <b>مؤقّتة ويمكن تكرارها</b>.",
    "مثل انطباق نبتة آكل الحشرات (فينوس)، وحركة نبات تباع الشمس تبعاً لوجود الشمس.",
    "والفرق بينها وبين استجابة النمو: النمو يتّجه ويدوم، والحركة لا تتّجه وتزول."]}
  ]},

   rows:[

   ]},
  {k:"tree", h:"نوعا الاستجابة", q:"هل الاستجابة متّجهة نحو المنبّه أو بعيداً عنه؟", branches:[
   {tag:"نعم — استجابة نمو", cls:"e", ask:"ثم: ما المنبّه؟", leaves:[
    {n:"الانتحاء الضوئي", s:"المنبّه: الضوء",
     d:"استجابة نموّ النبات للضوء بسبب التوزيع غير المتساوي للأكسين. الساق موجب، والجذر سالب."},
    {n:"الانتحاء الأرضي", s:"المنبّه: الجاذبية",
     d:"استجابة نموّ النبات نحو مركز الجاذبية. الجذر موجب، والساق سالب."},
    {n:"الانتحاء اللمسي", s:"المنبّه: مؤثّر آلي ميكانيكي",
     d:"استجابة نموّ النبات نحو مؤثّر آلي ميكانيكي. ومنه النباتات المتسلّقة مثل المستحية ونبات العنب."}
   ]},
   {tag:"لا — استجابة حركة", cls:"p", ask:"مؤقّتة ويمكن تكرارها", leaves:[
    {n:"استجابة الحركة", s:"انطباق فينوس · تباع الشمس",
     d:"استجابة تسبّب الحركة بغض النظر عن اتجاه المنبّه، وهي مؤقّتة ويمكن تكرارها. مثل انطباق نبتة آكل الحشرات فينوس، وحركة نبات تباع الشمس تبعاً لوجود الشمس."}
   ]}
  ]},
  {k:"traps", h:"مصائد الاختبار", items:[
   "<b>الساق انتحاء ضوئي موجب وأرضي سالب، والجذر انتحاء ضوئي سالب وأرضي موجب.</b> وهذا أكثر ما يُخلط.",
   "<b>سبب الانتحاء الضوئي هو التوزيع غير المتساوي للأكسين</b>، لا الضوء نفسه. والضوء هو المنبّه.",
   "<b>الإثيلين هو الهرمون الغازي الوحيد، وينتقل عبر اللحاء. والجبريلينات تنتقل عبر الأنسجة الوعائية.</b>",
   "<b>الأكسين أوّل هرمون نباتي مكتشف</b>، واسمه إندول حمض الخليك.",
   "<b>عند قصّ القمّة النامية يزداد نموّ وكثافة الأغصان</b>، لأن الأكسين هو سبب سيادة القمّة النامية.",
   "<b>استجابة الحركة مؤقّتة ويمكن تكرارها، وبغض النظر عن اتجاه المنبّه.</b> واستجابة النمو متّجهة ودائمة.",
   "<b>الجبريلينات تعالج التقزّم.</b> والسايتوكاينينات تحفّز الانقسام السريع."
  ]}
 ],

 id:"u2-18", unit:"أحياء 2", name:"النباتات الزهرية وتكاثرها", page:"32 و33",
 viz:[
  {k:"idea", t:"الزهرة أربعة أعضاء: اثنان للحماية والجذب — السبلات والبتلات — واثنان للتكاثر: الأسدية ذكرية والكربلة أنثوية. ومن هذين يأتي التلقيح ثم الإخصاب المزدوج ثم الثمرة."},
  {k:"text", h:"الشرح", secs:[
   {t:"أعضاء الزهرة الأربعة", p:[
    "<b>البتلات:</b> أوراق ملوّنة لجذب الحشرات والملقحات.",
    "<b>الأسدية:</b> تراكيب تكاثرية <b>ذكرية</b> تنتج حبوب اللقاح. وتضمّ: <b>المتك</b> ينتج حبوب اللقاح ويحدث فيه انقسام منصّف، و<b>الخيط</b> يحمل المتك ويدعمه.",
    "<b>الكربلة:</b> تراكيب تكاثرية <b>أنثوية</b> تنتج البويضات. وتضمّ: <b>الميسم</b> يحدث فيه التلقيح، و<b>القلم</b>، و<b>المبيض</b> يحدث فيه الإخصاب ويحدث فيه انقسام منصّف.",
    "<b>السبلات:</b> أوراق خضراء للحماية."]},

function topicOf(e){
  const pr = e.s.split('·').map(x => x.trim());
  const direct = TOPICS.find(t => t.unit === pr[0] && t.name === pr[1]);
  if(direct) return direct;
  const row = TOC.find(x => x.u === pr[0] && x.name === pr[1]);
  return row && row.t ? TOPICS.find(t => t.id === row.t) || null : null;
}

/* ===== تطبيع النص العربي ===== */
function norm(x){
  return (x||"")
   .replace(/[ً-ْـٰ]/g,"")   // تشكيل وتطويل
   .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
   .replace(/[ؤئ]/g,"ء")
   .replace(/[^ء-يa-zA-Z0-9 ]/g," ")
   .replace(/\s+/g," ").trim();
}
function stripAl(x){ return x.replace(/(^|\s)(ال)/g,"$1"); }
function key(x){ return stripAl(norm(x)); }

const IDX = DATA.map(e=>({
  e, k:key(e.t), ak:(e.a||[]).map(key), dk:key(e.d.replace(/<[^>]+>/g,""))
}));
const BY = {}; DATA.forEach(e=>BY[key(e.t)]=e);

const STOP = new Set(["وش","ايش","وشو","شنو","يعني","معني","معنا","تعريف","عرف","ما","ماهو",
 "هو","هي","هذا","هذه","من","عن","في","على","اشرح","وضح","كيف","ليش","لماذا","لمادا","ايه","ما هو"]);

function scoreEntry(it, q, words){
  if(it.k === q || it.ak.includes(q)) return 1000;
  if(it.k.length > 2 && q.includes(it.k)) return 900;
  if(it.ak.some(a => a.length > 2 && q.includes(a))) return 880;
  if(q.length > 2 && it.k.includes(q)) return 820;
  if(q.length > 2 && it.ak.some(a => a.includes(q))) return 800;
  const toks = (it.k + " " + it.ak.join(" ")).split(" ").filter(t => t.length > 2);
  let hits = 0;
  words.forEach(w => { if(toks.some(t => t.includes(w) || w.includes(t))) hits++; });
  if(hits) return 400 + hits * 30;
  let dh = 0;
  words.forEach(w => { if(it.dk.includes(w)) dh++; });
  if(dh) return 100 + dh * 10;
  return 0;
}

function search(raw){
  const q = key(raw);
  if(!q) return {hit:[], near:[]};
  const words = q.split(" ").filter(w => w.length > 2 && !STOP.has(w));
  const all = [];
  IDX.forEach(it => {
    const sc = scoreEntry(it, q, words);
    if(sc) all.push({sc, e:it.e});
  });
  all.sort((a,b) => b.sc - a.sc || a.e.t.length - b.e.t.length);
  return {
    hit:  all.filter(o => o.sc >= 400).slice(0,6).map(o => o.e),
    near: all.filter(o => o.sc < 400).slice(0,5).map(o => o.e)
  };
}

        <span class="num">${x.n}</span>
        <span class="nm">${esc(x.name)}</span>
        <span class="pgx">ص ${esc(x.pg)}</span>
        <span class="st">${x.t ? 'افتح' : 'لم يُبنَ'}</span>
      </button>`).join('');
}

/* ===== رسم كتل الموضوع ===== */
function vText(b, i){
  return `<div class="vz np"><h3>${esc(b.h)}<em class="hnt">اضغط العنوان ليُفتح</em></h3>
    ${b.secs.map((x,j) => `<div class="exl" data-ex="${i}-${j}">
      <button><span>${esc(x.t)}</span><span class="cv">+</span></button>
      <div class="bd" hidden>${x.p.map(y => `<p>${y}</p>`).join('')}</div>
    </div>`).join('')}</div>`;
}
function vStruct(b, i){
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">اضغط اسم الجزء</em></h3>
    <div class="strc">
      <div class="svgbox" data-sv="${i}">${b.svg}</div>
      <div class="parts" data-ps="${i}">
        ${b.parts.map((x,j) => `<button class="part" data-part="${i}-${j}">${esc(x.n)}</button>`).join('')}
      </div>
      <div class="detail" id="pt-${i}" hidden></div>
    </div></div>`;
}
function vCycle(b, i){
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">اضغط المحطة أو «التالي»</em></h3>
    ${b.loops.map((lp,li) => `<div class="loop" data-loop="${i}-${li}">
      <div class="lh">${esc(lp.name)}</div><div class="ld">${esc(lp.d)}</div>
      <div class="cyc">
        ${lp.steps.map((st,si) => `<button class="sta" data-step="${i}-${li}-${si}">
            <span class="k">${si+1}</span>
            <span class="tx"><b>${esc(st.n)}</b><span>${esc(st.d)}</span></span>
          </button>${si < lp.steps.length-1 ? '<span class="arr">&#8595;</span>' : ''}`).join('')}
        <div class="back2">&#8635; ويعود إلى ${esc(lp.steps[0].n)}</div>
      </div>
      <div class="cycnav"><button data-cyc="${i}-${li}">التالي</button></div>
    </div>`).join('')}</div>`;
}
function vLadder(b, i){
  const n = b.items.length;
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">اضغط أي مستوى لتعريفه</em></h3>
    <div class="lad2" data-lad="${i}">
      ${b.items.map((x,j) => `<button class="rung" data-rung="${j}">
         <span class="bar" style="width:${Math.round(100 - j*(52/(n-1)))}%"><span>${esc(x.n)}</span></span>
         </button>`).join('')}
    </div>
    <div class="axis"><span>&#8593; ${esc(b.hi)}</span><span>${esc(b.lo)} &#8595;</span></div>
    <div class="detail" id="ld-${i}" hidden></div>
    <div class="keyline">من الأكبر إلى الأصغر: <b>${esc(b.key)}</b></div>
  </div>`;
}
function vTree(b, i){
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">اضغط الاسم لتظهر صفاته</em></h3>
    <div class="tree2">
      <div class="node">${esc(b.q)}</div><div class="stem"></div>
      <div class="fork">
        ${b.branches.map((br,bi) => `<div class="limb">
          <span class="tag ${br.cls}">${esc(br.tag)}</span>
          <div class="ask">${esc(br.ask)}</div>
          <div class="leaves">
            ${br.leaves.map((lf,li) => `<button class="leaf2" data-leaf="${i}-${bi}-${li}">
               <b>${esc(lf.n)}</b><span>${esc(lf.s)}</span></button>`).join('')}
          </div></div>`).join('')}
      </div>
    </div>
    <div class="detail" id="lf-${i}" hidden></div>
  </div>`;
}
function vMatrix(b, i){
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">${esc(b.hint)}</em></h3>
    <div class="mx"><table data-mx="${i}">
      <tr><td class="h"></td>${b.cols.map((c,j) =>
        `<th class="${c.c}" data-col="${j}">${esc(c.n)}</th>`).join('')}</tr>
      ${b.rows.map(r => `<tr><td class="h">${esc(r.h)}</td>${r.v.map((v,j) =>
        `<td class="${(r.df||[]).includes(j) ? 'df' : ''}" data-c="${j}">${esc(v)}</td>`).join('')}</tr>`).join('')}
    </table></div>
  </div>`;
}
function vTraps(b){
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">احفظها آخر شيء</em></h3>
    ${b.items.map(x => `<div class="trp"><span class="x">!</span><div>${x}</div></div>`).join('')}</div>`;
}
function drawViz(t){
  return t.viz.map((b,i) =>
    b.k === 'idea'   ? `<div class="idea">${esc(b.t)}</div>` :
    b.k === 'text'   ? vText(b,i)   :
    b.k === 'struct' ? vStruct(b,i) :
    b.k === 'cycle'  ? vCycle(b,i)  :
    b.k === 'ladder' ? vLadder(b,i) :
    b.k === 'tree'   ? vTree(b,i)   :
    b.k === 'matrix' ? vMatrix(b,i) :
    b.k === 'traps'  ? vTraps(b)    : '').join('')
;
}

let openTopic = null, tab = 'sheet';

function topicView(t){
  meta.textContent = '';
  secs.style.display = 'none';
  const body = tab === 'sheet' ? drawViz(t) : `<div id="qa"></div>`;
  out.innerHTML = `<div class="tv">
      <button class="back" data-back="1">&#8594; رجوع إلى البحث</button>
      <h2>${esc(t.name)}</h2>
      <div class="where">في الكتاب: ${esc(t.unit)} · صفحة ${esc(t.page)}</div>
      ${t.merge ? `<div class="merged"><b>هذا جمعٌ منّا لا عنوانٌ في الكتاب.</b> ${esc(t.merge)}</div>` : ''}
      <div class="topbar"><button class="paper" data-print="1">
         <svg viewBox="0 0 24 24"><path d="M6 2h12v5H6zM4 9h16v8h-4v5H8v-5H4zm6 8h4v3h-4z"/></svg>
         ورقة المراجعة <small>اطبعها أو احفظها PDF</small></button></div>
      <div class="tabs">
        <button class="tab${tab==='sheet'?' on':''}" data-tab="sheet">ملخّصنا</button>
        <button class="tab${tab==='qs'?' on':''}" data-tab="qs">الأسئلة (${t.qs.length})</button>
      </div>
      ${body}
      <div class="prft"><span>المصدر: كتاب تأسيس يلو للأحياء · ${esc(t.unit)} · صفحة ${esc(t.page)}</span><span>ورقة المراجعة</span></div>
    </div>`;
  if(tab === 'qs') drawQs(t);
}

function drawQs(t){
  const box = document.getElementById('qa');
  box.innerHTML = t.qs.map((x,i) => `<div class="qa" data-q="${i}">
      <div class="n">سؤال ${i+1}</div>
      <div class="p">${esc(x.p)}</div>
      ${x.o.map((o,j) => `<button class="opt" data-pick="${j}">${esc(o)}</button>`).join('')}
      <div class="exp" hidden></div>
    </div>`).join('') + `<div class="score" id="score"></div>`;
}

function answer(card, t, qi, pick){
  const x = t.qs[qi];
  if(card.dataset.done) return;
  card.dataset.done = '1';
  card.querySelectorAll('.opt').forEach((b,j) => {
    b.disabled = true;
    if(j === x.c) b.classList.add('ok');
    else if(j === pick) b.classList.add('no');
  });
  const ex = card.querySelector('.exp');
  ex.innerHTML = (pick === x.c ? '<b>إجابة صحيحة.</b> ' : '<b>الصحيح: ' + esc(x.o[x.c]) + '.</b> ') + esc(x.e);
  ex.hidden = false;
  const done = document.querySelectorAll('.qa[data-done]').length;
  if(done === t.qs.length){
    const right = [...document.querySelectorAll('.qa')].filter(c => !c.querySelector('.opt.no')).length;
    document.getElementById('score').textContent = `أجبت عن ${t.qs.length} أسئلة، وأصبت ${right} منها.`;
  }
}

function render(){
  const v = q.value.trim();
  clr.classList.toggle('on', !!v);
  if(openTopic){ topicView(openTopic); return; }
  secs.style.display = '';
  renderSecs();
  if(!v && activeUnit){ unitView(activeUnit); return; }
  if(!v){
    meta.textContent = `${DATA.length} مصطلحاً في البنك`;
    out.innerHTML = `<div class="empty">اكتب مصطلحاً، أو اختر قسماً، أو جرّب أحد هذه</div>` + chips(SUGG);
    return;
  }
  const {hit, near} = search(v);
  if(hit.length){
    meta.textContent = hit.length === 1 ? 'نتيجة واحدة' : `${hit.length} نتائج`;
    out.innerHTML = hit.map(card).join('');
    return;
  }
  meta.textContent = '';
  let html = `<div class="none">
      <b>هذا المصطلح غير موجود في مادّتنا.</b>
      <p>وهذا لا يعني أنه خطأ، بل أنه لم يُضَف بعد. ولا يُعطى جواب من خارج الكتاب حتى لا يختلف عمّا في الاختبار.</p>
    </div>`;
  if(near.length){
    html += `<div class="empty">لكن الكلمة وردت في شرح هذه المصطلحات</div>` + chips(near.map(e => e.t));
  } else {
    html += `<div class="empty">جرّب أحد هذه</div>` + chips(SUGG);
  }
  out.innerHTML = html;
}

q.addEventListener('input', render);
clr.addEventListener('click', ()=>{ q.value=''; q.focus(); render(); });
q.addEventListener('input', ()=>{ openTopic = null; if(q.value.trim()) activeUnit = null; });
document.addEventListener('click', ev=>{
  const tp = ev.target.closest('[data-topic]');
  if(tp){
    openTopic = TOPICS.find(t => t.id === tp.dataset.topic) || null;
    tab = 'sheet'; render(); window.scrollTo({top:0, behavior:'smooth'}); return;
  }
  if(ev.target.closest('[data-back]')){
    openTopic = null; render(); window.scrollTo({top:0, behavior:'smooth'}); return;
  }
  const tb = ev.target.closest('[data-tab]');
  if(tb && openTopic){ tab = tb.dataset.tab; topicView(openTopic); return; }
  const pick = ev.target.closest('[data-pick]');
  if(pick && openTopic){
    const c = pick.closest('.qa');
    answer(c, openTopic, +c.dataset.q, +pick.dataset.pick); return;
  }
  if(ev.target.closest('[data-print]')){ window.print(); return; }
  const ex = ev.target.closest('.exl > button');
  if(ex){
    const w = ex.parentElement, bd = w.querySelector('.bd');
    w.classList.toggle('on'); bd.hidden = !w.classList.contains('on');
    return;
  }
  const pt = ev.target.closest('[data-part]');
  if(pt && openTopic){
    const [bi, j] = pt.dataset.part.split('-').map(Number);
    const x = openTopic.viz[bi].parts[j];
    const wrap = pt.closest('.strc');
    const was = pt.classList.contains('on');
    wrap.querySelectorAll('.part').forEach(e => e.classList.remove('on'));
    wrap.querySelectorAll('.shp').forEach(e => e.classList.remove('on'));
    const box = document.getElementById('pt-' + bi);
    if(was){ box.hidden = true; return; }
    pt.classList.add('on');
    (x.id || '').split(' ').filter(Boolean).forEach(id => {
      const sh = wrap.querySelector('#' + id); if(sh) sh.classList.add('on');
    });
    box.innerHTML = `<b>${esc(x.n)}</b>${esc(x.d)}`; box.hidden = false;
    return;
  }
  const stp = ev.target.closest('[data-step]');
  if(stp){
    const lp = stp.closest('.loop');
    const was = stp.classList.contains('on');
    lp.querySelectorAll('.sta').forEach(e => e.classList.remove('on'));
    if(!was) stp.classList.add('on');
    return;
  }
  const cy = ev.target.closest('[data-cyc]');
  if(cy){
    const lp = cy.closest('.loop'), all = [...lp.querySelectorAll('.sta')];
    const cur = all.findIndex(e => e.classList.contains('on'));
    all.forEach(e => e.classList.remove('on'));
    const nx = all[(cur + 1) % all.length];
    nx.classList.add('on');
    nx.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  const rg = ev.target.closest('[data-rung]');
  if(rg && openTopic){
    const lad = rg.closest('[data-lad]'), bi = +lad.dataset.lad, j = +rg.dataset.rung;
    const was = rg.classList.contains('on'), box = document.getElementById('ld-' + bi);
    lad.querySelectorAll('.rung').forEach(r => r.classList.remove('on'));
    if(was){ box.hidden = true; }
    else {
      rg.classList.add('on');
      const x = openTopic.viz[bi].items[j];
      box.innerHTML = `<b>${esc(x.n)}</b>${esc(x.d)}`; box.hidden = false;
    }
    return;
  }
  const lf = ev.target.closest('[data-leaf]');
  if(lf && openTopic){
    const [bi, br, li] = lf.dataset.leaf.split('-').map(Number);
    const x = openTopic.viz[bi].branches[br].leaves[li];
    document.querySelectorAll('.leaf2').forEach(e => e.classList.remove('on'));
    lf.classList.add('on');
    const d = document.getElementById('lf-' + bi);
    d.innerHTML = `<b>${esc(x.n)}</b>${esc(x.d)}`; d.hidden = false;
    return;
  }
  const ch = ev.target.closest('[data-col]');
  if(ch){
    const tb = ch.closest('table'), j = +ch.dataset.col;
    const on = ch.classList.contains('hi');
    tb.querySelectorAll('.hi').forEach(e => e.classList.remove('hi'));
    if(!on){
      ch.classList.add('hi');
      tb.querySelectorAll(`td[data-c="${j}"]`).forEach(e => e.classList.add('hi'));
    }
    return;
  }
  const u = ev.target.closest('[data-unit]');
  if(u){
    activeUnit = activeUnit === u.dataset.unit ? null : u.dataset.unit;
    q.value = '';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  const b = ev.target.closest('[data-go]');
  if(!b) return;
  activeUnit = null; openTopic = null;
  q.value = b.dataset.go;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
render();
</script>
</body>
</html>
