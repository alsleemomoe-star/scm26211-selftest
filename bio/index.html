 id:"u3-28", unit:"أحياء 3", name:"جهاز التكاثر في الإنسان", page:"45",
 viz:[
  {k:"idea", t:"الغدة النخامية تفرز هرمونين — FSH و LH — يعملان في الجهازين معاً، ولكلٍّ منهما وظيفة مختلفة في كلٍّ. ودورة الحيض أربعة أطوار بأيامها، وما يحدث في آخرها يتوقّف على سؤال واحد: أحدث إخصاب أم لا؟"},
  {k:"text", h:"الشرح", secs:[
   {t:"تركيب الجهاز التناسلي الذكري", p:[
    "<b>الخصيتان:</b> غدة تناسلية توجد خارج الجسم في كيس الصفن، مما يوفّر بيئة (حرارة) مناسبة لتكوين الحيوانات المنوية. وتحتوي على الأنابيب المنوية.",
    "<b>الأنابيب المنوية:</b> إنتاج الحيوانات المنوية في درجة حرارة <b>35 مئوية</b>.",
    "<b>البربخ:</b> تخزين الحيوانات المنوية واكتمال نضجها.",
    "<b>الوعاء الناقل:</b> ويسمّى الأسهر، ينقل الحيوانات المنوية إلى الإحليل.",
    "<b>الحوصلة المنوية:</b> تغذية الحيوانات المنوية، وتفرز <b>نصف السائل المنوي</b> والسكر لتزويد الحيوانات المنوية بالطاقة والمواد المغذية (بروتينات وإنزيمات).",
    "<b>غدة البروستاتا وكوبر:</b> إفراز محلول قلوي (قاعدي) لمعادلة حموضة الجهاز التناسلي الأنثوي.",
    "<b>الإحليل:</b> قناة بولية تناسلية مشتركة."]},
   {t:"تركيب الحيوان المنوي والهرمونات الذكرية", p:[
    "<b>مكوّنات السائل المنوي:</b> حيوانات منوية + مواد مغذية + محلول قلوي.",
    "<b>الذيل:</b> للحركة. <b>القطعة الوسطى:</b> تزوّد الحيوان المنوي بالطاقة لاحتوائها على الميتوكندريا. <b>الجسم القمعي:</b> يفرز إنزيمات هاضمة تحلّل الغشاء البلازمي للبويضة أثناء عملية الإخصاب. <b>النواة:</b> تحمل المادة الوراثية.",
    "<b>التستوستيرون:</b> الهرمون الجنسي الذكري، والمسؤول عن إظهار الصفات الذكرية عند البلوغ، مثل خشونة الصوت وظهور الشعر وإنتاج الحيوانات المنوية.",
    "<b>وهرمونات تفرزها الغدة النخامية تنظّم عمل الخصية:</b> <b>FSH</b> المنشط للحوصلة — ينظّم إنتاج الحيوانات المنوية · <b>LH</b> المنشط للجسم الأصفر — إنتاج هرمون التستوستيرون."]},
   {t:"تركيب الجهاز التناسلي الأنثوي والهرمونات", p:[
    "<b>المبيض:</b> لإنتاج البويضات والهرمونات الأنثوية. <b>قناة البيض (فالوب):</b> تنتقل البويضة من خلالها <b>ويحدث الإخصاب أعلاها</b>. <b>الرحم:</b> ينمو فيه الجنين حتى ولادته، وهو بحجم قبضة اليد. <b>المهبل:</b> تدخل منه الحيوانات المنوية.",
    "<b>البروجسترون:</b> يزيد سمك بطانة الرحم، ويزداد الهرمون بشكل كبير عند أخذ حبوب منع الحمل أو عند حدوث الإخصاب.",
    "<b>الإستروجين:</b> يظهر الصفات الأنثوية مثل نموّ الثديين واتساع الحوض ونعومة الصوت، ويزداد الهرمون — <b>بشكل أقلّ من البروجسترون</b> — عند حدوث الإخصاب.",
    "<b>وهرمونات الغدة النخامية التي تنظّم عمل المبيض:</b> <b>FSH</b> إنتاج الهرمونات الأنثوية · <b>LH</b> يؤثّر في الإباضة.",
    "<b>الخلايا البيضية الأولية:</b> تتضاعف وتنقسم فيها المادة الوراثية للأنثى <b>قبل الولادة</b>. فتولد الأنثى ولديها جميع البويضات التي ستنتجها."]},
   {t:"دورة الحيض وأطوارها", p:[
    "<b>سبب حدوث دورة الحيض هو تحطّم بطانة الرحم.</b>",
    "<b>طور تدفّق الطمث:</b> من اليوم 1 إلى 5. <b>طور الحوصلة:</b> من اليوم 6 إلى 14. <b>طور الجسم الأصفر:</b> من اليوم 15 إلى 28.",
    "<b>وبعد خروج البويضة تتحوّل خلايا الحوصلة إلى تركيب يسمّى الجسم الأصفر.</b>",
    "<b>وفي طور الجسم الأصفر:</b> يبدأ الجسم الأصفر بالتحلّل ويفرز البروجسترون بكميات كبيرة وقليل من الإستروجين. <b>وعند عدم حدوث حمل (إخصاب):</b> يضمحلّ الجسم الأصفر وينخفض تركيز البروجسترون والإستروجين مما يؤدّي لتمزّق بطانة الرحم وحدوث دورة طمث جديدة. <b>وعند حدوث حمل (إخصاب):</b> يبقى تركيز البروجسترون مرتفعاً ولا يضمحلّ الجسم الأصفر، ويزداد تدفّق الدم إلى الرحم لتغذية الجنين."]}
  ]},

  {k:"traps", h:"مصائد الاختبار", items:[

  ]}

 id:"u3-29", unit:"أحياء 3", name:"مراحل نمو الجنين", page:"46",
 viz:[
  {k:"idea", t:"تسلسل واحد من البويضة إلى الجاسترولا، وجدول واحد لثلاثة أثلاث بما يحدث في كلٍّ. وما عداهما أغشية ومشيمة ومسبّبات تشوّه."},
  {k:"text", h:"الشرح", secs:[
   {t:"الإخصاب والمراحل الأولى", p:[
    "<b>الإخصاب:</b> اندماج الحيوان المنوي 1n مع البويضة 1n لتكوين اللاقحة (الزيجوت) <b>2n</b>. ويحدث في <b>أعلى قناة البيض (فالوب)</b>.",
    "<b>ويستطيع الحيوان المنوي البقاء في الجهاز التناسلي الأنثوي مدّة 48 ساعة، بينما البويضة غير المخصبة لا تستطيع البقاء أكثر من 24 ساعة.</b>",
    "<b>في اليوم الثالث:</b> تدخل البويضة المخصبة إلى الرحم على صورة <b>الموريولا</b> (كرة خلوية مصمتة).",
    "<b>في اليوم الخامس:</b> تتحوّل الموريولا إلى <b>بلاستيولا</b> (كرة مجوفة)، تنغرس في الرحم في <b>سادس يوم</b>، ويكتمل الانغراس في <b>عاشر يوم</b>.",
    "<b>تسلسل النمو:</b> البويضة ← اللاقحة (الزيجوت) ← التوتة (الموريولا) ← الكبسولة البلاستيولية ← الجاسترولا. <b>والتوتة كرة مصمتة من الخلايا.</b>"]},
   {t:"الأغشية الجنينية والمشيمة", p:[
    "<b>الغشاء الكوريوني:</b> يوجد خارج الغشاء الرهلي ويساهم في تكوين المشيمة.",
    "<b>الغشاء الرهلي (الأمنيوني):</b> بداخله السائل الذي يعزل الجنين ويحميه من الجفاف والصدمات.",
    "<b>الممبار:</b> للتخلّص من الفضلات ويساهم في تكوين المشيمة أيضاً.",
    "<b>كيس المحّ:</b> <b>أوّل موقع لتكوين خلايا الدم الحمراء للجنين.</b>",
    "<b>المشيمة:</b> امتدادات (خملات كوريونية) من غشاء الكوريون تنمو في جدار الرحم لتتكوّن المشيمة. ووظيفتها إمداد الجنين بالغذاء والأكسجين وتخليصه من الفضلات وثاني أكسيد الكربون. ولها سطحان: سطح من الجنين وسطح من الأم. وتبدأ بالنمو في <b>الأسبوع الثاني</b> ويكتمل نموّها في <b>الأسبوع العاشر</b>.",
    "<b>وقد ينتقل من الأم إلى الجنين الأدوية والعقاقير وبعض الفيروسات، ولكن خلايا الدم لا تنتقل لعدم وجود اتصال بين الدورتين الدمويتين.</b>",
    "<b>الهرمون الكوريوني الموجه للغدد التناسلية hCG:</b> يفرزه الجنين في الأسبوع الأوّل ليحافظ على الجسم الأصفر من التحلّل حتى تتكوّن المشيمة، وبالتالي يحافظ على تركيز البروجسترون مرتفعاً وكذلك الاستروجين (بنسبة أقلّ) ليمنع حدوث دورة حيض جديدة."]},
   {t:"تشخيص الاختلالات", p:[
    "<b>الموجات فوق الصوتية:</b> تحديد ما إذا كان الجنين ينمو بصورة طبيعية ومعرفة جنسه · تحديد وضعية الجنين داخل الرحم.",
    "<b>تحليل السائل الرهلي والخملات الكوريونية:</b> قياس مستويات الإنزيمات · تحديد المخطط الكروموسومي والكروموسومات غير الطبيعية · تحديد جنس الجنين.",
    "<b>ويتمّ تحليل عينة السائل الرهلي للجنين في مرحلة الثلاثة أشهر الثانية</b>، أي من الأسبوع الثالث عشر إلى الأسبوع الرابع والعشرين (بغرس إبرة في بطن الأم)."]}
  ]},
  {k:"cycle", h:"تسلسل النمو", loops:[
   {name:"من البويضة إلى الجاسترولا", d:"والترتيب يُسأل عنه كما هو",
    steps:[
     {n:"البويضة", d:"قبل الإخصاب"},
     {n:"اللاقحة (الزيجوت) 2n", d:"من اندماج الحيوان المنوي 1n مع البويضة 1n"},
     {n:"التوتة (الموريولا)", d:"كرة مصمتة من الخلايا · تدخل الرحم في اليوم الثالث"},
     {n:"الكبسولة البلاستيولية", d:"كرة مجوفة في اليوم الخامس · تنغرس في سادس يوم ويكتمل الانغراس في عاشر يوم"},
     {n:"الجاسترولا", d:"المرحلة التالية من النمو"}
    ]}
  ]},
  {k:"matrix", h:"مراحل تكوّن الجنين", hint:"اضغط المرحلة",
   cols:[{n:"الثلاثة الأولى",c:"pr"},{n:"الثلاثة الثانية",c:"pr"},{n:"الثلاثة الثالثة",c:"eu"}],
   rows:[
    {h:"ما يحدث فيها", v:["يكون الجنين أكثر عرضة للتأثّر بالعقاقير والدخان، نظراً لبداية تكوّن أجهزة الجنين · ونقص المواد المغذية يؤدّي إلى تشوّهات دائمة · وفي نهاية المرحلة تظهر بصمات الأصابع","تسمّى مرحلة النمو، ويبدأ فيها الشعر بالتكوّن · يمكن سماع نبضات القلب بالسماعة في الأسبوع 20 · يتحرّك الجنين ويشعر الأم به بالركل، ويمصّ أصبعه، ويفتح عينيه · وفرصة حياته بالتدخّل الطبي قليلة لعدم اكتمال نموّ الرئتين والمناعة","يجب على الأم أن تتناول كميات كبيرة من البروتينات، لأن الجنين ينمو بسرعة بمعدل 250 ألف خلية عصبية بالدقيقة · وتتراكم الدهون تحت الجلد لحفظ درجة الحرارة · ويستجيب للأصوات"], df:[0,1,2]}
   ]},
  {k:"matrix", h:"مسبّبات تشوّه الولادة", hint:"اضغط السبب",
   cols:[{n:"تدخين السجائر",c:"pr"},{n:"نقص حمض الفوليك",c:"pr"},{n:"الكوكايين",c:"eu"}],
   rows:[
    {h:"التشوّه", v:["نقص وزن المولود وعدم اكتمال نموّه","عدم اكتمال نموّ الدماغ والرأس · العصب المفلوج (قد يسبّب الشلل)","نقص وزن المولود والولادة المبكرة · ضرر بالدماغ والسلوكيات"], df:[0,1,2]}
   ]},
  {k:"traps", h:"مصائد الاختبار", items:[
   "<b>التسلسل: البويضة ← اللاقحة ← التوتة ← الكبسولة البلاستيولية ← الجاسترولا.</b>",
   "<b>الموريولا كرة مصمتة والبلاستيولا كرة مجوفة.</b> ولا يُعكس.",
   "<b>اليوم الثالث دخول الرحم، والخامس التحوّل لبلاستيولا، والسادس الانغراس، والعاشر اكتماله.</b>",
   "<b>الحيوان المنوي يبقى 48 ساعة، والبويضة غير المخصبة لا تتجاوز 24 ساعة.</b>",
   "<b>كيس المحّ أوّل موقع لتكوين خلايا الدم الحمراء للجنين.</b>",
   "<b>المشيمة تبدأ النمو في الأسبوع الثاني ويكتمل في العاشر.</b> ولها سطحان.",
   "<b>خلايا الدم لا تنتقل بين الأم والجنين لعدم وجود اتصال بين الدورتين الدمويتين</b>، لكن الأدوية والعقاقير وبعض الفيروسات تنتقل.",
   "<b>hCG يحافظ على الجسم الأصفر من التحلّل ليمنع دورة حيض جديدة.</b>",
   "<b>نبضات القلب تُسمع بالسماعة في الأسبوع 20، وبصمات الأصابع في نهاية الثلاثة الأولى.</b>",
   "<b>تحليل السائل الرهلي في الثلاثة الثانية: من الأسبوع 13 إلى 24.</b>"
  ]}
 ],

 id:"u3-30", unit:"أحياء 3", name:"جهاز المناعة", page:"47",
 viz:[
  {k:"idea", t:"سؤال واحد يقسم المناعة كلّها: هل تستهدف نوعاً محدّداً من مسبّبات المرض أم لا؟ فإن لم تكن فهي غير متخصّصة وخط الدفاع الأوّل، وإن كانت فهي متخصّصة ولها أعضاء وخلايا."},
  {k:"text", h:"الشرح", secs:[
   {t:"المناعة غير المتخصّصة (العامة)", p:[
    "<b>لا تستهدف نوعاً محدّداً من مسبّبات المرض، وتُعدّ خط الدفاع الأوّل، وتتكوّن منذ الولادة.</b>",
    "<b>الحواجز:</b> <b>حاجز الجلد</b> يتضمّن الجلد والأهداب، وهو <b>خط الدفاع الأوّل عن الجسم</b> · <b>والحواجز الكيميائية</b> اللعاب والدموع والإفرازات الأنفية، والمخاط وأهداب القناة التنفسية، وحمض الهيدروكلوريك HCl الذي يُفرز في المعدة.",
    "<b>استجابة المناعة غير المتخصّصة:</b> <b>الانترفيرون</b> بروتين تفرزه الخلايا المصابة يرتبط مع الخلايا المجاورة السليمة لتنتج بروتينات مضادة للفيروس (منع انتشاره) · <b>الدفاع الخلوي بالبلعمة</b> إحاطة خلايا الدم البيضاء الأكولة بالمخلوقات الغريبة عند دخولها الجسم وإفراز إنزيمات هاضمة لتحليلها بالليسوسومات، والبروتينات المتممة تعزّز عملية البلعمة وتدمير الميكروبات من خلال مساعدة الخلايا الأكولة ولها <b>20 نوعاً</b> في بلازما الدم · <b>الاستجابة الالتهابية</b> تعطي خلايا الدم البيضاء إشارة لحدوث الالتهاب وجذب الخلايا الأكولة (البلعمية) إلى المنطقة، ومن أعراضها الألم والاحمرار والتورّم.",
    "<b>وخلايا الدم البيضاء الأكولة (البلعمية) هي أوّل من تبدأ بالدفاع عند دخول مسبّب المرض.</b> <b>وكلّما زاد عدد كريات الدم البيضاء في الدم كان ذلك مؤشّراً لوجود التهاب.</b>"]},
   {t:"المناعة المتخصّصة (النوعية) وأعضاؤها", p:[
    "<b>تستهدف نوعاً محدّداً من مسبّبات المرض.</b>",
    "<b>الأعضاء اللمفية:</b> تضمّ أنسجة وخلايا ليمفية ونسيج ضام. وهي:",
    "<b>اللوزتان:</b> حلقة حماية بين الأنف والفم. <b>العقد الليمفية:</b> ترشّح السائل اللمفي من المواد الغريبة مما يساعد على الحماية من البكتيريا. <b>الطحال:</b> يخزن الدم ويحطّم خلايا الدم الحمراء التالفة. <b>الغدة الزعترية:</b> تنشيط ونضج <b>الخلايا التائية</b>، وتسمّى الغدة الثيموسية. <b>الأنسجة اللمفية:</b> تنتشر في الأغشية المخاطية للقنوات الهضمية والتنفسية والتناسلية.",
    "<b>الجهاز اللمفي:</b> يضمّ أعضاءً وخلايا تعمل على ترشيح السائل اللمفي والدم. <b>واللمف</b> يحتوي على معظم مكوّنات الدم، ولكن <b>لا يحتوي على خلايا الدم الحمراء</b>، وتكون نسبة البروتينات فيه قليلة جداً."]},
   {t:"الخلايا اللمفية", p:[
    "<b>نوع من خلايا الدم البيضاء تنتج في النخاع الأحمر للعظام.</b>",
    "<b>الخلايا البائية (البلازمية) B-cell:</b> <b>مصانع إنتاج الأجسام المضادة.</b>",
    "<b>الخلايا التائية T-cell:</b> نوعان — <b>المساعدة</b> تفرز بروتينات تساعد الخلايا البائية على إنتاج الأجسام المضادة، وتنشّط الخلايا التائية القاتلة · <b>والقاتلة</b> بعضها يرتبط بمسبّب المرض وتطلق مادة كيميائية لتدميره، وبعضها يطلق السايتوكينات (خلايا تحفّز الانقسام)."]},
   {t:"المناعة السلبية والإيجابية", p:[
    "<b>المناعة السلبية:</b> تحدث عندما تُصنع الأجسام المضادة من مخلوقات أخرى وتُحقن في الجسم. مثل: الأجسام المضادة المنتقلة من الأم إلى الجنين خلال المشيمة · والأجسام المضادة لإبطال سمّ الأفعى · وعلاج الالتهاب الكبدي الوبائي والتيفوئيد.",
    "<b>المناعة الإيجابية:</b> تحدث نتيجة تعرّض جهاز المناعة <b>لمولدات ضد المرض</b> وإنتاج الخلايا الذاكرة. مثل: الإصابة بمرض معدٍ · والتطعيمات مثل تطعيم الأطفال ضد مرض التيتانوس."]}
  ]},
  {k:"tree", h:"قسما المناعة", q:"هل تستهدف نوعاً محدّداً من مسبّبات المرض؟", branches:[

    {n:"الانترفيرون", s:"بروتين يمنع انتشار الفيروس",
     d:"بروتين تفرزه الخلايا المصابة يرتبط مع الخلايا المجاورة السليمة لتنتج بروتينات مضادة للفيروس، فيمنع انتشاره."},
    {n:"الدفاع الخلوي — البلعمة", s:"خلايا الدم البيضاء الأكولة",
     d:"إحاطة خلايا الدم البيضاء الأكولة بالمخلوقات الغريبة وإفراز إنزيمات هاضمة لتحليلها بالليسوسومات. والبروتينات المتممة تعزّزها ولها 20 نوعاً في بلازما الدم."},
    {n:"الاستجابة الالتهابية", s:"الألم والاحمرار والتورّم",
     d:"تعطي خلايا الدم البيضاء إشارة لحدوث الالتهاب وجذب الخلايا الأكولة إلى المنطقة."}
   ]},
   {tag:"نعم — متخصّصة (نوعية)", cls:"e", ask:"ولها أعضاء وخلايا", leaves:[
    {n:"الخلايا البائية B-cell", s:"مصانع إنتاج الأجسام المضادة",
     d:"تسمّى البلازمية، وهي مصانع إنتاج الأجسام المضادة."},
    {n:"الخلايا التائية المساعدة", s:"تساعد البائية وتنشّط القاتلة",
     d:"تفرز بروتينات تساعد الخلايا البائية على إنتاج الأجسام المضادة، وتنشّط الخلايا التائية القاتلة."},
    {n:"الخلايا التائية القاتلة", s:"تدمّر مسبّب المرض",
     d:"بعضها يرتبط بمسبّب المرض وتطلق مادة كيميائية لتدميره، وبعضها يطلق السايتوكينات وهي خلايا تحفّز الانقسام."}
   ]}
  ]},

   "<b>غير المتخصّصة لا تستهدف نوعاً محدّداً وهي خط الدفاع الأوّل، والمتخصّصة تستهدف نوعاً محدّداً.</b>",
   "<b>خلايا الدم البيضاء الأكولة أوّل من يبدأ بالدفاع عند دخول مسبّب المرض.</b>",

   "<b>الغدة الزعترية (الثيموسية) تنشّط وتنضج الخلايا التائية</b>، لا البائية.",

   "<b>الطحال يخزن الدم ويحطّم خلايا الدم الحمراء التالفة.</b>",

  ]}

 id:"u1-01", unit:"أحياء 1", name:"دراسة الحياة", page:"5",
 viz:[
  {k:"idea", t:"ثلاثة أشياء تُسأل في هذا الموضوع: ثماني خصائص يجب أن تجتمع كلّها في المخلوق الحي، وستّ خطوات للطريقة العلمية بترتيبها، ومتغيّران في التجربة لا يُخلط بينهما."},
  {k:"text", h:"الشرح", secs:[
   {t:"علم الأحياء وماذا يعمل علماؤه", p:[
    "<b>علم الأحياء:</b> العلم الذي يهتمّ بدراسة أصل الحياة وتاريخها وكل ما كان حيّاً يوماً ما، وتركيب المخلوقات الحية وكيف تقوم بوظائفها وكيف تتفاعل مع بعضها.",
    "<b>دراسة تنوّع الحياة:</b> العالم ابن سينا درس تراكيب النباتات ووصفها وصفاً دقيقاً، ووصف أنواعاً مختلفة من الحيوانات.",
    "<b>البحث في الأمراض:</b> ابن البيطار مؤلّف كتاب المغني في الأدوية المفردة في العقاقير · أبو بكر الرازي أوّل من وصف الجدري والحصبة.",
    "<b>تطوير التقنيات:</b> اليد الاصطناعية والحواسيب · والعالم تشارلز درو: طرق حفظ الدم ونقله وفصله عن بلازما الدم، وإنشاء بنوك الدم.",
    "<b>تحسين الزراعة:</b> رفع مقاومة النباتات للأمراض وزيادة تحمّلها للظروف المناخية الصعبة عن طريق الهندسة الوراثية.",
    "<b>حماية البيئة:</b> حماية الأنواع المهدّدة بالانقراض بالمحميات الطبيعية، وتنظيم الصيد."]},
   {t:"خصائص الحياة الثمانية", p:[
    "<b>والمخلوق الحي يجب أن يحمل الصفات الثماني جميعها.</b>",
    "<b>1 مكوّن من خلية أو أكثر:</b> الخلية وحدة التركيب والوظيفة في المخلوق الحي. وتنقسم المخلوقات إلى وحيدة الخلية مثل البكتيريا والبراميسيوم، وعديدة الخلايا مثل الطيور والنباتات.",
    "<b>2 إظهار التنظيم (التعضي):</b> والترتيب مهمّ: خلايا ← أنسجة ← أعضاء ← أجهزة ← جسم الكائن الحي.",
    "<b>3 النمو:</b> الزيادة في كتلة المخلوق الحي، مثل نموّ أبي ذنيبة ليصبح ضفدعاً، ونموّ الطفل ليصبح شاباً.",
    "<b>4 التكاثر:</b> إنتاج أفراد جديدة للحفاظ على النوع من الانقراض، وهو انتقال الصفات من جيل إلى آخر. <b>وهو خاصية ليست أساسية للفرد، مهمة للنوع.</b>",
    "<b>5 الحاجة إلى الطاقة:</b> يُعتبر الغذاء مصدراً للطاقة. والنباتات ذاتية التغذّي تصنع غذاءها بنفسها، والحيوانات غير ذاتية التغذّي تتغذّى على غيرها.",
    "<b>6 الاستجابة للمثيرات:</b> المثير أي شيء يسبّب ردّة فعل المخلوق الحي. والاستجابة ردّة فعل المخلوق الحي للمثير، مثل انتحاء النبات نحو الضوء، واندفاع القرش عندما يشمّ رائحة الدم.",
    "<b>7 الحفاظ على الاتزان الداخلي:</b> تنظيم الظروف الداخلية للفرد من أجل الحفاظ على حياته، مثل إفراز العرق لخفض حرارة الجسم، والتبوّل، والمحافظة على نسبة السكر في الدم.",
    "<b>8 التكيّف:</b> ملاءمة أي تركيب في جسم المخلوق الحي للوظيفة التي يؤديها للحفاظ على بقاء نوعه، <b>وهي صفة وراثية</b>. مثل تحوّر الأوراق إلى أشواك، والأوراق ذات القمة الناقطة، وفرو الدبّ القطبي. <b>ويزداد فقدان الماء بزيادة مساحة سطح الورقة، لذا تتكيّف النباتات الصحراوية بتقليل مساحة سطح الورقة للحفاظ على الماء.</b>"]},
   {t:"العلم الطبيعي (التجريبي)", p:[
    "بناء من المعرفة يعتمد على دراسة الطبيعة من خلال البحث العلمي. مثل: الكيمياء والأحياء والفيزياء وعلوم الأرض.",
    "<b>النظرية:</b> تفسير لظاهرة طبيعية مدعوم بعدد من الملاحظات والأدلة والتجارب.",
    "<b>خصائص العلم الطبيعي:</b> يعتمد على الدليل · يوسّع المعرفة العلمية · ينتج أسئلة · يتحدّى النظريات المقبولة · يختبر الاستنتاجات · <b>يخضع لمراجعة الأقران</b> · <b>يستخدم النظام المتري</b>.",
    "<b>مراجعة الأقران:</b> عملية يتمّ بها فحص طرائق إجراء التجارب ودقة النتائج على أيدي علماء من التخصّص نفسه وعلماء يجرون بحوثاً متشابهة.",
    "<b>النظام المتري:</b> الكيلوجرام لقياس الكتلة · الثانية لقياس الزمن · اللتر لقياس الحجم · المتر لقياس الطول."]},
   {t:"الطريقة العلمية والتجربة", p:[
    "<b>الطريقة العلمية:</b> طريقة لجمع المعلومات والعثور على إجابات لحلّ المشكلات العلمية. وخطواتها ستّ: <b>1 طرح السؤال</b> (أو الملاحظة) وهي أوّل خطوة وطريقة مباشرة لجمع المعلومات بشكل منظّم · <b>2 صياغة الفرضية</b> وهي اعتقاد أو تفسير قابل للاختبار · <b>3 التجربة</b> اختبار صحة الفرضية تحت ظروف شديدة الانضباط · <b>4 تجميع البيانات</b> · <b>5 تحليل البيانات</b> للتأكّد هل البيانات تدعم فرضيته · <b>6 الاستنتاجات</b> وهو افتراض أو حكم مبني على معلومات أو خبرات سابقة.",
    "<b>البيانات نوعان:</b> <b>كمية</b> التي تُجمع على هيئة أرقام مثل قياس الطول والكتلة · <b>ووصفية</b> ما تدركه الحواس الخمس مثل الملمس واللون والطعم والرائحة.",
    "<b>المجموعة الضابطة:</b> تُستخدم للمقارنة وتبقى دون تغيير. <b>والمجموعة التجريبية:</b> التي ستتعرّض لتأثير العامل المراد اختباره (يتمّ إجراء التغيير عليها).",
    "<b>المتغيّر المستقل:</b> العامل الذي يتمّ تغييره، وهو الذي نريد اختباره ويمكن أن يؤثّر على النتيجة. <b>والمتغيّر التابع:</b> العامل الذي ينتج عن العامل المستقل ويعتمد عليه.",
    "<b>الاستقصاء:</b> طريقة لجمع المعلومات عن موضوع ما، ويتمّ ذلك من خلال الملاحظة وجمع البيانات بدلاً من التحكّم في المتغيرات بشكل محكم."]}
  ]},

 id:"u1-03", unit:"أحياء 1", name:"البكتيريا والفيروسات", page:"7 إلى 9",
 viz:[
  {k:"idea", t:"بدائيات النوى مملكتان يفرّقهما الببتيدوجلايكان. والفيروس ليس منهما ولا من غيرهما، لأنه ليس مخلوقاً حياً أصلاً: شريط مادة وراثية في غلاف بروتيني، لا يتكاثر إلا داخل خلية حية."},
  {k:"text", h:"الشرح", secs:[
   {t:"المخلوقات بدائية النوى", p:[
    "مخلوقات حية مجهرية <b>بدائية النوى</b> — ليس لها نواة ولكنها تحتوي على DNA — <b>وحيدة الخلية</b>، ولا تحتوي على عضيات محاطة بأغشية، <b>وتفتقر إلى غشاء النواة (الغشاء النووي)</b>. وهي <b>البدائيات والبكتيريا</b>.",
    "<b>البدائيات مخلوقات محبّة للظروف القاسية</b>، وأنواعها: <b>محبة للحموضة والحرارة</b> تعيش في البيئات الحامضية الساخنة وحول فوهات البراكين والينابيع الساخنة · <b>محبة للملوحة</b> هوائية عادةً، تعيش في البيئات المالحة جداً مثل البحر الميت والبحيرة المالحة العظمى · <b>منتجة لغاز الميثان</b> لاهوائية تموت في وجود الأكسجين، تستخدم CO2 في التنفس وتخرج الميثان كمخلفات، وتوجد في مياه المجاري والمستنقعات.",
    "<b>وعلى عكس البدائيات، لا تعيش البكتيريا في البيئات القاسية.</b>"]},
   {t:"تركيب الخلية البكتيرية", p:[
    "<b>الكروموسومات:</b> تكون جينات البدائيات على شكل <b>كروموسوم حلقي</b> يسمّى نظير النواة. والـDNA يوجد بالسيتوبلازم على شكل قطع حلقية صغيرة تسمّى <b>البلازميد</b> وتتكوّن من نيوكليوتيدات.",
    "<b>المحفظة:</b> تساعدها على الالتصاق بالسطوح وتحميها من الجفاف والمضادات الحيوية وابتلاع خلايا الدم البيضاء لها.",
    "<b>الهديبات:</b> تراكيب دقيقة تشبه الشعيرات وتساعد على الالتصاق بالأسطح، وتعمل <b>كجسر يربط بين الخلايا</b>، وتلعب دوراً في التكاثر بالاقتران (تبادل المادة الوراثية).",
    "<b>الجدار الخلوي:</b> في <b>البكتيريا</b> يحتوي على ببتيدوجلايكان، وفي <b>البدائيات</b> لا يحتوي عليه. والببتيدوجلايكان مكوّن من سكريات ثنائية وقطع ببتيدية.",
    "<b>والحركة في البدائيات:</b> بالأسواط أو الانزلاق."]},
   {t:"أشكال البكتيريا وصبغة جرام", p:[
    "<b>الأشكال:</b> كروية (مستديرة) · عصوية · حلزونية (ولبية) مثل الثريبونيما. <b>ومن الأمثلة على البكتيريا المكوّرة بكتيريا المكورات السبحية الرئوية التي تسبّب التهاب الرئة.</b>",
    "<b>صبغة جرام:</b> تُستخدم لتحديد نوع الجدار الخلوي للبكتيريا ليتمّ وصف المضاد الحيوي المناسب.",
    "<b>موجبة جرام:</b> طبقة خارجية سميكة من الببتيدوجلايكان، ولون الجدار <b>بنفسجي داكن (قرمزي)</b>. <b>وسالبة جرام:</b> طبقة دهون وكمية قليلة من الببتيدوجلايكان، ولون الجدار <b>وردي فاتح (زهري)</b>."]},
   {t:"التكاثر والأيض والبقاء", p:[
    "<b>تتكاثر بدائيات النوى تكاثراً لا جنسياً</b> عن طريق: <b>الانقسام الثنائي</b> انقسام الخلية إلى خليتين متماثلتين وراثياً، ومعظم البدائيات تتكاثر به (يحدث كل 20 دقيقة في الظروف البيئية المثالية)، <b>ولا ينتج عنه سلالات جديدة</b> · <b>والاقتران</b> تبادل المادة الوراثية عبر الهديبات بين خليتين بعد التصاقهما، <b>ويُعدّ عملية جنسية ولا يُعتبر تكاثراً جنسياً</b>، <b>وينتج عنه سلالات جديدة</b>.",
    "<b>عملية الأيض:</b> مجموعة من التفاعلات الكيميائية التي تحدث في المخلوق الحي لإنتاج الطاقة.",
    "<b>أنواع التغذية:</b> <b>ذاتية التغذّي</b> — كيميائية بالتمثيل الكيميائي، وضوئية عن طريق البناء الضوئي مثل البكتيريا الخضراء المزرقة · <b>وغير ذاتية التغذّي</b> — متكافلة علاقة تبادل منفعة مثل بكتيريا رايزوبيام، ومترمّمة تتغذّى على المخلوقات الميتة (المركّبات العضوية)، ومتطفلة تسبّب المرض مثل بكتيريا الكلاميديا. <b>والتمثيل الكيميائي:</b> عندما تتغذّى البكتيريا ذاتياً وتستخدم مركّبات عضوية.",
    "<b>التنفس:</b> هوائية تحتاج إلى O2 · ولاهوائية لا تحتاج إليه وتحصل على الطاقة من عملية التخمّر.",
    "<b>بقاء البكتيريا بطريقتين:</b> <b>الأبواغ الداخلية</b> خلايا كامنة تنتجها بعض البكتيريا عند الظروف البيئية القاسية لحماية مادتها الوراثية وإبقائها حيّة لفترات طويلة، وتتحمّل الظروف القاسية مثل البرودة الشديدة وتعود للنمو عند تحسّن الظروف · <b>والطفرات</b> تغيّرات عشوائية مفاجئة في تسلسل DNA تقود إلى أشكال جديدة من الجينات وصفات جديدة وتنوّع وراثي."]},
   {t:"أهمية البكتيريا وأمراضها", p:[
    "<b>تثبيت النيتروجين:</b> البكتيريا المثبتة للنيتروجين الموجودة على عقد جذور البقوليات، وتمثّل علاقة تكافل (تبادل المنفعة / تقايض).",
    "<b>في جسم الإنسان:</b> تسمّى <b>الفلورا الطبيعية</b>، مثل بكتيريا <b>أشيرشيا كولاي</b> التي تتبادل المنفعة مع الإنسان، حيث تعيش في الأمعاء وتنتج <b>فيتامين K</b>. <b>وبما أنها تعيش في الأمعاء، فإن وجودها في الماء يدلّ على تلوّثه بمياه الصرف الصحي.</b>",
    "<b>إنتاج الغذاء والدواء:</b> صناعة الجبن واللبن والزبادي والمخلل والشيكولاتة، وإنتاج المضادات الحيوية مثل التتراسايكلين والستربتومايسين والفانكومايسين. <b>والعالم ألكسندر فلمنج اكتشف دواء البنسلين (المضاد الحيوي).</b>",
    "<b>أمراض بكتيرية:</b> تنفسية (ذات الرئة، السعال الديكي، السلّ الرئوي، الجمرة الخبيثة) · جلدية (حب الشباب، البثور) · القناة الهضمية (تسمّم الغذاء، الكوليرا) · الجهاز العصبي (التسمّم الوشيقي البوتيوليني، التيتانوس، التهاب السحايا البكتيري) · تنتقل بواسطة الجنس (السفلس الزهري، السيلان) · أخرى (تسوس الأسنان، مرض لايم، حمى التيفوئيد).",
    "<b>وتُعالج الأمراض البكتيرية بالمضادات الحيوية.</b> وتقاوم بعض البكتيريا المضادات بسبب تراكيب جدارها أو الطفرات. وعند الإفراط في تناول المضادات تتولّد بكتيريا مقاومة للمضاد الحيوي."]},
   {t:"الفيروسات", p:[
    "<b>الفيروس:</b> شريط <b>غير حي</b> من مادة وراثية يحاط بغلاف بروتيني. <b>ولا تُعدّ الفيروسات مخلوقات حية لذلك توضع في تصنيف خاص بها.</b> وتعتمد في تكاثرها على المخلوقات الحية الأخرى — أي أنها لا تنمو في بيئة صناعية مثلاً — <b>وهي عديمة الخلايا، ويُقاس حجمها بالنانومتر</b>.",
    "<b>تركيبها:</b> تشترك معظم الفيروسات بوجود <b>المحفظة البروتينية</b>، والمادة الوراثية تكون DNA أو RNA. <b>وتصنّف الفيروسات حسب نوع الحمض النووي.</b> ومن أمثلتها: بكتيريوفاج (آكل البكتيريا) · الفيروس الغدي (يسبّب الزكام) · فيروس الأنفلونزا · تبرقش نبات أوراق التبغ.",
    "<b>الفيروس الارتجاعي:</b> فيروس مادته الوراثية RNA بدلاً من DNA، مثل مرض نقص المناعة المكتسبة (الإيدز HIV).",
    "<b>البريونات:</b> البروتين الذي يسبّب العدوى أو المرض، وهو اختصار لـ«الدقيقة البروتينية المعدية». ومن الأمراض التي تسبّبها: جنون البقر، والاعتلال الدماغي الإسفنجي (كروتزفلدت جاكوب) الذي يصيب الخلايا العصبية في الدماغ ويسبّب انفجارها.",
    "<b>ولا يستطيع الفيروس الدخول إلى خلايا الكائن الحي إلا إذا كانت الخلايا تحتوي على مستقبلات تتطابق مع بروتينات الفيروس</b> (مثل المفتاح والقفل)، ثم يلتصق الفيروس بغشاء الخلية ويتكاثر. ولذلك تُستخدم بعض الأدوية التي تمنع هذا الالتصاق كوسيلة للوقاية من العدوى الفيروسية.",
    "<b>والأمراض الفيروسية لا تُعالج بالمضادات الحيوية.</b>"]}
  ]},

 id:"u1-04", unit:"أحياء 1", name:"الطلائعيات", page:"10",
 viz:[
  {k:"idea", t:"الطلائعيات تُصنّف حسب التغذية إلى ثلاث: شبيهة بالحيوانات وشبيهة بالنباتات وشبيهة بالفطريات. والشبيهة بالحيوانات تُصنّف مرّة أخرى حسب طريقة الحركة إلى أربع. فالتصنيف طبقتان لا طبقة."},
  {k:"text", h:"الشرح", secs:[
   {t:"ما الطلائعيات", p:[
    "مخلوقات <b>وحيدة الخلية أو عديدة الخلايا، حقيقية النوى</b>، يحتوي الجدار الخلوي لبعضها على السليلوز.",
    "<b>الميكروسبورديا:</b> طلائعيات متطفلة تسبّب أمراضاً للحشرات، لذلك تُستخدم كمبيد حشري.",
    "<b>وتُصنّف الطلائعيات حسب التغذية:</b> شبيهة بالحيوانات · شبيهة بالنباتات · شبيهة بالفطريات."]},
   {t:"بعض الأعضاء ووظائفها", p:[
    "<b>القشيرة:</b> غطاء للجسم.",
    "<b>الأكياس الخيطية:</b> ينطلق منها أشواك للدفاع أو صيد الفريسة، ولها دور في التغذّي.",
    "<b>الفجوات المنقبضة:</b> جمع الماء الزائد والتخلّص منه خارج الخلية، <b>فتحافظ على الاتزان الداخلي</b>.",
    "<b>وتُستخدم الأهداب والأسواط والأقدام الكاذبة في الحركة والتغذّي.</b>"]},
   {t:"الشبيهة بالحيوانات (الأوليات)", p:[
    "<b>مجهرية لا تُرى بالعين المجرّدة، وغير ذاتية التغذّي، وتُصنّف حسب طريقة الحركة.</b>",
    "<b>الهديبات:</b> تتحرّك بالأهداب. مثل <b>البراميسيوم</b>، وحيد الخلية، <b>لديه نواتان</b>، ويتغذّى بالبلعمة. <b>وتتكاثر الهديبات بالانقسام الثنائي (تكاثر لا جنسي)، والاقتران (عملية جنسية).</b>",
    "<b>اللحميات (جذريات القدم):</b> تتحرّك وتتغذّى بالأقدام الكاذبة. مثل الأميبا وجيارديا لامبليا. <b>ومرض الزحار الأميبي (الدوسنتاريا)</b> تسبّبه إنتاميبا هستولتيكا، ويدخل إلى الجسم مع الماء والطعام الملوّثين. <b>والمثقّبات</b> لها قشيرة من كربونات الكالسيوم تكوّن الأحافير، <b>والشعاعيات</b> لها غلاف قاس من السليكا. وتُستخدم أحافير بقايا المثقّبات لتحديد عمر الصخور وتحديد المواقع المحتملة للنفط.",
    "<b>السوطيات:</b> تتحرّك بالأسواط. مثل <b>التريانوسوما</b> التي تسبّب مرض النوم بنوعيه.",
    "<b>البوغيات القمية:</b> <b>ليس لها وسيلة حركة</b> (تتحرّك بالانزلاق)، <b>وليس لها فجوات منقبضة</b>. مثل: البلازموديوم الذي يسبّب مرض الملاريا. <b>ومرض الملاريا تنقله أنثى بعوضة الأنوفليس.</b>"]},
   {t:"الشبيهة بالنباتات (الطحالب)", p:[
    "<b>ذاتية التغذّي</b> بالبناء الضوئي، وتحوي <b>الكلوروفيل كصبغة أساسية</b>، وتختلف في ألوانها بسبب احتوائها على صبغات ثانوية مختلفة تمتصّ الضوء.",
    "<b>الدياتومات (تشبه الصندوق):</b> تتكوّن جدرها من <b>السليكا</b> التي تُستخدم في تلميع الأسنان والفلزات. وتُخزن الطعام على هيئة <b>زيوت</b> مما يمكّنها من الطفو على سطح الماء. وتتكاثر جنسياً ولا جنسياً، وتمتلك <b>صبغة الكاروتين</b> (اللون الأصفر).",
    "<b>السوطيات الدوارة:</b> تحتوي على سوطين أحدهما متعامد على الآخر (يساعدانها على الحركة). <b>والمدّ الأحمر:</b> تلوّث المياه بلون أحمر نتيجة للسموم التي تنتجها السوطيات الدوارة في البحر.",
    "<b>اليوجلينات:</b> تمتلك صفات النباتات والحيوانات معاً. صُنّفت من الطحالب لقيامها بعملية <b>البناء الضوئي</b> بواسطة البلاستيدات الخضراء وبمساعدة <b>البقعة العينية</b> التي توجّهها للضوء. <b>ولديها قشيرة بدلاً من الجدار الخلوي.</b> ومثالها اليوجلينا.",
    "<b>الطحالب الحمراء (صبغة الفيكوبلين):</b> تُستخدم في الطعام، مثل كورالين. <b>والطحالب الخضراء (صبغة الكلوروفيل):</b> الاسبيروجيرا يحتوي على بلاستيدة حلزونية الشكل · ألدسميد وحيد الخلية · فولفكس مستعمرات. <b>والطحالب الذهبية (صبغة الكاروتين). والطحالب البنية (صبغة الفيكوزانثين):</b> تُستعمل في الآيسكريم، مثل عشب البحر."]},
   {t:"الشبيهة بالفطريات", p:[
    "<b>تتغذّى بامتصاص المواد من المخلوقات الميتة أو المتحلّلة</b> — أي أنها غير ذاتية التغذّي.",
    "<b>وجدارها الخلوي يتكوّن من السليلوز.</b>",
    "<b>مثل:</b> الفطريات الغروية · والفطر المائي · والبياض الزغبي الذي يدمّر محصول البطاطس."]},
   {t:"مرض النوم", p:[
    "<b>مرض النوم الإفريقي (الشرقي والغربي):</b> المسبّب التريبانوسوما · العائل الأوّل (الناقل) <b>ذبابة تسي تسي</b> · العائل الثاني الإنسان.",
    "<b>مرض النوم الأمريكي (شاجاز):</b> المسبّب التريبانوسوما · العائل الأوّل <b>حشرة البقّ (رديوفيد)</b> · العائل الثاني الإنسان.",
    "<b>وكلٌّ من بعوضة الأنوفليس وذبابة التسي تسي والرديوفيد حشرات متطفلة على دم الإنسان وتنقل المرض من خلاله. أمّا ذباب المنزل لا يتطفّل على دم الإنسان بل ينقل الأمراض عن طريق تلوّث الطعام.</b>"]}
  ]},

 id:"u1-05", unit:"أحياء 1", name:"الفطريات", page:"11",
 viz:[
  {k:"idea", t:"الفطريات غير ذاتية التغذّي، وتُصنّف مرّتين: مرّة حسب كيف تحصل على الغذاء، ومرّة حسب تركيبها وطرائق تكاثرها إلى خمس شعب. والشعبة الخامسة — الناقصة — سُمّيت بما ينقصها: لا تتكاثر جنسياً."},
  {k:"text", h:"الشرح", secs:[
   {t:"أنواعها وتركيبها", p:[
    "<b>عديدة الخلايا</b> مثل المشروم (عيش الغراب)، <b>ووحيدة الخلايا</b> مثل الخميرة.",
    "<b>الخيوط الفطرية (الهيفات):</b> <b>وحدة البناء الأساسية</b> للفطريات عديدة الخلايا، وتتفرّع الخيوط الفطرية لتكوّن كتلة شبكية تسمّى <b>الغزل الفطري</b>. والجسم الثمري هو التركيب التكاثري فوق الأرض، والغزل الفطري تحت الأرض.",
    "<b>الجدار الخلوي:</b> يتكوّن من <b>الكايتين</b>، وهي مادة قوية مرنة عديدة التسكر يتكوّن منها الجدار الخلوي للفطريات والمفصليات كالحشرات والعناكب. ولديها <b>أشباه جذور</b> تقوم من خلالها بامتصاص الطعام والغذاء.",
    "<b>الحواجز:</b> تُقسّم الخيوط الفطرية إلى خلايا في بعض الفطريات، وتحوي ثقوباً واسعة تسمح للغذاء والسيتوبلازم والعضيات بالمرور بين الخلايا.",
    "<b>وتنتقل المواد المغذية في الخيوط غير المجزأة بشكل أسرع، لأنها توفّر سطحاً أكبر لامتصاص الغذاء.</b>"]},
   {t:"تغذية الفطريات", p:[
    "<b>الفطريات غير ذاتية التغذّي — لا تقوم بعملية البناء الضوئي.</b> وتنقسم إلى:",
    "<b>الرمية (المحلّلات):</b> تتغذّى على بقايا المخلوقات الميتة أو الفضلات العضوية. مثل: الفطر الكتيني والمشروم والخميرة والبنسليوم.",
    "<b>التطفلية:</b> تحصل على غذائها بالتطفّل على مخلوقات أخرى. مثل: تطفّل البياض الزغبي على أوراق العنب.",
    "<b>فطريات تبادل المنفعة:</b> تتكافل مع مخلوقات حية أخرى. مثل: الفطريات الموجودة على جذور البقوليات، والخيوط الفطرية على الأعشاب."]},
   {t:"طرق التكاثر اللاجنسية", p:[
    "<b>التبرعم:</b> مثل فطر الخميرة. حيث تنفصل البرعم عن الخلية الأم.",
    "<b>إنتاج الأبواغ:</b> <b>الحامل البوغي</b> هو الذي ينتج الأبواغ. <b>والبوغ خلية أحادية</b> المجموعة الكروموسومية (1N) لها غلاف صلب، تنمو فتصبح مخلوقاً جديداً دون اندماج الأمشاج.",
    "<b>التجزّؤ:</b> عندما يتجزّأ الغزل الفطري فإن كل جزء ينمو معطياً فطراً جديداً في الظروف الملائمة.",
    "<b>وتتكاثر معظم الفطريات جنسياً، ما عدا الفطريات الناقصة.</b>"]},
   {t:"الأشنات والفطريات الجذرية", p:[
    "<b>الأشنات:</b> فطريات مع طحالب أو مع بكتيريا خضراء مزرقة، وهي <b>علاقة تكافلية</b> (تبادل المنفعة) وتسمّى علاقة تقايض أيضاً.",
    "<b>والمؤشّر الحيوي:</b> مخلوق حسّاس للظروف البيئية المتغيّرة، مثل الأشنات، حيث تُعدّ مؤشّراً على مدى نقاء الجو أو تلوّثه في مكان تواجدها، <b>لأنها سريعة التأثّر بملوّثات الهواء</b>.",
    "<b>الفطريات الجذرية:</b> تزيد من إنتاج المحاصيل الزراعية للنباتات، مثل الجزر والبطاطا والذرة والطماطم. وتفرز إنزيمات لتحليل المواد العضوية وامتصاص الماء والأملاح من البيئة الخارجية، مثل التي تنمو على درنات البطاطس."]},
   {t:"الفوائد والأضرار", p:[
    "<b>في الطب:</b> البنسلين (مضاد حيوي) يُستخرج من فطر البنسليوم. <b>وفي الطعام:</b> الخبز والأجبان، مثل فطر الخميرة والكمأة والمشروم. <b>والمعالجة الحيوية:</b> مثل الأشنات.",
    "<b>أضرارها:</b> تسبّب أمراضاً منها مرض التهاب القدم عند الرياضيين، وصدأ القمح، والبياض الزغبي والدقيقي الذي يصيب الخضروات والفواكه."]}
  ]},

    {h:"التكاثر", v:["أبواغ سوطية","أبواغ كيسية","لا جنسياً وجنسياً بتكوين أبواغ اقترانية","أبواغ دعامية","لا جنسي فقط"], df:[0,1,2,3,4]}

   rows:[

    {h:"المثال", v:["الفطر الكتيني والمشروم والخميرة والبنسليوم","تطفّل البياض الزغبي على أوراق العنب","الفطريات على جذور البقوليات والخيوط الفطرية على الأعشاب"], df:[0,1,2]}
   ]},
  {k:"traps", h:"مصائد الاختبار", items:[
   "<b>جدار الفطريات من الكايتين</b>، ومنه أيضاً جدار المفصليات كالحشرات والعناكب.",
   "<b>الفطريات الناقصة لا تتكاثر جنسياً، وهو سبب تسميتها.</b> ومعظم الفطريات تتكاثر جنسياً ما عداها.",
   "<b>الكيسية أكبر شعب الفطريات.</b>",
   "<b>الخيوط غير المجزأة تنقل المواد المغذية أسرع</b>، لأنها توفّر سطحاً أكبر لامتصاص الغذاء.",
   "<b>البوغ خلية أحادية 1N لها غلاف صلب، تنمو دون اندماج الأمشاج.</b> والحامل البوغي هو الذي ينتجها.",
   "<b>الأشنات علاقة تكافلية بين فطر وطحلب أو بكتيريا خضراء مزرقة</b>، وهي مؤشّر حيوي لنقاء الجو لأنها سريعة التأثّر بملوّثات الهواء.",
   "<b>البنسلين يُستخرج من فطر البنسليوم</b>، والبنسليوم نفسه من الفطريات الناقصة.",
   "<b>الهيفات وحدة البناء الأساسية، وتجمّعها يسمّى الغزل الفطري.</b>",
   "<b>الدعامية تحمل نواتين عند التكاثر</b>، ومثالها عيش الغراب."
  ]}

 id:"u1-06", unit:"أحياء 1", name:"صور تلخيصية للحيوانات · مدخل إلى الحيوانات", page:"12 و13 و14",
 viz:[
  {k:"idea", t:"الحيوانات تُصنّف بثلاثة معايير مستقلّة: التناظر، والتجويف الجسمي، وموضع الفم في الجاسترولا. ولكل معيار سؤاله الخاص، ولا يغني أحدها عن الآخر."},
  {k:"text", h:"الشرح", secs:[
   {t:"الخصائص العامة للحيوانات", p:[
    "<b>عديدة الخلايا · حقيقية النوى · ولا تحتوي خلاياها على جدار خلوي.</b>",
    "<b>التغذية والهضم:</b> مخلوقات <b>غير ذاتية التغذّي</b>. والهضم إمّا داخل الخلايا، أو داخل تجاويف الجسم، أو داخل أعضاء خاصة.",
    "<b>الدعامة:</b> الفقاريات لها هيكل داخلي وعمود فقري للدعامة والحركة والحماية. واللافقاريات — وهي معظم الحيوانات — لها هيكل خارجي قوي وقاسٍ يحميها ويمنع فقدان الماء.",
    "<b>الحركة:</b> أغلبها متحرّكة، وبعض الأنواع تكون ثابتة مثل الإسفنج وتسمّى جالسة.",
    "<b>المواطن البيئية:</b> اليابسة والماء."]},
   {t:"التكاثر", p:[
    "<b>التكاثر الجنسي:</b> يتضمّن تزاوج ذكر ينتج الحيوانات المنوية المذكّرة وأنثى تنتج البويضات. و<b>الإخصاب الداخلي</b> في معظم الحيوانات حيث يتمّ داخل جسم الأنثى، و<b>الإخصاب الخارجي</b> في معظم الأسماك ويحتاج بيئة مائية.",
    "<b>التكاثر اللاجنسي:</b> <b>يتطلّب فرداً واحداً</b> لإنتاج أفراد متماثلين وراثياً. وطرقه: <b>التبرعم</b> يتكوّن وينمو البرعم الجديد على جسم أحد الأبوين، مثل الإسفنجيات واللاسعات · <b>التجزّؤ</b> تقسيم الأبوين لقطع ينمو كل منها لكائن جديد، مثل الإسفنجيات · <b>التجديد</b> ينمو فرد جديد من أجزاء مفقودة من الجسم، مثل دودة البلاناريا · <b>التكاثر العذري</b> تضع الإناث بيوضاً تعطي حيواناً جديداً دون الحاجة لتلقيحها، مثل ملكة النحل."]},
   {t:"مراحل النمو الجنيني المبكر", p:[
    "<b>الإخصاب:</b> اتحاد المشيج المذكّر بالمشيج المؤنّث.",
    "<b>1 الزيجوت (اللاقحة):</b> ناتج عملية الإخصاب. <b>2 التوتة (الموريولا). 3 البلاستيولا:</b> كرة ممتلئة بسائل. <b>4 الجاسترولا:</b> كيس ذو طبقتين من الخلايا، لها فتحة في إحدى نهايتيه يتكوّن منها الفم أو الشرج.",
    "<b>ومع بقاء كمية السيتوبلازم ثابتة، يبقى حجم الجنين ثابتاً خلال المراحل المبكرة من النمو الجنيني.</b>"]},
   {t:"طبقات الجسم (نموّ الأنسجة)", p:[
    "<b>الطبقة الخارجية:</b> ينمو منها الجلد والأنسجة العصبية.",
    "<b>الطبقة الوسطى:</b> ينمو منها الأنسجة العضلية، والجهاز التنفسي والدوران والإخراج.",
    "<b>الطبقة الداخلية:</b> ينمو منها القناة الهضمية وأعضاء الهضم."]},
   {t:"التناظر (التماثل)", p:[
    "<b>يصف التشابه أو الاتزان بين تراكيب جسم المخلوق الحي.</b>",
    "<b>عديم التناظر:</b> يكوّن شكلاً غير منتظم، ولا يملك تناظراً أو انتظاماً في تراكيب جسمه. مثل الإسفنج، وهو عديم الأنسجة والأعضاء.",
    "<b>التناظر الشعاعي:</b> تقسيم الحيوان عبر أي مستوى يمرّ خلال محوره المركزي إلى نصفين متساويين، <b>مما يساعده في الحركة في جميع الاتجاهات</b>. مثل اللاسعات (الهيدرا، قنديل البحر)، وشوكيات الجلد البالغة (نجم البحر).",
    "<b>التناظر الجانبي:</b> يمكن تقسيم جسم الحيوان طولياً إلى نصفين متماثلين. مثل الديدان والرخويات والمفصليات ويرقات شوكيات الجلد والحبليات (فقاريات ولافقاريات)."]},
   {t:"التجويف الجسمي وموضع الفم", p:[
    "<b>عديمة التجويف:</b> لا تحتوي تجويفاً (مصمتة). مثل البلاناريا.",
    "<b>كاذبة التجويف:</b> التجويف بين الطبقة الوسطى والداخلية. مثل الإسكارس.",
    "<b>حقيقة التجويف:</b> التجويف بين الطبقتين الوسطى. مثل دودة الأرض.",
    "<b>بدائية الفم:</b> يتكوّن فيها <b>الفم من أوّل فتحة</b> في الجاسترولا. وشعبها: الرخويات والديدان الحلقية والمفصليات.",
    "<b>ثانوية الفم:</b> يتكوّن فيها <b>الشرج من أوّل فتحة</b> في الجاسترولا. وشعبها: شوكيات الجلد والحبليات. <b>والاختلاف بينهما يكون في تكوّن الطبقة الوسطى.</b>",
    "<b>والمخلوقات المقسمة:</b> الديدان الحلقية والمفصليات والحبليات."]},
   {t:"شعبة الإسفنجيات وشعبة اللاسعات", p:[
    "<b>الإسفنجيات:</b> عديمة التناظر · عديمة الأنسجة والأجهزة والأعضاء · تغذية <b>ترشيحية</b> ترشح الجزيئات العالقة في الماء، <b>والهضم يكون داخل الخلايا</b> · حيوانات جالسة، والدعامة تتمثّل في وجود الشويكات · <b>لا يوجد جهاز عصبي</b>، والخلايا تستجيب للمثير بإغلاق الثقوب · معظمها خنثى تتكاثر جنسياً ولا جنسياً، واللاجنسي عن طريق التجزّؤ والتبرعم وإنتاج البريعمات.",
    "<b>الشويكات:</b> تراكيب صغيرة وتتجنّب المفترسات التغذّي على الإسفنج بسببها، وهي مصنوعة من كربونات الكالسيوم والسيليكا أو من ألياف بروتينية قوية تسمّى <b>الإسفنجين</b>، وتُستعمل في الاتصالات وتنظيف المنازل. وتُستخدم كغذاء لبعض الأسماك والسلاحف، وفي الأدوية (مضاد للبكتيريا والالتهابات والأورام).",
    "<b>اللاسعات:</b> تسمّى أيضاً الجوفمعويات · تناظرها <b>شعاعي</b> يساعدها في الحركة في جميع الاتجاهات · مفترسة <b>بالخلايا اللاسعة</b> الموجودة في اللوامس، والهضم بإنزيمات <b>التجويف المعوي الوعائي</b> · طافية على الماء أو جالسة · جهاز عصبي بسيط يتكوّن من <b>شبكة عصبية</b>.",
    "<b>الطور البوليبي:</b> يتكاثر لا جنسياً بالتبرعم، ويشبه الأنبوب. <b>والطور الميدوزي:</b> الجنس منفصل ويتكاثر جنسياً، ويشبه المظلة.",
    "<b>وشقائق النعمان تكوّن علاقة تكافل مع سرطان البحر والسمكة المهرجة، إضافةً إلى جذب السياح لألوانها الزاهية. ومادة هيدروكسي أباتيت (فوسفات الكالسيوم) من المرجان تُستعمل في العمليات الجراحية وإعادة بناء عظام الوجه والفك واليد والرجل.</b>",
    "<b>وطوائف اللاسعات:</b> الهيدرات (الهيدرا) · الزهريات (شقائق النعمان والمرجان) · الفنجانيات والصندوقيات (قناديل البحر)."]}
  ]},

 id:"u1-07", unit:"أحياء 1", name:"الديدان والرخويات", page:"15 و16",
 viz:[
  {k:"idea", t:"أربع شعب جميعها ذات تناظر جانبي، وتفترق في ثمانية محاور. وأسرع ما يفرّقها: التجويف — عديمة في المفلطحة، كاذبة في الأسطوانية، حقيقي في الرخويات والحلقية."},
  {k:"text", h:"الشرح", secs:[
   {t:"الديدان المفلطحة", p:[
    "<b>رقيقة ومسطحة · عديمة التجويف.</b>",
    "<b>تعيش:</b> متطفلة أو حرّة. <b>وتتغذّى:</b> بعضها عبر البلعوم، وبعضها عبر ممصات وخطاطيف.",
    "<b>التنفس:</b> بالانتشار. <b>والدوران:</b> بالانتشار، ولا تمتلك جهاز تنفّس أو رئوي.",
    "<b>الإخراج:</b> لها جهاز إخراجي يحوي <b>خلايا لهبية</b>. تُخرج <b>الفضلات</b> عن طريق <b>الفم</b>، و<b>الماء الزائد</b> عن طريق <b>خلايا لهبية</b>.",
    "<b>الاستجابة:</b> حبلان عصبيان طويلان متصلان بعقد عصبية. <b>والحركة:</b> بالانزلاق وانقباض وانبساط العضلات.",
    "<b>التكاثر:</b> جنسياً بإخصاب داخلي، ولا جنسياً بالتجديد."]},
   {t:"الديدان الأسطوانية", p:[
    "<b>أسطوانية الشكل · تجويف كاذب · مدبّبة من الطرفين.</b>",
    "<b>تعيش:</b> متطفلة أو حرّة، <b>ولها جهاز هضمي</b>.",
    "<b>التنفس والدوران:</b> بالانتشار. <b>والإخراج:</b> خلايا لهبية.",
    "<b>الاستجابة:</b> حبال عصبية متصلة بعقد عصبية. <b>والحركة:</b> بانقباض وانبساط العضلات بمساعدة <b>هيكل دعامي مائي</b>.",
    "<b>التكاثر:</b> جنسياً بالإخصاب الداخلي."]},
   {t:"الرخويات", p:[
    "<b>ذات تجويف حقيقي، ولها فم وشرج.</b> وبعضها <b>عباءة</b> — غشاء يحيط بالأعضاء الداخلية — تفرز كربونات الكالسيوم لتكوين <b>الصدفة</b>، مثل المحار.",
    "<b>المعيشة:</b> تعيش حرّة، ولها جهاز هضمي من فم وشرج و<b>طاحنة تشبه الأسنان</b>.",
    "<b>التنفس:</b> بالخياشيم.",
    "<b>الدوران:</b> <b>الرخويات السريعة</b> جهاز دوران <b>مغلق</b> مثل الأخطبوط والحبار · <b>والرخويات البطيئة</b> جهاز دوران <b>مفتوح</b> مثل الحلزون والمحار.",
    "<b>الإخراج:</b> النفريديا. <b>والاستجابة:</b> لها جهاز عصبي، وللأخطبوط دماغ وعيون.",
    "<b>الحركة:</b> المحار بالدفن بالقدم العضلية · الحلزون بالزحف بالقدم العضلية · الأخطبوط والحبار <b>بالدفع النفّاث</b> حيث يدخل الماء بالعباءة ويخرج من خلال السيفون.",
    "<b>التكاثر:</b> جنسي. ورخويات الماء إخصابها خارجي، ورخويات اليابسة إخصابها داخلي."]},
   {t:"الديدان الحلقية", p:[
    "<b>مقسمة إلى حلقات · تجويف حقيقي.</b>",
    "<b>المعيشة:</b> جهاز هضمي من فم وشرج يضمّ <b>حوصلة للتخزين</b> و<b>قانصة للطحن</b>.",
    "<b>التنفس:</b> بالجلد الرطب وبالخياشيم. <b>والدوران:</b> لها جهاز دوران مغلق. <b>والإخراج:</b> النفريديا.",
    "<b>الاستجابة:</b> لها دماغ وأحبال عصبية.",
    "<b>الحركة:</b> بانقباض وانبساط العضلات، ولها <b>هلب</b> — أشواك صغيرة — تساعدها في الحركة من خلال تثبيتها.",
    "<b>التكاثر:</b> لا جنسياً بالتجديد، وجنسياً بإخصاب داخلي. <b>والجنس يكون:</b> خنثى مثل ديدان الأرض وديدان العلق · أو منفصل في معظم الديدان الحلقية."]},
   {t:"الدوارات (العجليات)", p:[
    "<b>التناظر:</b> جانبي، مثل الديدان الأسطوانية. <b>والتجويف الجسمي:</b> تجويف كاذب، مثل الديدان الأسطوانية.",
    "<b>الهضم:</b> تملك قناة هضمية لها فتحتان (فم وشرج).",
    "<b>الجهاز الدوري والتنفس:</b> عن طريق الانتشار.",
    "<b>الحركة والتغذية:</b> <b>بالأهداب</b>.",
    "<b>التكاثر والمعيشة:</b> تتكاثر جنسياً، وتعيش في المياه العذبة."]}
  ]},

 id:"u1-08", unit:"أحياء 1", name:"المفصليات", page:"17 إلى 19",
 viz:[
  {k:"idea", t:"أربع طوائف يفرّقها ثلاثة أرقام: عدد أزواج الأرجل، وعدد أجزاء الجسم، وعدد قرون الاستشعار. فمن حفظ الأرقام الثلاثة لكل طائفة، عرفها دون حفظ أمثلتها."},
  {k:"text", h:"الشرح", secs:[
   {t:"خصائص المفصليات", p:[
    "<b>لافقاريات مقسمة الجسم، وجانبية التناظر، وحقيقية التجويف الجسمي، وذات فم بدائي، ولها هيكل خارجي صلب.</b>",
    "<b>تقسيم الجسم:</b> رأس · صدر · بطن. <b>ويلتحم الرأس والصدر في بعض المفصليات مكوّناً الرأس-صدر</b>، مثل جراد البحر.",
    "<b>الهيكل الخارجي:</b> يتكوّن من مادة <b>الكايتين</b>، ويتمثّل في: إعطاء الجسم شكله ودعامته · الحماية · منع فقدان الماء من الجسم.",
    "<b>الزوائد المفصلية:</b> تراكيب تنمو وتمتد من جسم الحيوان، منها الأرجل وقرون الاستشعار. وتُستخدم في الحركة والسباحة والتزاوج والإحساس والتغذية.",
    "<b>الانسلاخ:</b> عملية التخلّص من الهيكل الخارجي الواقي في المفصليات، <b>مما يعطيها القدرة على استمرار النمو</b>.",
    "<b>التكاثر:</b> تتكاثر المفصليات جنسياً، والإخصاب داخلي."]},
   {t:"تركيب جسم المفصليات", p:[
    "<b>الفقيم:</b> زوج من الزوائد الفكية تكيفت للسع أو اللدغ أو المضغ أو القصّ في المفصليات.",
    "<b>الإخراج:</b> يتمّ التوازن المائي وطرد الفضلات في المفصليات عن طريق <b>أنابيب ملبيجي</b> — أنابيب متصلة بالأمعاء تجمع الفضلات من الجسم وتصبّها في الأمعاء — <b>عدا طائفة القشريات فبالنفريديا</b>.",
    "<b>الفرمونات (أداة تواصل):</b> مادة كيميائية تفرزها المفصليات وتؤثّر في سلوك الأفراد الأخرى لنفس النوع، مثل النمل.",
    "<b>السمع:</b> تستخدم المفصليات غشاء الطبلة للسمع. <b>والإبصار:</b> عيون مركبة للرؤية، وعيون بسيطة للتمييز بين الضوء والظلام.",
    "<b>الحركة:</b> حيوانات نشطة وسريعة، قادرة على الزحف والمشي والتسلّق والحفر والسباحة والطيران، لوجود جهاز عضلي متقدّم فيها.",
    "<b>الأجهزة:</b> <b>الجهاز العصبي في الناحية البطنية</b> · <b>والجهاز الإخراجي في الناحية الظهرية</b> · ولها <b>جهاز دوراني مفتوح</b>.",
    "<b>وأصبح استعمال الإدارة المتكاملة للآفات والحشرات المسبّبة للأوبئة أسلوباً يتبعه كثير من المزارعين.</b>"]},
   {t:"طائفة ذوات الأرجل", p:[
    "<b>ذوات الأرجل المئة:</b> تتبع طائفة خطّافيات الأرجل · زوج واحد من الأرجل متصل بكل قطعة من البطن · <b>تتحرّك بسرعة</b>.",
    "<b>ذوات الأرجل الألف:</b> تتبع طائفة مزدوجة الأرجل · زوجان من الأرجل متصلان بكل قطعة من البطن، وزوج واحد متصل بكل قطعة من الصدر · <b>تتحرّك ببطء</b>."]},
   {t:"التحوّل في الحشرات وأجزاء الفم", p:[
    "<b>التحوّل:</b> تغيّرات نموّ متتابعة في شكل المخلوق الحي وتركيبه، وله نوعان:",
    "<b>التحوّل الكامل:</b> بيضة ثم يرقة ثم عذراء داخل شرنقة ثم حشرة بالغة. مثل: الفراش والنحل والخنافس. <b>والعذراء داخل الشرنقة هي الطور بعد اليسروع، ولا تتغذّى فيه الحشرة.</b>",
    "<b>التحوّل غير الكامل:</b> بيضة ثم حورية ثم حشرة كاملة. مثل: الجراد والنمل الأبيض واليعسوب. <b>والحورية حشرة غير ناضجة جنسياً وليس لها أجنحة.</b>",
    "<b>أجزاء فم الحشرات:</b> <b>أنبوبي</b> لامتصاص السوائل — الفراش والعث · <b>إسفنجي</b> للعق واللحس — الذباب المنزلي وذباب الفاكهة · <b>ثاقب/ماص</b> أنبوب للاختراق وامتصاص السوائل وتوصيلها للفم — البعوض والبقّ والبراغيث · <b>قارض</b> تمزيق وقطع وقضم الحيوان أو النبات — الجراد والخنافس والنمل والنحل.",
    "<b>تكيفات الأرجل في الحشرات:</b> المشي والحفر والزحف — الخنافس · وسائد على الأرجل للمشي والالتصاق بالأسقف — الذباب · جمع حبوب اللقاح — النحل · القفز — الجراد وصرصور الليل · المشي فوق الماء بوسائد مغطاة بشعر على أرجلها — صرصور الماء."]}
  ]},

 id:"u4-31", unit:"أحياء 4", name:"التراكيب الخلوية والعضيات", page:"50 و51",
 viz:[
  {k:"idea", t:"الخلية نوعان، وعضياتها ثلاث مجموعات: ما يوجد في النباتية وحدها، وما يوجد في الحيوانية وحدها، وما يوجد في جميع حقيقية النوى. فحفظ المجموعة أسهل من حفظ كل عضيّ وحده."},
  {k:"text", h:"الشرح", secs:[
   {t:"نوعا الخلايا", p:[
    "<b>الخلية:</b> وحدة التركيب والوظيفة في المخلوق الحي.",
    "<b>خلايا بدائية النوى:</b> ليس لها نواة، عضياتها غير محاطة بأغشية · يوجد الـDNA في <b>السيتوبلازم</b> · صغيرة الحجم · وهي البكتيريا والبدائيات.",
    "<b>خلايا حقيقية النوى:</b> لها نواة، عضياتها محاطة بأغشية · يوجد الـDNA في <b>النواة</b> · كبيرة الحجم · وهي الحيوانات والنباتات والفطريات والطلائعيات."]},
   {t:"ما يوجد في النباتية وحدها", p:[
    "<b>الجدار الخلوي:</b> شبكة من الألياف تحيط بالغشاء البلازمي وتعطي الدعامة والحماية للخلية النباتية، يتكوّن من <b>السليلوز</b> (كربوهيدرات معقدة).",
    "<b>البلاستيدات الخضراء:</b> عضيات لها ثايلاكويدات موجودة في الغشاء بها صبغة <b>الكلوروفيل</b>، ويتمّ فيها عملية <b>البناء الضوئي</b> — تحويل الطاقة الضوئية إلى كيميائية."]},
   {t:"ما يوجد في الحيوانية وحدها", p:[
    "<b>المريكزات (السنتريولات):</b> أنيبيبات دقيقة على شكل أزواج تؤدي دوراً في انقسام الخلية الحيوانية.",
    "<b>الأجسام المحلّلة (الليسوسومات):</b> حويصلة تحتوي على إنزيمات لهضم وتحليل العضيات والمواد المغذية الزائدة والبكتيريا والفيروسات."]},
   {t:"ما يوجد في جميع حقيقية النوى", p:[
    "<b>الفجوات:</b> حويصلات محاطة بغشاء تقوم بتخزين المواد — الغذاء والماء والفضلات — بشكل مؤقّت في السيتوبلازم. <b>وهي كبيرة في الخلايا النباتية، وصغيرة جداً في الحيوانية.</b>",
    "<b>الشبكة الإندوبلازمية:</b> <b>الخشنة</b> ترتبط مع الرايبوسومات لبناء البروتينات · <b>والملساء</b> بناء الدهون، وتعمل في الكبد على إزالة سموم الجسم الضارة.",
    "<b>الهيكل الخلوي:</b> إعطاء الخلية شكلها وتدعيمها وحركة المواد فيها. ويتكوّن من أنيبيبات دقيقة (تراكيب أسطوانية بروتينية طويلة مجوفة) وخيوط دقيقة (رفيعة).",
    "<b>جهاز جولجي:</b> يقوم بتغليف البروتين داخل الحويصلات ويعدله لنقله خارج الخلية.",
    "<b>الميتوكندريون (مصانع الطاقة):</b> عضية محاطة بغشاء <b>تنتج الطاقة للخلية</b>، وتوجد بكثرة في خلايا المخ.",
    "<b>النواة:</b> مركز السيطرة وتنظيم العمليات في الخلية. تحوي النوية و DNA الخلية الذي يخزن المعلومات الوراثية. وتُحاط <b>بغشاء نووي</b> يحوي ثقوباً تسمح للمواد بالدخول والخروج للنواة."]},
   {t:"ما يوجد في جميع الخلايا", p:[
    "<b>الغشاء البلازمي:</b> حاجز مرن ينظّم حركة المواد من الخلية وإليها.",
    "<b>الرايبوسومات (مواقع بناء البروتين):</b> عضيات <b>غير غشائية</b> تنتج البروتينات، ويتمّ تصنيعها في <b>النوية</b>، وتتكوّن من RNA وبروتين.",
    "<b>الأسواط:</b> امتدادات تساهم في الحركة والغذاء، وهي <b>أطول طولاً وأقلّ عدداً من الأهداب</b>. <b>والأهداب:</b> تساهم في الحركة والغذاء، <b>أقصر طولاً وأكثر عدداً</b>، وهي زوائد تشبه الشعر. <b>وتوجدان في البدائية وبعض حقيقية النوى.</b>"]},
   {t:"الغشاء البلازمي وتركيبه", p:[
    "<b>معظمه دهون (ليبيدات)</b>، حيث يتكوّن من طبقتين من الدهون المفسفرة المزدوجة، له <b>خاصية النفاذية الاختيارية</b> التي تنظّم دخول وخروج المواد، ويشبه في آلية عمله فلاتر المياه.",
    "<b>والدهون المفسفرة تتكوّن من:</b> رأس قطبي (محب للماء) وذيل غير قطبي (كاره للماء).",
    "<b>البروتينات:</b> تُشكّل قنوات تنتقل عبرها المواد، وبالتالي فهي تساهم في النفاذية الاختيارية.",
    "<b>الكولسترول:</b> يساعد على منع التصاق ذيول الأحماض الدهنية، مما يزيد مرونة وسيولة الغشاء البلازمي.",
    "<b>السلسلة الكربوهيدراتية:</b> تساعد الخلايا المقاومة للمرض على تمييز الخلية الضارة ومهاجمتها."]}
  ]},

   "<b>الرايبوسومات عضيات غير غشائية وتُصنع في النوية</b>، وتوجد في جميع الخلايا.",
   "<b>الشبكة الخشنة لبناء البروتينات والملساء لبناء الدهون وإزالة السموم في الكبد.</b>",
   "<b>الأسواط أطول وأقلّ عدداً، والأهداب أقصر وأكثر عدداً.</b>",
   "<b>الميتوكندريون يوجد بكثرة في خلايا المخ.</b>",
   "<b>الكولسترول يزيد مرونة وسيولة الغشاء</b> بمنع التصاق ذيول الأحماض الدهنية.",
   "<b>الدهون المفسفرة: رأس قطبي محب للماء وذيل غير قطبي كاره للماء.</b>",
   "<b>جهاز جولجي يغلّف البروتين ويعدله لنقله خارج الخلية</b>، ولا ينتجه."
  ]}
 ],

  {p:"الفرق بين الأسواط والأهداب.",

   e:"الأسواط أطول طولاً وأقلّ عدداً من الأهداب، والأهداب أقصر وأكثر عدداً وتشبه الشعر."},
  {p:"حجم الفجوات في الخلايا الحيوانية.",

 id:"u4-32", unit:"أحياء 4", name:"كيمياء الخلية", page:"52",
 viz:[
  {k:"idea", t:"أربع مجموعات من الجزيئات الحيوية الكبيرة، ولكلٍّ وحدة بناء ووظيفة. فمن ربط كل مجموعة بوحدتها ووظيفتها، أمسك الباب. والإنزيمات بروتينات، فهي فرع من المجموعة الثالثة لا مجموعة خامسة."},
  {k:"text", h:"الشرح", secs:[
   {t:"الجزيئات الحيوية", p:[
    "تتكوّن خلايا المخلوقات الحية من <b>مركّبات عضوية</b> يدخل في تركيبها <b>الكربون</b> بوصفه عنصراً أساسياً.",
    "<b>الجزيئات الكبيرة:</b> جزيئات ضخمة تتكوّن من ارتباط جزيئات عضوية أصغر.",
    "<b>البوليمرات:</b> جزيئات مكوّنة من وحدات متكرّرة من مركّبات متشابهة أو قريبة تسمّى <b>الوحدات الأساسية (مونومرات)</b>.",
    "<b>وتقسيم الجزيئات الحيوية الكبيرة أربعة:</b> الكربوهيدرات · البروتينات · الدهون · الأحماض النووية."]},
   {t:"الكربوهيدرات", p:[
    "<b>تتكوّن من:</b> الكربون والهيدروجين والأكسجين بنسبة <b>1:2:1</b>.",
    "<b>الصيغة العامة:</b> (CH2O)n.",
    "<b>الوظيفة:</b> تصدر وتخزن الطاقة · داعم تركيبي للجدار الخلوي.",
    "<b>أنواعها:</b> <b>أحادية</b> الجلوكوز والفركتوز والجالاكتوز · <b>ثنائية</b> المالتوز والسكروز واللاكتوز، وتتكوّن من ارتباط سكرين أحاديين: المالتوز (سكر الشعير) = جلوكوز + جلوكوز · السكروز (سكر الطعام) = جلوكوز + فركتوز · اللاكتوز (سكر الحليب) = جلوكوز + جالاكتوز · <b>معقدة (عديدة)</b> السليلوز والنشا والجلايكوجين والكايتين.",
    "<b>والسليلوز مبلمر ضخم من الجلوكوز.</b> <b>والكايتين</b> من المركّبات عديدة التسكر التي تحوي <b>النيتروجين</b>، ولونه بني، ويوجد في الجدار الخلوي للفطريات والهيكل الخارجي للمفصليات."]},
   {t:"الدهون", p:[
    "<b>وحدتها البنائية:</b> الأحماض الدهنية والجليسرول.",
    "<b>الوظيفة:</b> تخزين الطاقة — <b>وتُعدّ أكبر مصدر للطاقة في الجسم</b> · ومعظم الغشاء البلازمي دهون.",
    "<b>أمثلة:</b> الشحوم والزيوت والشمع — الذي يوجد في خلايا النحل وعلى أوراق النباتات «الكيوتيكل» لمنع فقدان الماء.",
    "<b>أنواعها:</b> <b>مشبعة</b> رابطة أحادية بين ذرات الكربون · <b>غير مشبعة</b> رابطة ثنائية فأكثر بين ذرات الكربون · <b>مفسفرة</b> تعمل كحاجز في الأغشية الخلوية، ولا تذوب في الماء لأن الدهون كارهة للماء · <b>ستيرويدات</b> مثل الكولسترول والهرمونات.",
    "<b>ويدخل الكولسترول في إنتاج دهون ضرورية أخرى، مثل فيتامين D وهرمونات الإستروجين والتستوستيرون.</b>"]},
   {t:"البروتينات والإنزيمات", p:[
    "<b>تتكوّن من الأحماض الأمينية</b> التي ترتبط مع بعضها <b>بروابط ببتيدية</b>. وهي مركّبات صغيرة مكوّنة من الكربون والنيتروجين والأكسجين والهيدروجين.",
    "<b>تركيب الحمض الأميني:</b> ذرة كربون محاطة بـ4 روابط: <b>الأمين (NH2−)</b> · <b>الكربوكسيل (COOH−)</b> · ذرة هيدروجين · مجموعة ألكيل (R).",
    "<b>وظيفة البروتين:</b> توفير دعم تركيبي (مثل الشعر الذي يتكوّن من بروتين الكيراتين) · نقل المواد (مثل خلايا الدم الحمراء) · الهرمونات · الإنزيمات · توصيل الإشارات بين الخلايا.",
    "<b>الإنزيمات:</b> محفّزات حيوية تزيد من سرعة التفاعل بخفض <b>طاقة التنشيط</b>.",
    "<b>طاقة التنشيط:</b> الحد الأدنى من الطاقة اللازمة لحدوث تفاعل كيميائي. <b>والمحفّز:</b> مادة تقلّل من طاقة التنشيط. <b>والموقع النشط:</b> موقع ارتباط المادة المتفاعلة مع الإنزيم.",
    "<b>العوامل المؤثّرة في نشاط الإنزيم:</b> الرقم الهيدروجيني · درجة الحرارة · تركيز المواد المتفاعلة."]},
   {t:"الأحماض النووية", p:[
    "<b>تتكوّن من النيوكليتيد.</b> وأجزاء النيوكليتيد الثلاثة: <b>مجموعة الفوسفات</b> · <b>قاعدة نيتروجينية</b> · <b>السكر الخماسي</b>.",
    "<b>وظيفته:</b> نقل وتخزين المادة الوراثية.",
    "<b>أنواعه:</b> DNA و RNA."]}
  ]},
  {k:"matrix", h:"الجزيئات الحيوية الأربعة", hint:"اضغط المجموعة",
   cols:[{n:"الكربوهيدرات",c:"pr"},{n:"الدهون",c:"pr"},{n:"البروتينات",c:"eu"},{n:"الأحماض النووية",c:"eu"}],
   rows:[
    {h:"وحدة البناء", v:["السكريات الأحادية","الأحماض الدهنية والجليسرول","الأحماض الأمينية بروابط ببتيدية","النيوكليتيد"], df:[0,1,2,3]},
    {h:"الوظيفة", v:["تصدر وتخزن الطاقة · داعم تركيبي للجدار الخلوي","تخزين الطاقة — أكبر مصدر للطاقة في الجسم · ومعظم الغشاء البلازمي دهون","دعم تركيبي · نقل المواد · الهرمونات · الإنزيمات · توصيل الإشارات","نقل وتخزين المادة الوراثية"], df:[0,1,2,3]},
    {h:"التركيب أو الأنواع", v:["الكربون والهيدروجين والأكسجين بنسبة 1:2:1 · والصيغة (CH2O)n","مشبعة · غير مشبعة · مفسفرة · ستيرويدات","ذرة كربون محاطة بـ4 روابط: أمين وكربوكسيل وهيدروجين وألكيل","مجموعة فوسفات · قاعدة نيتروجينية · سكر خماسي"], df:[0,1,2,3]},
    {h:"أمثلة", v:["الجلوكوز · المالتوز · السليلوز والنشا والجلايكوجين والكايتين","الشحوم والزيوت والشمع · والكولسترول والهرمونات","الكيراتين في الشعر · الإنزيمات","DNA و RNA"], df:[0,1,2,3]}
   ]},
  {k:"matrix", h:"السكريات الثنائية", hint:"اضغط السكر",
   cols:[{n:"المالتوز",c:"pr"},{n:"السكروز",c:"pr"},{n:"اللاكتوز",c:"eu"}],
   rows:[
    {h:"يتكوّن من", v:["جلوكوز + جلوكوز","جلوكوز + فركتوز","جلوكوز + جالاكتوز"], df:[0,1,2]},
    {h:"الاسم الشائع", v:["سكر الشعير","سكر الطعام","سكر الحليب"], df:[0,1,2]}
   ]},
  {k:"traps", h:"مصائد الاختبار", items:[
   "<b>نسبة الكربون والهيدروجين والأكسجين في الكربوهيدرات 1:2:1</b>، وصيغتها (CH2O)n.",
   "<b>الكايتين يحوي النيتروجين ولونه بني</b>، ويوجد في جدار الفطريات والهيكل الخارجي للمفصليات.",
   "<b>السليلوز مبلمر ضخم من الجلوكوز.</b>",
   "<b>الدهون أكبر مصدر للطاقة في الجسم.</b>",
   "<b>المشبعة رابطة أحادية وغير المشبعة رابطة ثنائية فأكثر</b> بين ذرات الكربون.",
   "<b>الكولسترول يدخل في إنتاج فيتامين D وهرمونات الإستروجين والتستوستيرون.</b>",
   "<b>الإنزيمات بروتينات، وتزيد سرعة التفاعل بخفض طاقة التنشيط لا بزيادتها.</b>",
   "<b>طاقة التنشيط هي الحد الأدنى من الطاقة اللازمة لحدوث التفاعل، والمحفّز يقلّلها.</b>",
   "<b>الموقع النشط هو موقع ارتباط المادة المتفاعلة مع الإنزيم.</b>",
   "<b>أجزاء النيوكليتيد ثلاثة: فوسفات وقاعدة نيتروجينية وسكر خماسي.</b>"
  ]}
 ],

   e:"أجزاء النيوكليتيد: مجموعة الفوسفات، وقاعدة نيتروجينية، والسكر الخماسي."},

  {p:"الدهن الذي يدخل في إنتاج فيتامين D والإستروجين.",

 ]

 id:"u4-33", unit:"أحياء 4", name:"الطاقة الخلوية", page:"53",
 viz:[
  {k:"idea", t:"مساران متعاكسان: هدم يحلّل فيطلق الطاقة، وبناء يركّب فيحتاج الطاقة. و ATP هو العملة التي تنتقل بها الطاقة بينهما، وتحرّرها بكسر رابطة واحدة فقط."},
  {k:"text", h:"الشرح", secs:[
   {t:"الطاقة وقوانينها", p:[
    "<b>الطاقة:</b> القدرة على إنجاز شغل معيّن. <b>والديناميكا الحرارية:</b> دراسة تدفّق الطاقة في الكون وتحوّلها.",
    "<b>القانون الأوّل (قانون حفظ الطاقة):</b> الطاقة لا تفنى ولا تُستحدث «إلا بمشيئة الله» بل تتحوّل من شكل إلى آخر.",
    "<b>القانون الثاني:</b> حدوث فقدان في الطاقة على شكل حرارة عند تحوّلها من شكل إلى آخر.",
    "<b>عملية الأيض:</b> جميع التفاعلات الكيميائية في الخلية."]},
   {t:"تغذية المخلوقات", p:[
    "<b>ذاتية التغذّي:</b> تصنع غذاءها بنفسها، ويعتمد عليها باقي المخلوقات في الحصول على الطاقة.",
    "<b>غير ذاتية التغذّي:</b> لا تصنع غذاءها بنفسها، مثل معظم المخلوقات، تحتاج إلى الطعام للحصول على طاقة.",
    "<b>والشمس هي المصدر الرئيس لمعظم الطاقة في المخلوقات الحية.</b>"]},
   {t:"مسارات الأيض", p:[
    "<b>مسارات الهدم:</b> تطلق <b>ATP</b> — طاقة تحتاجها الخلية لتؤدّي وظائفها. مثل <b>التنفس الخلوي</b>. تتحرّر فيها الطاقة نتيجة <b>تحليل الجزيئات الكبيرة إلى جزيئات صغيرة</b>، وتتحلّل فيه المواد العضوية لتحرّر الطاقة اللازمة للخلية.",
    "<b>معادلة التنفس الخلوي:</b> 6O2 + C6H12O6 ← 6H2O + 6CO2 + طاقة.",
    "<b>مسارات البناء:</b> <b>تحتاج إلى طاقة</b>. مثل <b>البناء الضوئي</b>. تُستخدم فيها الطاقة في <b>بناء جزيئات كبيرة من الجزيئات الصغيرة</b>، وتتحوّل فيه الطاقة من طاقة شمسية (ضوئية) إلى طاقة كيميائية.",
    "<b>معادلة البناء الضوئي:</b> 6CO2 + 6H2O ← (ضوء، الكلوروفيل) ← 6O2 + C6H12O6."]},
   {t:"وحدة الطاقة الخلوية ATP", p:[
    "<b>أدينوسين ثلاثي الفوسفات (ATP):</b> مصدر الطاقة الخلوية، لأنه يزوّد الخلايا بالطاقة الكيميائية عند تحطّمه. <b>يُنتج أغلبه في الميتوكندريا ويُخزن في السيتوبلازم.</b>",
    "<b>تركيب جزيء ATP:</b> عبارة عن نيوكليتيد يتكوّن من: <b>قاعدة نيتروجينية (الأدينين)</b> · <b>سكر الرايبوز</b> · <b>ثلاث مجموعات من الفوسفات</b>.",
    "<b>وظيفته:</b> تزويد الخلايا بالطاقة، ويختزن الطاقة أيضاً. <b>ونوع الطاقة في جزيء ATP طاقة كيميائية.</b>",
    "<b>ذرات الفوسفات:</b> ATP ثلاث مجموعات فوسفات · ADP مجموعتان · AMP مجموعة واحدة.",
    "<b>ويحرّر جزيء ATP الطاقة عندما تتكسّر الرابطة بين مجموعة الفوسفات الثانية والثالثة.</b>",
    "<b>وتكسير الروابط يُطلق طاقة والعكس يحتاج إلى طاقة:</b> تحوّل ATP إلى ADP يُطلق طاقة · وتحوّل ADP إلى ATP يحتاج طاقة.",
    "<b>والالتهابات الناتجة من الإصابة بالفيروسات يمكن أن تؤثّر على التنفس الخلوي وإنتاج ATP</b>، فيشعر الإنسان المصاب بالإنفلونزا بالتعب نتيجة لنقص إنتاج جزيئات ATP."]}
  ]},

 id:"u4-34", unit:"أحياء 4", name:"البناء الضوئي والتنفس الخلوي", page:"54 و55",
 viz:[
  {k:"idea", t:"عمليتان متعاكستان، لكلٍّ مرحلتان ومكانان. والأرقام هنا هي ما يُسأل عنه: 36 أو 38 ATP، و3 لكل NADH و2 لكل FADH2."},
  {k:"text", h:"الشرح", secs:[
   {t:"البناء الضوئي ومراحله", p:[
    "<b>البلاستيدات الخضراء:</b> عضيات تمتصّ الطاقة الضوئية في المخلوقات التي تقوم بالبناء الضوئي، وتوجد في أوراق الشجر.",
    "<b>الثايلاكويد:</b> مكان حدوث المرحلة الأولى للبناء الضوئي. <b>والحشوة (اللُّحمة):</b> مكان حدوث المرحلة الثانية.",
    "<b>1 التفاعلات الضوئية:</b> <b>تعتمد على الضوء (مصدر الطاقة)</b>، وتحدث في <b>الثايلاكويدات</b> — مجموعة من الأغشية المسطحة تشبه الكيس تترتب في رزم متراصة تسمّى <b>الغرانا</b>. وتتضمّن مرحلتين: <b>نقل الإلكترون</b> ينتج عنه <b>NADPH</b> · <b>والإسموزية الكيميائية</b> ينتج عنها <b>ATP</b>.",
    "<b>2 التفاعلات اللاضوئية (حلقة كالفن):</b> <b>لا تعتمد على الضوء</b>، وتحدث في <b>الحشوة (اللُّحمة)</b> وهي سائل يملأ الفراغات المحيطة بالغرانا. ومصدر الطاقة فيها ATP و NADPH · وتتكوّن فيها السكريات الأحادية سداسية الكربون · وينتج فيها الجلوكوز بفعل <b>إنزيم روبيسكو</b> — إنزيم مهمّ لأنه يحوّل CO2 إلى مركّبات عضوية. <b>والناتج الأساسي: جزيئا G3P</b> التي تُخزن الطاقة ليتمّ استخدامها لاحقاً لبناء جزيئات أكثر تعقيداً مثل الجلوكوز والفركتوز والنشا وغيرها.",
    "<b>الفيرودوكسين:</b> المستقبل النهائي للإلكترونات في سلسلة نقل الإلكترون في البناء الضوئي.",
    "<b>الأصباغ:</b> الجزيئات الملوّنة التي تمتصّ الضوء وتوجد في أغشية الثايلاكويدات داخل البلاستيدات. <b>أساسية</b> مثل صبغة الكلوروفيل a و b · <b>وثانوية</b> مثل صبغة الكاروتين ومنها بيتا-كاروتين. <b>ويمتصّ الكلوروفيل b كمية أكبر من الضوء.</b>",
    "<b>مسارات بديلة:</b> في البيئات التي يقلّ فيها الماء أو CO2 يضعف البناء الضوئي، فيلجأ النبات لمسارات بديلة: <b>نباتات C4</b> مثل قصب السكر والذرة · <b>ونباتات أيض الحمض العشبي CAM</b> مثل الصبار والسحلب والأناناس."]},
   {t:"التنفس الخلوي — اللاهوائي والهوائي", p:[
    "<b>التنفس اللاهوائي:</b> عملية لاهوائية لا تحتاج O2. <b>وتسمّى بالتحلّل السكري</b>، تحدث في <b>السيتوبلازم</b> ولا تتطلّب وجود الأكسجين.",
    "<b>نواتج التحلّل السكري:</b> 2 بيروفيت · 2NADH · 2ATP. <b>والمجموع = 2 ATP</b> (يُستهلك جزيئا ATP في التفاعل ليكون الناتج النهائي جزيئين بدلاً من 4). أي <b>ينتج عن تحليل كل جزيء جلوكوز في عملية التحلّل السكري 2ATP</b>.",
    "<b>البيروفيت:</b> جزيء يحتوي على الكربون، وهو الجزيء الذي يتمّ فيه تخزين معظم الطاقة الناتجة من الجلوكوز في نهاية التحلّل السكري.",
    "<b>التنفس الهوائي:</b> عملية هوائية تحتاج O2، تحدث في <b>حشوة الميتوكوندريا</b> على مرحلتين: حلقة كربس، ونقل الإلكترون."]},
   {t:"حلقة كربس وسلسلة نقل الإلكترون", p:[
    "<b>حلقة كربس:</b> سلسلة التفاعلات التي يتحلّل فيها البيروفيت إلى ثاني أكسيد الكربون. وتسمّى أيضاً <b>بدورة TCA (حمض الكربوكسيل الثلاثي)</b> وتسمّى أيضاً <b>بحلقة حمض الستريك</b>.",
    "<b>وتحدث على دورتين، دورة لكل جزيء بيروفيت، وتحدث في حشوة الميتوكوندريا.</b>",
    "<b>نواتجها:</b> 6CO2 · 2FADH2 · 8NADH · 2ATP. <b>والمجموع = 2 ATP</b>.",
    "<b>سلسلة نقل الإلكترون:</b> الخطوة النهائية في التنفس الهوائي، وفيها يتمّ إنتاج <b>معظم جزيئات ATP</b>. وفيها تتحوّل جزيئات NADH و FADH2 بحيث: <b>كل جزيء NADH يعطي 3ATP</b> · <b>وكل جزيء FADH2 يعطي 2ATP</b>. فمجموع NADH من حلقة كربس والتحلّل السكري 10 NADH = 30 ATP · ومجموع FADH2 من حلقة كربس 2FADH2 = 4 ATP.",
    "<b>ويُعدّ الأكسجين هو المستقبل النهائي للإلكترون</b>، حيث تنتقل الإلكترونات والبروتونات إلى O2 لإنتاج الماء، أي أن <b>الماء هو المركّب النهائي الناتج</b>.",
    "<b>الناتج النهائي عن تحلّل كل جزيء جلوكوز:</b> في المخلوقات <b>بدائية النوى 38 ATP</b> · وفي المخلوقات <b>حقيقية النوى 36 ATP</b> (يُستهلك 2 من أصل 38)."]},
   {t:"التنفس اللاهوائي (التخمّر)", p:[
    "<b>مسار تابع للتحلّل السكري، يحدث في السيتوبلازم عند غياب الأكسجين.</b>",
    "<b>تخمّر حمض اللاكتيك (التخمّر اللبني):</b> يتحوّل الجلوكوز إلى بيروفيت ثم إلى حمض اللاكتيك. <b>ويحدث في العضلات الهيكلية</b> مما يسبّب لها الإعياء والإجهاد.",
    "<b>التخمّر الكحولي:</b> يتحوّل الجلوكوز إلى بيروفيت ثم إلى <b>إيثانول و CO2</b>. <b>ويحدث في فطر الخميرة وبعض أنواع البكتيريا.</b>"]}
  ]},

 id:"u4-36", unit:"أحياء 4", name:"الانقسام المنصف", page:"58 و59",
 viz:[
  {k:"idea", t:"الانقسام المنصف مرحلتان لا مرحلة واحدة، وينتج أربع خلايا أحادية غير متطابقة. والسبب في عدم تطابقها حدث واحد: العبور الجيني في الطور التمهيدي الأوّل."},
  {k:"text", h:"الشرح", secs:[
   {t:"ما الانقسام المنصف", p:[
    "<b>يحدث في الخلايا الجنسية وينتج عنه الأمشاج.</b>",
    "<b>الأمشاج:</b> خلايا جنسية تحمل <b>نصف العدد</b> من الكروموسومات.",
    "<b>الجينات:</b> قطع تترتّب فيها المادة الوراثية DNA، وتحمل الصفات الوراثية.",
    "<b>الإخصاب:</b> العملية التي يتحد فيها مشيج أحادي المجموعة الكروموسومية بمشيج أحادي آخر.",
    "<b>الكروموسومات المتماثلة:</b> لها نفس الطول · لها نفس موقع السنترومير · لها جينات الصفة نفسها."]},
   {t:"أنواع الخلايا في الإنسان", p:[
    "<b>الخلايا الجنسية:</b> أحادية المجموعة الكروموسومية <b>1n</b> · تحوي <b>نصف</b> عدد الكروموسومات · وهي البويضات والحيوانات المنوية وحبوب اللقاح.",
    "<b>الخلايا الجسدية:</b> ثنائية المجموعة الكروموسومية <b>2n</b> · تحوي <b>العدد الكامل</b> من الكروموسومات · وهي جميع الخلايا غير الجنسية.",
    "<b>وفي الإنسان:</b> البويضات والحيوانات المنوية تحوي <b>23 كروموسوماً</b>، وعند اتحادها تنتج اللاقحة (الزيجوت) وتكون عبارة عن <b>46 كروموسوماً</b>.",
    "<b>والخلايا الجسمية في الإنسان تحوي 46 كروموسوماً:</b> <b>44 كروموسوماً جسدية (22 زوجاً)</b> · <b>و2 كروموسوم جنسية (زوج واحد)</b> — XY للذكر و XX للأنثى."]},
   {t:"مراحل الانقسام المنصف I", p:[
    "<b>1 الطور البيني I:</b> تتضاعف الكروموسومات · يتكاثف الكروماتين.",
    "<b>2 الطور التمهيدي I:</b> تقترب أزواج الكروموسومات المتماثلة بعضها من بعض، وكل كروموسوم يتكوّن من كروماتيدين شقيقين · <b>ينتج عن العبور الجيني تبادل للمعلومات الوراثية</b> · يتحلّل الغلاف النووي · تتكوّن الخيوط المغزلية.",
    "<b>3 الطور الاستوائي I:</b> ترتبط الخيوط المغزلية مع سنتروميرات الكروموسومات · تصطفّ الكروموسومات <b>المتماثلة</b> عند خط استواء الخلية.",
    "<b>4 الطور الانفصالي I:</b> تنفصل الكروموسومات المتماثلة وتتحرّك إلى أقطاب الخلية المتقابلة.",
    "<b>5 الطور النهائي I:</b> تتحلّل الخيوط المغزلية · تتباعد الكروموسومات بعضها عن بعض وتتكوّن نواتان · يحدث تخصّر في الخلايا الحيوانية وتنقسم الخلية.",
    "<b>وفي هذه المرحلة كل قطب يحوي نواة تحوي نصف عدد الكروموسومات الأصلية.</b>"]},
   {t:"مراحل الانقسام المنصف II", p:[
    "<b>6 الطور التمهيدي II:</b> تتكاثف الكروموسومات · تتكوّن الخيوط المغزلية في كل خلية جديدة · ترتبط الخيوط المغزلية بالكروموسومات.",
    "<b>7 الطور الاستوائي II:</b> تصطفّ الكروموسومات <b>الأحادية</b> عشوائياً على خط استواء كل خلية.",
    "<b>8 الطور الانفصالي II:</b> تنقسم السنتروميرات (القطعة المركزية) · تنفصل الكروماتيدات الشقيقة وتتحرّك إلى أقطاب الخلية المتقابلة.",
    "<b>9 الطور النهائي II:</b> يحيط الغلاف النووي بالكروموسومات وتتكوّن أربع أنوية · تتحلّل الخيوط المغزلية · تنقسم الخلايا.",
    "<b>10 النواتج:</b> أربع خلايا.",
    "<b>والخلايا الجديدة الناتجة عن المرحلة الثانية لا تتضاعف الكروموسومات فيها مرّة أخرى</b>، وتنفصل الكروماتيدات الشقيقة في أثناء الطور الانفصالي II."]},
   {t:"العبور الجيني والتصالب", p:[
    "<b>العبور الجيني:</b> تبادل الأجزاء بين زوج الكروموسومات المتماثلة، <b>يحدث في الطور التمهيدي الأوّل، ويؤدّي إلى التنوّع الوراثي</b>.",
    "<b>التصالب:</b> ارتباط أزواج الكروموسومات على امتداد طوليهما."]}
  ]},

 id:"u4-37", unit:"أحياء 4", name:"الوراثة المندلية · ملخص الوراثة المندلية", page:"60 إلى 62",
 viz:[
  {k:"idea", t:"قانونان لمندل، ومربّع بانيت أداة لتطبيقهما. والنسب الناتجة محفوظة: صفة واحدة 3:1 أو 1:1، وصفتان 9:3:3:1 أو 1:1:1:1. فمن عرف أطرز الآباء، عرف النسبة بلا رسم."},
  {k:"text", h:"الشرح", secs:[
   {t:"الوراثة وتجربة مندل", p:[
    "<b>الوراثة:</b> انتقال الصفات الوراثية من جيل إلى آخر.",
    "<b>جريجور مندل (مؤسس علم الوراثة):</b> أوّل من درس الوراثة، أجرى تجاربه على <b>البازلاء</b>.",
    "<b>تجربة مندل:</b> قام بتلقيح نبات أصفر البذور مع نبات آخر أخضر البذور ونتج: في <b>الجيل الأوّل</b> جميعها بذور <b>صفراء</b> · وفي <b>الجيل الثاني</b> بنسبة <b>3 صفراء : 1 خضراء</b>."]},
   {t:"الصفة السائدة والمتنحية والطرز", p:[
    "<b>الصفة السائدة:</b> التي ظهرت في الجيل الأوّل، ويُرمز لها بحرف <b>كبير Y</b>. مثل البذور الصفراء.",
    "<b>الصفة المتنحية:</b> التي لم تظهر في الجيل الأوّل (ظهرت في الجيل الثاني)، ويُرمز لها بحرف <b>صغير y</b>. مثل البذور الخضراء.",
    "<b>الطراز الجيني:</b> أزواج الجينات المتقابلة في المخلوق الحي، مثل TT و Tt و tt.",
    "<b>الطراز الشكلي:</b> الخصائص والصفات المظهرية الناتجة عن أزواج الجينات المتقابلة (الطرز الجينية). ففي المثال السابق TT و Tt صفة الطول، و tt صفة القصر.",
    "<b>أنواع الطرز الجينية:</b> <b>المتماثلة (أو نقي الصفات)</b> سائدان TT أو متنحيان tt · <b>والهجينة (أو غير نقي الصفات)</b> أحدهما سائد والآخر متنحٍ Tt."]},
   {t:"قوانين مندل", p:[
    "<b>1 انعزال الصفات:</b> أزواج الجينات المتقابلة المكوّنة للصفة <b>تنفصل في أثناء الانقسام المنصف</b> وتتحد مرّة أخرى في <b>أثناء الإخصاب</b>.",
    "<b>2 التوزيع الحر:</b> التوزيع العشوائي للجينات المتقابلة يحدث أثناء تكوّن الأمشاج، حيث تتوزّع الجينات على الكروموسومات المنفصلة بشكل حرّ في أثناء الانقسام المنصف."]},
   {t:"التراكيب الجينية ومربّع بانيت", p:[
    "<b>يمكن حساب التراكيب الجينية المحتملة الناتجة عن التوزيع الحر باستخدام (2ⁿ)</b>، حيث n عدد أزواج الكروموسومات.",
    "<b>ويمكن حساب التراكيب الجينية المحتملة الناتجة بعد الإخصاب من خلال (2ⁿ × 2ⁿ)</b>، حيث n عدد أزواج الكروموسومات.",
    "<b>مربّع بانيت:</b> وضعه الدكتور ريجنالد بانيت. الأمشاج الذكرية تُكتب <b>أفقياً</b>، والأمشاج الأنثوية تُكتب <b>رأسياً</b>. ويُستخدم لتوقّع وتتبّع الطرز الجينية المحتملة للأبناء.",
    "<b>استخراج الأمشاج:</b> AA ← A · Aa ← A و a · AABB ← AB · AaBB ← AB و aB · Aabb ← Ab و ab · aaBb ← aB و ab · AaBb ← AB و Ab و aB و ab. <b>ولاحظ أن الحرف المكرّر نأخذه مرّة واحدة فقط.</b>"]},
   {t:"توريث صفة واحدة", p:[
    "<b>الجيل الأوّل F1:</b> الآباء TT سائد متماثل (نقي) × tt متنحٍ متماثل (نقي) دائماً ← الأبناء <b>Tt بنسبة 100% سائد غير متماثل دائماً</b>.",
    "<b>الجيل الثاني F2 — الطبيعي:</b> الآباء Tt × Tt ← الأبناء TT سائد نقي، Tt سائد غير نقي، Tt سائد غير نقي، tt متنحٍ نقي. <b>والنسبة سائد : متنحٍ = 3 : 1 = 75% : 25%</b>.",
    "<b>الجيل الثاني F2 — الاستثناء:</b> الآباء Tt × tt ← الأبناء Tt و tt و Tt و tt. <b>والنسبة سائد : متنحٍ = 1 : 1 = 50% : 50%</b>."]},
   {t:"توريث صفتين", p:[
    "<b>الجيل الأوّل F1:</b> الآباء TTRR سائد متماثل (نقي) × ttrr متنحٍ متماثل (نقي) ← الأبناء <b>TtRr بنسبة 100% سائد غير متماثل دائماً</b>.",
    "<b>الجيل الثاني F2 — الطبيعي:</b> الآباء TtRr × TtRr ← النسبة <b>9 : 3 : 3 : 1</b> — سائد الصفتين : سائد الصفة الأولى : سائد الصفة الثانية : متنحٍ نقي.",
    "<b>الجيل الثاني F2 — الاستثناء:</b> الآباء TtRr × ttrr ← النسبة <b>1 : 1 : 1 : 1</b>."]}
  ]},

  {k:"traps", h:"مصائد الاختبار", items:[

   "<b>Tt × Tt تعطي 3:1، و Tt × tt تعطي 1:1.</b> والخلط بين الحالتين متكرّر.",
   "<b>TtRr × TtRr تعطي 9:3:3:1، و TtRr × ttrr تعطي 1:1:1:1.</b>",
   "<b>الجيل الأوّل من نقيّين دائماً 100% هجين سائد غير متماثل.</b>",
   "<b>قانون انعزال الصفات: الجينات تنفصل في الانقسام المنصف وتتحد في الإخصاب.</b>",
   "<b>التوزيع الحر يحدث أثناء تكوّن الأمشاج في الانقسام المنصف.</b>",
   "<b>التراكيب المحتملة من التوزيع الحر (2ⁿ)، وبعد الإخصاب (2ⁿ × 2ⁿ).</b>",
   "<b>في مربّع بانيت: الأمشاج الذكرية أفقياً والأنثوية رأسياً.</b>",
   "<b>الطراز الجيني هو أزواج الجينات، والطراز الشكلي هو الصفات المظهرية الناتجة عنها.</b>",
   "<b>عند استخراج الأمشاج، الحرف المكرّر يُؤخذ مرّة واحدة فقط.</b>"
  ]}

 id:"u4-38", unit:"أحياء 4", name:"الوراثة المعقدة والبشرية", page:"63 إلى 65",
 viz:[
  {k:"idea", t:"خمسة أنماط وراثية تخرج عن قانون مندل البسيط. ومع كل نمط اختلالات بشرية، فالاختلال السائد يكفيه جين واحد، والمتنحي يحتاج جينين. ومخطط السلالة أداة لقراءة كليهما."},
  {k:"text", h:"الشرح", secs:[
   {t:"الصفة المتنحية وحامل الصفة", p:[
    "<b>الصفة المتنحية:</b> تظهر عندما يكون الفرد <b>متماثل الجينات المتنحية</b>.",
    "<b>حامل الصفة:</b> فرد <b>غير متماثل الجينات</b> يحمل اختلالاً وراثياً متنحياً."]},
   {t:"الاختلالات الوراثية في الإنسان", p:[
    "<b>الاختلالات السائدة (سببها خلل في جين سائد):</b> <b>هنتجتون</b> يؤدّي إلى خلل في الجهاز العصبي · <b>عدم نموّ الغضروف (القمأة)</b> خلل في جين نموّ العظام، ينتج عنه جسم صغير وأطراف قصيرة ورأس كبير.",
    "<b>الاختلالات المتنحية (سببها خلل في جين متنحٍ):</b> <b>الكابتونوريا</b> لون بول أسود بسبب إفراز الحمض في البول · <b>المهاق</b> لا تنتج كميات كافية من صبغة الميلانين، وينتج عنه انعدام لون الجلد والشعر، ومشكلات في الرؤية، والجلد معرّض للتلف بسبب الأشعة فوق البنفسجية · <b>الجلاكتوسيميا</b> عدم تحليل (هضم) الجلاكتوز، ومن أثره تضخّم الكبد والفشل الكلوي، ويجب على المصاب تجنّب منتجات الحليب والألبان · <b>التليف الكيسي</b> تعطّل الإنزيم المسؤول عن إنتاج بروتين غشائي، ويسبّب عدم امتصاص الخلايا لأيونات الكلور، مما يؤثّر في إفراز المخاط والعرق · <b>تاي ساكس</b> غياب الإنزيم اللازم لتحليل المواد الدهنية، ويسبّب تراكم الدهون في الدماغ، يتمّ تحديده بوجود بقعة حمراء في مؤخّرة العين (الجين المسؤول عن المرض موجود على الكروموسوم رقم 15)."]},
   {t:"مخطط السلالة", p:[
    "<b>شكل يتتبّع وراثة صفة معيّنة خلال عدة أجيال، ويُستعمل لدراسة أنماط الوراثة في الإنسان.</b>",
    "<b>مفاتيح الرموز:</b> دائرة = أنثى، ومربّع = ذكر. والفارغ = طبيعي، والممتلئ = مصاب، ونصف الممتلئ = حامل للمرض (للصفة).",
    "<b>الأرقام الرومانية (I, II) للأجيال، والأرقام الإنجليزية (1, 2) لأفراد في جيل معيّن.</b>",
    "<b>في الاختلالات السائدة:</b> HH مصاب نقي · Hh مصاب هجين · hh سليم.",
    "<b>وفي الاختلالات المتنحية:</b> tt مصاب · Tt سليم حامل للمرض · TT سليم."]},
   {t:"الأنماط الوراثية المعقدة", p:[
    "<b>1 السيادة غير التامة (الناقصة):</b> كلا الجينين لهما نفس القوة، بالتالي يظهر طراز شكلي وسطي بين الآباء. مثل لون أزهار نبات شبّ الليل: RR أحمر × rr أبيض ← Rr وردي. وبالتلقيح الذاتي ينتج أزهار حمراء ووردية وبيضاء بنسب <b>1 : 2 : 1</b>.",
    "<b>2 السيادة المشتركة:</b> يظهر فيها أثر كلا الجينين عندما يكون الطراز الجيني لصفة ما غير متماثل الجينات — كلاهما يظهر صفته. مثل <b>مرض أنيميا الخلايا المنجلية</b> الذي يؤثّر على خلايا الدم الحمراء ويغيّر شكلها إلى الشكل المنجلي (شكل حرف C). <b>والأفراد غير متماثلي الجينات لمرض أنيميا الخلايا المنجلية هم أكثر الأشخاص مقاومة لمرض الملاريا.</b>",
    "<b>3 الجينات المتعدّدة المتقابلة:</b> صفات وراثية تحدد بأكثر من جينين. مثل <b>نظام فصائل الدم ABO</b> الذي له 3 أشكال من الجينات المتقابلة وهي Iᴬ و Iᴮ و i، <b>ويُعدّ هذا النظام مثالاً على السيادة المشتركة والجينات المتعدّدة المتقابلة</b>. ومثل <b>لون فراء الأرنب</b> الذي يتحكّم فيه 4 أشكال: C و c^ch و c^h و c، والسيادة بينها: <b>C أسود > c^ch شانشيلا > c^h هيمالايا > c أبيض</b>.",
    "<b>4 تفوّق الجينات:</b> وجود جين يخفي صفة جين آخر، مثل تنوّع لون فراء الكلب. الجين E يحدد ما إذا كان الفرو ذا صبغة غامقة أم فاتحة اللون · والجين B يحدد درجة اللون الغامق من الصبغة · والجين e يخفي أثر الجين B لأنه سائد عليه.",
    "<b>5 الصفات المرتبطة مع الجنس:</b> تتحكّم فيها جينات موجودة على <b>كروموسوم X</b>، وتكون <b>شائعة في الذكور أكثر من الإناث</b>. مثل <b>عمى الألوان</b> لا يميّز المصاب بين اللونين الأحمر والأخضر حيث يراهم على هيئة ظلال رمادية · و<b>نزف الدم (الهيموفيليا)</b> يتميّز المصاب به بتأخّر تجلّط الدم.",
    "<b>والطرز الجينية في الصفات المرتبطة مع الجنس:</b> الذكر XᴮY سليم، و XᵇY مصاب (والكروموسوم Y لا يحمل جينات لأنه قصير) · والأنثى XᴮXᴮ سليمة، و XᴮXᵇ سليمة حاملة للمرض، و XᵇXᵇ مصابة."]},
   {t:"تحديد الجنس", p:[
    "<b>في خلايا الإنسان 46 كروموسوماً (عدا الأمشاج):</b> <b>كروموسومات جسمية</b> 44 كروموسوماً (22 زوجاً)، وتحوي جينات تحمل الصفات الجسمية مثل طول الشعر ولونه · <b>وكروموسومات جنسية</b> 2 كروموسوم (زوج واحد)، وهي التي تحدد الجنس وهي على نوعين X و Y: <b>XY للذكر و XX للأنثى</b>.",
    "<b>وعدد الكروموسومات في الأمشاج نصف عدد الكروموسومات في الخلايا الجسمية، أي أن عدد الكروموسومات في الخلايا الجنسية للإنسان هو 23.</b>",
    "<b>الطراز الجيني للذكر 44 + XY، وللأنثى 44 + XX.</b>",
    "<b>أجسام بار:</b> تركيب غامق اللون في النواة، يوجد في الخلايا الجسمية، وهو عبارة عن <b>كروموسوم X المتوقّف عن العمل في الأنثى</b>."]}
  ]},

 id:"u4-39", unit:"أحياء 4", name:"المادة الوراثية", page:"66 إلى 69",
 viz:[
  {k:"idea", t:"قاعدة تشارجاف تحكم كل مسائل النسب: A = T و G = C، فمجموع A+G يساوي T+C، أي 50% لكلٍّ. ومن هذه القاعدة وحدها تُحلّ معظم الأسئلة."},
  {k:"text", h:"الشرح", secs:[
   {t:"جهود العلماء", p:[
    "<b>فريدريك جريفيث:</b> أوّل من اكتشف الـDNA بوصفه مادة وراثية · وقام بتجربة التحوّل البكتيري.",
    "<b>أفري وزملاؤه:</b> عزل المادة الوراثية التي تسبّبت في التحوّل البكتيري.",
    "<b>هيرشي وتشيس:</b> إثبات أن الـDNA هو مادة الوراثة وليس البروتين، باستخدام تقنية العلامات المشعة (S35 P32).",
    "<b>ليفين:</b> حدد التركيب الأساسي للنيكليوتيدات.",
    "<b>أروين تشارجاف:</b> حلّل كمية القواعد النيتروجينية للـDNA ووضع قاعدة C + T = G + A.",
    "<b>ويلكنز وفرانكلين:</b> استخدام تقنية تشتّت الأشعة السينية والتقاط الصورة رقم 51 الشهيرة لجزيء الـDNA.",
    "<b>واطسون وكريك:</b> بناء نموذج شريط الـDNA · واقتراح طريقة التضاعف شبه المحافظ للـDNA."]},
   {t:"تركيب DNA و RNA", p:[
    "<b>وظيفة DNA هي نقل وتخزين المادة الوراثية.</b>",
    "<b>DNA:</b> سلسلتان (شريطان) · سكر <b>رايبوز منقوص الأكسجين</b> · مجموعة فوسفات · والنيوكليوتيدات: أدينين A وسايتوسين C وجوانين G و<b>ثايمين T</b>.",
    "<b>RNA:</b> سلسلة واحدة (شريط واحد) · سكر <b>رايبوز</b> · مجموعة فوسفات · والنيوكليوتيدات: أدينين A وسايتوسين C وجوانين G و<b>يوراسيل U</b>.",
    "<b>والحمض النووي المتواجد بالنواة هو DNA فقط.</b> <b>والقاعدة النيتروجينية لنيوكليوتيدات ATP ثابتة وهي الأدينين</b>، بينما يحوي DNA و RNA أربعة قواعد مختلفة.",
    "<b>تركيب الكروموسوم:</b> ليف كروماتيني مكوّن من نيوكليوسوم (جسيم نووي)، ويتكوّن النيوكليوسوم من فوسفات الـDNA وبروتينات الهستونات."]},
   {t:"القواعد النيتروجينية وقاعدة تشارجاف", p:[
    "<b>البيورينات:</b> ثنائية الحلقة، وهي <b>الأدينين A</b> و<b>الجوانين G</b>. <b>والبيريميدينات:</b> أحادية الحلقة، وهي <b>الثايمين T</b> في DNA و<b>اليوراسيل U</b> في RNA و<b>السايتوسين C</b>.",
    "<b>ارتباط القواعد:</b> A يرتبط مع T في DNA ومع U في RNA · و G يرتبط مع C.",
    "<b>قاعدة تشارجاف:</b> <b>A = T و G = C</b>، وبالتالي <b>A + G = T + C</b>، أي <b>50% = 50%</b>.",
    "<b>عدد الروابط في القواعد:</b> يرتبط A برابطة هيدروجينية <b>ثنائية</b> مع T (أو U في RNA)، ويرتبط G برابطة هيدروجينية <b>ثلاثية</b> مع C."]},
   {t:"تضاعف DNA شبه المحافظ", p:[
    "<b>خطوات التضاعف:</b> <b>1 فكّ الالتواء</b> بواسطة إنزيم فكّ الالتواء (هيليكز) وإنزيم RNA البادئ · <b>2 ارتباط القواعد في أزواج</b> بواسطة إنزيم بلمرة DNA · <b>3 إعادة ربط السلاسل</b> بواسطة إنزيم ربط DNA.",
    "<b>وتُنتج قطع أوكازاكي أثناء نسخ شريط DNA الثانوي.</b>",
    "<b>الإنزيمات ووظائفها في DNA:</b> <b>إنزيم فكّ الالتواء (هيليكز)</b> فصل الالتواء بين سلسلتي DNA عن طريق تكسير الروابط الهيدروجينية بين القواعد · <b>إنزيم RNA البادئ</b> يبدأ به بإضافة قطعة RNA الأولية إلى كل سلسلة من سلاسل DNA · <b>إنزيم بلمرة DNA</b> إضافة النيوكليوتيدات المناسبة إلى سلسلة DNA الجديدة · <b>إنزيم ربط DNA</b> ربط قطع أوكازاكي التي يُنتجها الإنزيم السابق ويتمّ بناؤها في الاتجاه المعاكس (3 إلى 5). <b>وفي RNA: إنزيم بلمرة RNA</b> لبناء RNA."]},
   {t:"أنواع RNA وصنع البروتين", p:[
    "<b>المبدأ الأساسي في علم الأحياء:</b> تُنسخ شفرات DNA إلى RNA الذي يوجّه عملية بناء البروتين.",
    "<b>mRNA الرسول:</b> يحمل المعلومات الوراثية (الشفرة) من DNA في النواة لبناء البروتينات في السيتوبلازم.",
    "<b>rRNA الرايبوسومي:</b> يرتبط مع البروتينات لبناء الرايبوسومات في النوية ثم تنتقل إلى السيتوبلازم.",
    "<b>tRNA الناقل:</b> ينقل الأحماض الأمينية إلى الريبوسومات لبناء البروتينات.",
    "<b>مراحل صنع البروتين:</b> <b>1 عملية النسخ</b> في <b>النواة</b> — بناء mRNA من سلسلة DNA حيث يحلّ اليوراسيل U محلّ الثايمين T · <b>2 معالجة RNA</b> في <b>النواة</b> — قبل خروج mRNA الأوّلي من النواة إلى السيتوبلازم يتمّ: إضافة غلاف، وحذف الإنترونات، وإضافة ذيل متعدّد من A · <b>3 الترجمة</b> في <b>السيتوبلازم</b> — ربط mRNA مع الرايبوسوم وتصنيع البروتين."]},
   {t:"علاقات مهمة وقاعدة تمييز السلاسل", p:[
    "<b>يحوي mRNA ثلاثة قواعد نيتروجينية لكل حمض أميني يرتبط به</b> — أي كل حمض أميني واحد يحوي 3mRNA. <b>والعكس صحيح، فكل 3mRNA تعطي حمض أميني واحد.</b>",
    "<b>قاعدة تمييز عدد سلاسل الـRNA:</b> <b>سلسلة واحدة RNA</b> عندما تكون نسب الأدينين واليوراسيل <b>ليست متطابقة</b>، ونسبة الجوانين والسايتوسين ليست متطابقة · <b>وسلسلتين RNA</b> عندما تكون نسب الأدينين واليوراسيل <b>متطابقة</b>، ونسبة الجوانين والسايتوسين متطابقة.",
    "<b>وتحليل DNA يساعد في التعرّف على هوية الأشخاص</b>، فإذا وُجد أثر في مسرح الجريمة مثل الدم أو الشعر أو الجلد، يتمّ فحص الـDNA فيه ثم مقارنته بالـDNA للمشتبه بهم."]}
  ]},

function topicOf(e){
  const pr = e.s.split('·').map(x => x.trim());
  const direct = TOPICS.find(t => t.unit === pr[0] && t.name === pr[1]);
  if(direct) return direct;
  const row = TOC.find(x => x.u === pr[0] && x.name === pr[1]);
  return row && row.t ? TOPICS.find(t => t.id === row.t) || null : null;
}

/* ===== تطبيع النص العربي ===== */
function norm(x){
  return (x||"")
   .replace(/[ً-ْـٰ]/g,"")   // تشكيل وتطويل
   .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
   .replace(/[ؤئ]/g,"ء")
   .replace(/[^ء-يa-zA-Z0-9 ]/g," ")
   .replace(/\s+/g," ").trim();
}
function stripAl(x){ return x.replace(/(^|\s)(ال)/g,"$1"); }
function key(x){ return stripAl(norm(x)); }

const IDX = DATA.map(e=>({
  e, k:key(e.t), ak:(e.a||[]).map(key), dk:key(e.d.replace(/<[^>]+>/g,""))
}));
const BY = {}; DATA.forEach(e=>BY[key(e.t)]=e);

const STOP = new Set(["وش","ايش","وشو","شنو","يعني","معني","معنا","تعريف","عرف","ما","ماهو",
 "هو","هي","هذا","هذه","من","عن","في","على","اشرح","وضح","كيف","ليش","لماذا","لمادا","ايه","ما هو"]);

function scoreEntry(it, q, words){
  if(it.k === q || it.ak.includes(q)) return 1000;
  if(it.k.length > 2 && q.includes(it.k)) return 900;
  if(it.ak.some(a => a.length > 2 && q.includes(a))) return 880;
  if(q.length > 2 && it.k.includes(q)) return 820;
  if(q.length > 2 && it.ak.some(a => a.includes(q))) return 800;
  const toks = (it.k + " " + it.ak.join(" ")).split(" ").filter(t => t.length > 2);
  let hits = 0;
  words.forEach(w => { if(toks.some(t => t.includes(w) || w.includes(t))) hits++; });
  if(hits) return 400 + hits * 30;
  let dh = 0;
  words.forEach(w => { if(it.dk.includes(w)) dh++; });
  if(dh) return 100 + dh * 10;
  return 0;
}

function search(raw){
  const q = key(raw);
  if(!q) return {hit:[], near:[]};
  const words = q.split(" ").filter(w => w.length > 2 && !STOP.has(w));
  const all = [];
  IDX.forEach(it => {
    const sc = scoreEntry(it, q, words);
    if(sc) all.push({sc, e:it.e});
  });
  all.sort((a,b) => b.sc - a.sc || a.e.t.length - b.e.t.length);
  return {
    hit:  all.filter(o => o.sc >= 400).slice(0,6).map(o => o.e),
    near: all.filter(o => o.sc < 400).slice(0,5).map(o => o.e)
  };
}
