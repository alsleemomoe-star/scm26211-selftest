 id:"u3-28", unit:"أحياء 3", name:"جهاز التكاثر في الإنسان", page:"45",
 viz:[
  {k:"idea", t:"الغدة النخامية تفرز هرمونين — FSH و LH — يعملان في الجهازين معاً، ولكلٍّ منهما وظيفة مختلفة في كلٍّ. ودورة الحيض أربعة أطوار بأيامها، وما يحدث في آخرها يتوقّف على سؤال واحد: أحدث إخصاب أم لا؟"},
  {k:"text", h:"الشرح", secs:[
   {t:"تركيب الجهاز التناسلي الذكري", p:[
    "<b>الخصيتان:</b> غدة تناسلية توجد خارج الجسم في كيس الصفن، مما يوفّر بيئة (حرارة) مناسبة لتكوين الحيوانات المنوية. وتحتوي على الأنابيب المنوية.",
    "<b>الأنابيب المنوية:</b> إنتاج الحيوانات المنوية في درجة حرارة <b>35 مئوية</b>.",
    "<b>البربخ:</b> تخزين الحيوانات المنوية واكتمال نضجها.",
    "<b>الوعاء الناقل:</b> ويسمّى الأسهر، ينقل الحيوانات المنوية إلى الإحليل.",
    "<b>الحوصلة المنوية:</b> تغذية الحيوانات المنوية، وتفرز <b>نصف السائل المنوي</b> والسكر لتزويد الحيوانات المنوية بالطاقة والمواد المغذية (بروتينات وإنزيمات).",
    "<b>غدة البروستاتا وكوبر:</b> إفراز محلول قلوي (قاعدي) لمعادلة حموضة الجهاز التناسلي الأنثوي.",
    "<b>الإحليل:</b> قناة بولية تناسلية مشتركة."]},
   {t:"تركيب الحيوان المنوي والهرمونات الذكرية", p:[
    "<b>مكوّنات السائل المنوي:</b> حيوانات منوية + مواد مغذية + محلول قلوي.",
    "<b>الذيل:</b> للحركة. <b>القطعة الوسطى:</b> تزوّد الحيوان المنوي بالطاقة لاحتوائها على الميتوكندريا. <b>الجسم القمعي:</b> يفرز إنزيمات هاضمة تحلّل الغشاء البلازمي للبويضة أثناء عملية الإخصاب. <b>النواة:</b> تحمل المادة الوراثية.",
    "<b>التستوستيرون:</b> الهرمون الجنسي الذكري، والمسؤول عن إظهار الصفات الذكرية عند البلوغ، مثل خشونة الصوت وظهور الشعر وإنتاج الحيوانات المنوية.",
    "<b>وهرمونات تفرزها الغدة النخامية تنظّم عمل الخصية:</b> <b>FSH</b> المنشط للحوصلة — ينظّم إنتاج الحيوانات المنوية · <b>LH</b> المنشط للجسم الأصفر — إنتاج هرمون التستوستيرون."]},
   {t:"تركيب الجهاز التناسلي الأنثوي والهرمونات", p:[
    "<b>المبيض:</b> لإنتاج البويضات والهرمونات الأنثوية. <b>قناة البيض (فالوب):</b> تنتقل البويضة من خلالها <b>ويحدث الإخصاب أعلاها</b>. <b>الرحم:</b> ينمو فيه الجنين حتى ولادته، وهو بحجم قبضة اليد. <b>المهبل:</b> تدخل منه الحيوانات المنوية.",
    "<b>البروجسترون:</b> يزيد سمك بطانة الرحم، ويزداد الهرمون بشكل كبير عند أخذ حبوب منع الحمل أو عند حدوث الإخصاب.",
    "<b>الإستروجين:</b> يظهر الصفات الأنثوية مثل نموّ الثديين واتساع الحوض ونعومة الصوت، ويزداد الهرمون — <b>بشكل أقلّ من البروجسترون</b> — عند حدوث الإخصاب.",
    "<b>وهرمونات الغدة النخامية التي تنظّم عمل المبيض:</b> <b>FSH</b> إنتاج الهرمونات الأنثوية · <b>LH</b> يؤثّر في الإباضة.",
    "<b>الخلايا البيضية الأولية:</b> تتضاعف وتنقسم فيها المادة الوراثية للأنثى <b>قبل الولادة</b>. فتولد الأنثى ولديها جميع البويضات التي ستنتجها."]},
   {t:"دورة الحيض وأطوارها", p:[
    "<b>سبب حدوث دورة الحيض هو تحطّم بطانة الرحم.</b>",
    "<b>طور تدفّق الطمث:</b> من اليوم 1 إلى 5. <b>طور الحوصلة:</b> من اليوم 6 إلى 14. <b>طور الجسم الأصفر:</b> من اليوم 15 إلى 28.",
    "<b>وبعد خروج البويضة تتحوّل خلايا الحوصلة إلى تركيب يسمّى الجسم الأصفر.</b>",
    "<b>وفي طور الجسم الأصفر:</b> يبدأ الجسم الأصفر بالتحلّل ويفرز البروجسترون بكميات كبيرة وقليل من الإستروجين. <b>وعند عدم حدوث حمل (إخصاب):</b> يضمحلّ الجسم الأصفر وينخفض تركيز البروجسترون والإستروجين مما يؤدّي لتمزّق بطانة الرحم وحدوث دورة طمث جديدة. <b>وعند حدوث حمل (إخصاب):</b> يبقى تركيز البروجسترون مرتفعاً ولا يضمحلّ الجسم الأصفر، ويزداد تدفّق الدم إلى الرحم لتغذية الجنين."]}
  ]},

  {k:"traps", h:"مصائد الاختبار", items:[

  ]}

 id:"u3-29", unit:"أحياء 3", name:"مراحل نمو الجنين", page:"46",
 viz:[
  {k:"idea", t:"تسلسل واحد من البويضة إلى الجاسترولا، وجدول واحد لثلاثة أثلاث بما يحدث في كلٍّ. وما عداهما أغشية ومشيمة ومسبّبات تشوّه."},
  {k:"text", h:"الشرح", secs:[
   {t:"الإخصاب والمراحل الأولى", p:[
    "<b>الإخصاب:</b> اندماج الحيوان المنوي 1n مع البويضة 1n لتكوين اللاقحة (الزيجوت) <b>2n</b>. ويحدث في <b>أعلى قناة البيض (فالوب)</b>.",
    "<b>ويستطيع الحيوان المنوي البقاء في الجهاز التناسلي الأنثوي مدّة 48 ساعة، بينما البويضة غير المخصبة لا تستطيع البقاء أكثر من 24 ساعة.</b>",
    "<b>في اليوم الثالث:</b> تدخل البويضة المخصبة إلى الرحم على صورة <b>الموريولا</b> (كرة خلوية مصمتة).",
    "<b>في اليوم الخامس:</b> تتحوّل الموريولا إلى <b>بلاستيولا</b> (كرة مجوفة)، تنغرس في الرحم في <b>سادس يوم</b>، ويكتمل الانغراس في <b>عاشر يوم</b>.",
    "<b>تسلسل النمو:</b> البويضة ← اللاقحة (الزيجوت) ← التوتة (الموريولا) ← الكبسولة البلاستيولية ← الجاسترولا. <b>والتوتة كرة مصمتة من الخلايا.</b>"]},
   {t:"الأغشية الجنينية والمشيمة", p:[
    "<b>الغشاء الكوريوني:</b> يوجد خارج الغشاء الرهلي ويساهم في تكوين المشيمة.",
    "<b>الغشاء الرهلي (الأمنيوني):</b> بداخله السائل الذي يعزل الجنين ويحميه من الجفاف والصدمات.",
    "<b>الممبار:</b> للتخلّص من الفضلات ويساهم في تكوين المشيمة أيضاً.",
    "<b>كيس المحّ:</b> <b>أوّل موقع لتكوين خلايا الدم الحمراء للجنين.</b>",
    "<b>المشيمة:</b> امتدادات (خملات كوريونية) من غشاء الكوريون تنمو في جدار الرحم لتتكوّن المشيمة. ووظيفتها إمداد الجنين بالغذاء والأكسجين وتخليصه من الفضلات وثاني أكسيد الكربون. ولها سطحان: سطح من الجنين وسطح من الأم. وتبدأ بالنمو في <b>الأسبوع الثاني</b> ويكتمل نموّها في <b>الأسبوع العاشر</b>.",
    "<b>وقد ينتقل من الأم إلى الجنين الأدوية والعقاقير وبعض الفيروسات، ولكن خلايا الدم لا تنتقل لعدم وجود اتصال بين الدورتين الدمويتين.</b>",
    "<b>الهرمون الكوريوني الموجه للغدد التناسلية hCG:</b> يفرزه الجنين في الأسبوع الأوّل ليحافظ على الجسم الأصفر من التحلّل حتى تتكوّن المشيمة، وبالتالي يحافظ على تركيز البروجسترون مرتفعاً وكذلك الاستروجين (بنسبة أقلّ) ليمنع حدوث دورة حيض جديدة."]},
   {t:"تشخيص الاختلالات", p:[
    "<b>الموجات فوق الصوتية:</b> تحديد ما إذا كان الجنين ينمو بصورة طبيعية ومعرفة جنسه · تحديد وضعية الجنين داخل الرحم.",
    "<b>تحليل السائل الرهلي والخملات الكوريونية:</b> قياس مستويات الإنزيمات · تحديد المخطط الكروموسومي والكروموسومات غير الطبيعية · تحديد جنس الجنين.",
    "<b>ويتمّ تحليل عينة السائل الرهلي للجنين في مرحلة الثلاثة أشهر الثانية</b>، أي من الأسبوع الثالث عشر إلى الأسبوع الرابع والعشرين (بغرس إبرة في بطن الأم)."]}
  ]},
  {k:"cycle", h:"تسلسل النمو", loops:[
   {name:"من البويضة إلى الجاسترولا", d:"والترتيب يُسأل عنه كما هو",
    steps:[
     {n:"البويضة", d:"قبل الإخصاب"},
     {n:"اللاقحة (الزيجوت) 2n", d:"من اندماج الحيوان المنوي 1n مع البويضة 1n"},
     {n:"التوتة (الموريولا)", d:"كرة مصمتة من الخلايا · تدخل الرحم في اليوم الثالث"},
     {n:"الكبسولة البلاستيولية", d:"كرة مجوفة في اليوم الخامس · تنغرس في سادس يوم ويكتمل الانغراس في عاشر يوم"},
     {n:"الجاسترولا", d:"المرحلة التالية من النمو"}
    ]}
  ]},
  {k:"matrix", h:"مراحل تكوّن الجنين", hint:"اضغط المرحلة",
   cols:[{n:"الثلاثة الأولى",c:"pr"},{n:"الثلاثة الثانية",c:"pr"},{n:"الثلاثة الثالثة",c:"eu"}],
   rows:[
    {h:"ما يحدث فيها", v:["يكون الجنين أكثر عرضة للتأثّر بالعقاقير والدخان، نظراً لبداية تكوّن أجهزة الجنين · ونقص المواد المغذية يؤدّي إلى تشوّهات دائمة · وفي نهاية المرحلة تظهر بصمات الأصابع","تسمّى مرحلة النمو، ويبدأ فيها الشعر بالتكوّن · يمكن سماع نبضات القلب بالسماعة في الأسبوع 20 · يتحرّك الجنين ويشعر الأم به بالركل، ويمصّ أصبعه، ويفتح عينيه · وفرصة حياته بالتدخّل الطبي قليلة لعدم اكتمال نموّ الرئتين والمناعة","يجب على الأم أن تتناول كميات كبيرة من البروتينات، لأن الجنين ينمو بسرعة بمعدل 250 ألف خلية عصبية بالدقيقة · وتتراكم الدهون تحت الجلد لحفظ درجة الحرارة · ويستجيب للأصوات"], df:[0,1,2]}
   ]},
  {k:"matrix", h:"مسبّبات تشوّه الولادة", hint:"اضغط السبب",
   cols:[{n:"تدخين السجائر",c:"pr"},{n:"نقص حمض الفوليك",c:"pr"},{n:"الكوكايين",c:"eu"}],
   rows:[
    {h:"التشوّه", v:["نقص وزن المولود وعدم اكتمال نموّه","عدم اكتمال نموّ الدماغ والرأس · العصب المفلوج (قد يسبّب الشلل)","نقص وزن المولود والولادة المبكرة · ضرر بالدماغ والسلوكيات"], df:[0,1,2]}
   ]},
  {k:"traps", h:"مصائد الاختبار", items:[
   "<b>التسلسل: البويضة ← اللاقحة ← التوتة ← الكبسولة البلاستيولية ← الجاسترولا.</b>",
   "<b>الموريولا كرة مصمتة والبلاستيولا كرة مجوفة.</b> ولا يُعكس.",
   "<b>اليوم الثالث دخول الرحم، والخامس التحوّل لبلاستيولا، والسادس الانغراس، والعاشر اكتماله.</b>",
   "<b>الحيوان المنوي يبقى 48 ساعة، والبويضة غير المخصبة لا تتجاوز 24 ساعة.</b>",
   "<b>كيس المحّ أوّل موقع لتكوين خلايا الدم الحمراء للجنين.</b>",
   "<b>المشيمة تبدأ النمو في الأسبوع الثاني ويكتمل في العاشر.</b> ولها سطحان.",
   "<b>خلايا الدم لا تنتقل بين الأم والجنين لعدم وجود اتصال بين الدورتين الدمويتين</b>، لكن الأدوية والعقاقير وبعض الفيروسات تنتقل.",
   "<b>hCG يحافظ على الجسم الأصفر من التحلّل ليمنع دورة حيض جديدة.</b>",
   "<b>نبضات القلب تُسمع بالسماعة في الأسبوع 20، وبصمات الأصابع في نهاية الثلاثة الأولى.</b>",
   "<b>تحليل السائل الرهلي في الثلاثة الثانية: من الأسبوع 13 إلى 24.</b>"
  ]}
 ],

function topicOf(e){
  const pr = e.s.split('·').map(x => x.trim());
  const direct = TOPICS.find(t => t.unit === pr[0] && t.name === pr[1]);
  if(direct) return direct;
  const row = TOC.find(x => x.u === pr[0] && x.name === pr[1]);
  return row && row.t ? TOPICS.find(t => t.id === row.t) || null : null;
}

/* ===== تطبيع النص العربي ===== */
function norm(x){
  return (x||"")
   .replace(/[ً-ْـٰ]/g,"")   // تشكيل وتطويل
   .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
   .replace(/[ؤئ]/g,"ء")
   .replace(/[^ء-يa-zA-Z0-9 ]/g," ")
   .replace(/\s+/g," ").trim();
}
function stripAl(x){ return x.replace(/(^|\s)(ال)/g,"$1"); }
function key(x){ return stripAl(norm(x)); }

const IDX = DATA.map(e=>({
  e, k:key(e.t), ak:(e.a||[]).map(key), dk:key(e.d.replace(/<[^>]+>/g,""))
}));
const BY = {}; DATA.forEach(e=>BY[key(e.t)]=e);

const STOP = new Set(["وش","ايش","وشو","شنو","يعني","معني","معنا","تعريف","عرف","ما","ماهو",
 "هو","هي","هذا","هذه","من","عن","في","على","اشرح","وضح","كيف","ليش","لماذا","لمادا","ايه","ما هو"]);

function scoreEntry(it, q, words){
  if(it.k === q || it.ak.includes(q)) return 1000;
  if(it.k.length > 2 && q.includes(it.k)) return 900;
  if(it.ak.some(a => a.length > 2 && q.includes(a))) return 880;
  if(q.length > 2 && it.k.includes(q)) return 820;
  if(q.length > 2 && it.ak.some(a => a.includes(q))) return 800;
  const toks = (it.k + " " + it.ak.join(" ")).split(" ").filter(t => t.length > 2);
  let hits = 0;
  words.forEach(w => { if(toks.some(t => t.includes(w) || w.includes(t))) hits++; });
  if(hits) return 400 + hits * 30;
  let dh = 0;
  words.forEach(w => { if(it.dk.includes(w)) dh++; });
  if(dh) return 100 + dh * 10;
  return 0;
}

function search(raw){
  const q = key(raw);
  if(!q) return {hit:[], near:[]};
  const words = q.split(" ").filter(w => w.length > 2 && !STOP.has(w));
  const all = [];
  IDX.forEach(it => {
    const sc = scoreEntry(it, q, words);
    if(sc) all.push({sc, e:it.e});
  });
  all.sort((a,b) => b.sc - a.sc || a.e.t.length - b.e.t.length);
  return {
    hit:  all.filter(o => o.sc >= 400).slice(0,6).map(o => o.e),
    near: all.filter(o => o.sc < 400).slice(0,5).map(o => o.e)
  };
}

  meta.textContent = `${list.length} موضوعاً في ${u}`;
  out.innerHTML = `<div class="unote">فهرس الكتاب كما هو · بُني ${done} من ${list.length} · ${terms} مصطلحاً في البنك</div>`
   + list.map(x => `<button class="toci${x.t ? '' : ' no'}" ${x.t ? `data-topic="${esc(x.t)}"` : ''}>
        <span class="num">${x.n}</span>
        <span class="nm">${esc(x.name)}</span>
        <span class="pgx">ص ${esc(x.pg)}</span>
        <span class="st">${x.t ? 'افتح' : 'لم يُبنَ'}</span>
      </button>`).join('');
}

/* ===== رسم كتل الموضوع ===== */
function vText(b, i){
  return `<div class="vz np"><h3>${esc(b.h)}<em class="hnt">اضغط العنوان ليُفتح</em></h3>
    ${b.secs.map((x,j) => `<div class="exl" data-ex="${i}-${j}">
      <button><span>${esc(x.t)}</span><span class="cv">+</span></button>
      <div class="bd" hidden>${x.p.map(y => `<p>${y}</p>`).join('')}</div>
    </div>`).join('')}</div>`;
}
function vStruct(b, i){
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">اضغط اسم الجزء</em></h3>
    <div class="strc">
      <div class="svgbox" data-sv="${i}">${b.svg}</div>
      <div class="parts" data-ps="${i}">
        ${b.parts.map((x,j) => `<button class="part" data-part="${i}-${j}">${esc(x.n)}</button>`).join('')}
      </div>
      <div class="detail" id="pt-${i}" hidden></div>
    </div></div>`;
}
function vCycle(b, i){
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">اضغط المحطة أو «التالي»</em></h3>
    ${b.loops.map((lp,li) => `<div class="loop" data-loop="${i}-${li}">
      <div class="lh">${esc(lp.name)}</div><div class="ld">${esc(lp.d)}</div>
      <div class="cyc">
        ${lp.steps.map((st,si) => `<button class="sta" data-step="${i}-${li}-${si}">
            <span class="k">${si+1}</span>
            <span class="tx"><b>${esc(st.n)}</b><span>${esc(st.d)}</span></span>
          </button>${si < lp.steps.length-1 ? '<span class="arr">&#8595;</span>' : ''}`).join('')}
        <div class="back2">&#8635; ويعود إلى ${esc(lp.steps[0].n)}</div>
      </div>
      <div class="cycnav"><button data-cyc="${i}-${li}">التالي</button></div>
    </div>`).join('')}</div>`;
}
function vLadder(b, i){
  const n = b.items.length;
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">اضغط أي مستوى لتعريفه</em></h3>
    <div class="lad2" data-lad="${i}">
      ${b.items.map((x,j) => `<button class="rung" data-rung="${j}">
         <span class="bar" style="width:${Math.round(100 - j*(52/(n-1)))}%"><span>${esc(x.n)}</span></span>
         </button>`).join('')}
    </div>
    <div class="axis"><span>&#8593; ${esc(b.hi)}</span><span>${esc(b.lo)} &#8595;</span></div>
    <div class="detail" id="ld-${i}" hidden></div>
    <div class="keyline">من الأكبر إلى الأصغر: <b>${esc(b.key)}</b></div>
  </div>`;
}
function vTree(b, i){
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">اضغط الاسم لتظهر صفاته</em></h3>
    <div class="tree2">
      <div class="node">${esc(b.q)}</div><div class="stem"></div>
      <div class="fork">
        ${b.branches.map((br,bi) => `<div class="limb">
          <span class="tag ${br.cls}">${esc(br.tag)}</span>
          <div class="ask">${esc(br.ask)}</div>
          <div class="leaves">
            ${br.leaves.map((lf,li) => `<button class="leaf2" data-leaf="${i}-${bi}-${li}">
               <b>${esc(lf.n)}</b><span>${esc(lf.s)}</span></button>`).join('')}
          </div></div>`).join('')}
      </div>
    </div>
    <div class="detail" id="lf-${i}" hidden></div>
  </div>`;
}
function vMatrix(b, i){
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">${esc(b.hint)}</em></h3>
    <div class="mx"><table data-mx="${i}">
      <tr><td class="h"></td>${b.cols.map((c,j) =>
        `<th class="${c.c}" data-col="${j}">${esc(c.n)}</th>`).join('')}</tr>
      ${b.rows.map(r => `<tr><td class="h">${esc(r.h)}</td>${r.v.map((v,j) =>
        `<td class="${(r.df||[]).includes(j) ? 'df' : ''}" data-c="${j}">${esc(v)}</td>`).join('')}</tr>`).join('')}
    </table></div>
  </div>`;
}
function vTraps(b){
  return `<div class="vz"><h3>${esc(b.h)}<em class="hnt">احفظها آخر شيء</em></h3>
    ${b.items.map(x => `<div class="trp"><span class="x">!</span><div>${x}</div></div>`).join('')}</div>`;
}
function drawViz(t){
  return t.viz.map((b,i) =>
    b.k === 'idea'   ? `<div class="idea">${esc(b.t)}</div>` :
    b.k === 'text'   ? vText(b,i)   :
    b.k === 'struct' ? vStruct(b,i) :
    b.k === 'cycle'  ? vCycle(b,i)  :
    b.k === 'ladder' ? vLadder(b,i) :
    b.k === 'tree'   ? vTree(b,i)   :
    b.k === 'matrix' ? vMatrix(b,i) :
    b.k === 'traps'  ? vTraps(b)    : '').join('')
;
}

let openTopic = null, tab = 'sheet';

function topicView(t){
  meta.textContent = '';
  secs.style.display = 'none';
  const body = tab === 'sheet' ? drawViz(t) : `<div id="qa"></div>`;
  out.innerHTML = `<div class="tv">
      <button class="back" data-back="1">&#8594; رجوع إلى البحث</button>
      <h2>${esc(t.name)}</h2>
      <div class="where">في الكتاب: ${esc(t.unit)} · صفحة ${esc(t.page)}</div>
      ${t.merge ? `<div class="merged"><b>هذا جمعٌ منّا لا عنوانٌ في الكتاب.</b> ${esc(t.merge)}</div>` : ''}
      <div class="topbar"><button class="paper" data-print="1">
         <svg viewBox="0 0 24 24"><path d="M6 2h12v5H6zM4 9h16v8h-4v5H8v-5H4zm6 8h4v3h-4z"/></svg>
         ورقة المراجعة <small>اطبعها أو احفظها PDF</small></button></div>
      <div class="tabs">
        <button class="tab${tab==='sheet'?' on':''}" data-tab="sheet">ملخّصنا</button>
        <button class="tab${tab==='qs'?' on':''}" data-tab="qs">الأسئلة (${t.qs.length})</button>
      </div>
      ${body}
      <div class="prft"><span>المصدر: كتاب تأسيس يلو للأحياء · ${esc(t.unit)} · صفحة ${esc(t.page)}</span><span>ورقة المراجعة</span></div>
    </div>`;
  if(tab === 'qs') drawQs(t);
}

function drawQs(t){
  const box = document.getElementById('qa');
  box.innerHTML = t.qs.map((x,i) => `<div class="qa" data-q="${i}">
      <div class="n">سؤال ${i+1}</div>
      <div class="p">${esc(x.p)}</div>
      ${x.o.map((o,j) => `<button class="opt" data-pick="${j}">${esc(o)}</button>`).join('')}
      <div class="exp" hidden></div>
    </div>`).join('') + `<div class="score" id="score"></div>`;
}

function answer(card, t, qi, pick){
  const x = t.qs[qi];
  if(card.dataset.done) return;
  card.dataset.done = '1';
  card.querySelectorAll('.opt').forEach((b,j) => {
    b.disabled = true;
    if(j === x.c) b.classList.add('ok');
    else if(j === pick) b.classList.add('no');
  });
  const ex = card.querySelector('.exp');
  ex.innerHTML = (pick === x.c ? '<b>إجابة صحيحة.</b> ' : '<b>الصحيح: ' + esc(x.o[x.c]) + '.</b> ') + esc(x.e);
  ex.hidden = false;
  const done = document.querySelectorAll('.qa[data-done]').length;
  if(done === t.qs.length){
    const right = [...document.querySelectorAll('.qa')].filter(c => !c.querySelector('.opt.no')).length;
    document.getElementById('score').textContent = `أجبت عن ${t.qs.length} أسئلة، وأصبت ${right} منها.`;
  }
}

function render(){
  const v = q.value.trim();
  clr.classList.toggle('on', !!v);
  if(openTopic){ topicView(openTopic); return; }
  secs.style.display = '';
  renderSecs();
  if(!v && activeUnit){ unitView(activeUnit); return; }
  if(!v){
    meta.textContent = `${DATA.length} مصطلحاً في البنك`;
    out.innerHTML = `<div class="empty">اكتب مصطلحاً، أو اختر قسماً، أو جرّب أحد هذه</div>` + chips(SUGG);
    return;
  }
  const {hit, near} = search(v);
  if(hit.length){
    meta.textContent = hit.length === 1 ? 'نتيجة واحدة' : `${hit.length} نتائج`;
    out.innerHTML = hit.map(card).join('');
    return;
  }
  meta.textContent = '';
  let html = `<div class="none">
      <b>هذا المصطلح غير موجود في مادّتنا.</b>
      <p>وهذا لا يعني أنه خطأ، بل أنه لم يُضَف بعد. ولا يُعطى جواب من خارج الكتاب حتى لا يختلف عمّا في الاختبار.</p>
    </div>`;
  if(near.length){
    html += `<div class="empty">لكن الكلمة وردت في شرح هذه المصطلحات</div>` + chips(near.map(e => e.t));
  } else {
    html += `<div class="empty">جرّب أحد هذه</div>` + chips(SUGG);
  }
  out.innerHTML = html;
}

q.addEventListener('input', render);
clr.addEventListener('click', ()=>{ q.value=''; q.focus(); render(); });
q.addEventListener('input', ()=>{ openTopic = null; if(q.value.trim()) activeUnit = null; });
document.addEventListener('click', ev=>{
  const tp = ev.target.closest('[data-topic]');
  if(tp){
    openTopic = TOPICS.find(t => t.id === tp.dataset.topic) || null;
    tab = 'sheet'; render(); window.scrollTo({top:0, behavior:'smooth'}); return;
  }
  if(ev.target.closest('[data-back]')){
    openTopic = null; render(); window.scrollTo({top:0, behavior:'smooth'}); return;
  }
  const tb = ev.target.closest('[data-tab]');
  if(tb && openTopic){ tab = tb.dataset.tab; topicView(openTopic); return; }
  const pick = ev.target.closest('[data-pick]');
  if(pick && openTopic){
    const c = pick.closest('.qa');
    answer(c, openTopic, +c.dataset.q, +pick.dataset.pick); return;
  }
  if(ev.target.closest('[data-print]')){ window.print(); return; }
  const ex = ev.target.closest('.exl > button');
  if(ex){
    const w = ex.parentElement, bd = w.querySelector('.bd');
    w.classList.toggle('on'); bd.hidden = !w.classList.contains('on');
    return;
  }
  const pt = ev.target.closest('[data-part]');
  if(pt && openTopic){
    const [bi, j] = pt.dataset.part.split('-').map(Number);
    const x = openTopic.viz[bi].parts[j];
    const wrap = pt.closest('.strc');
    const was = pt.classList.contains('on');
    wrap.querySelectorAll('.part').forEach(e => e.classList.remove('on'));
    wrap.querySelectorAll('.shp').forEach(e => e.classList.remove('on'));
    const box = document.getElementById('pt-' + bi);
    if(was){ box.hidden = true; return; }
    pt.classList.add('on');
    (x.id || '').split(' ').filter(Boolean).forEach(id => {
      const sh = wrap.querySelector('#' + id); if(sh) sh.classList.add('on');
    });
    box.innerHTML = `<b>${esc(x.n)}</b>${esc(x.d)}`; box.hidden = false;
    return;
  }
  const stp = ev.target.closest('[data-step]');
  if(stp){
    const lp = stp.closest('.loop');
    const was = stp.classList.contains('on');
    lp.querySelectorAll('.sta').forEach(e => e.classList.remove('on'));
    if(!was) stp.classList.add('on');
    return;
  }
  const cy = ev.target.closest('[data-cyc]');
  if(cy){
    const lp = cy.closest('.loop'), all = [...lp.querySelectorAll('.sta')];
    const cur = all.findIndex(e => e.classList.contains('on'));
    all.forEach(e => e.classList.remove('on'));
    const nx = all[(cur + 1) % all.length];
    nx.classList.add('on');
    nx.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  const rg = ev.target.closest('[data-rung]');
  if(rg && openTopic){
    const lad = rg.closest('[data-lad]'), bi = +lad.dataset.lad, j = +rg.dataset.rung;
    const was = rg.classList.contains('on'), box = document.getElementById('ld-' + bi);
    lad.querySelectorAll('.rung').forEach(r => r.classList.remove('on'));
    if(was){ box.hidden = true; }
    else {
      rg.classList.add('on');
      const x = openTopic.viz[bi].items[j];
      box.innerHTML = `<b>${esc(x.n)}</b>${esc(x.d)}`; box.hidden = false;
    }
    return;
  }
  const lf = ev.target.closest('[data-leaf]');
  if(lf && openTopic){
    const [bi, br, li] = lf.dataset.leaf.split('-').map(Number);
    const x = openTopic.viz[bi].branches[br].leaves[li];
    document.querySelectorAll('.leaf2').forEach(e => e.classList.remove('on'));
    lf.classList.add('on');
    const d = document.getElementById('lf-' + bi);
    d.innerHTML = `<b>${esc(x.n)}</b>${esc(x.d)}`; d.hidden = false;
    return;
  }
  const ch = ev.target.closest('[data-col]');
  if(ch){
    const tb = ch.closest('table'), j = +ch.dataset.col;
    const on = ch.classList.contains('hi');
    tb.querySelectorAll('.hi').forEach(e => e.classList.remove('hi'));
    if(!on){
      ch.classList.add('hi');
      tb.querySelectorAll(`td[data-c="${j}"]`).forEach(e => e.classList.add('hi'));
    }
    return;
  }
  const u = ev.target.closest('[data-unit]');
  if(u){
    activeUnit = activeUnit === u.dataset.unit ? null : u.dataset.unit;
    q.value = '';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  const b = ev.target.closest('[data-go]');
  if(!b) return;
  activeUnit = null; openTopic = null;
  q.value = b.dataset.go;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
render();
</script>
</body>
</html>
