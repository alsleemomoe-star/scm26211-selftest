<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اسأل الأحياء</title>
<meta name="description" content="ابحث عن أي مصطلح في الأحياء واحصل على تعريفه من الكتاب مباشرة">
<meta name="theme-color" content="#0F766E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#16222E; --mut:#64748B; --line:#E2E8F0; --soft:#F6F8FA;
  --key:#0F766E; --keybg:#E6F2F1; --warn:#B3261E; --bg:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8EDF2; --mut:#93A3B4; --line:#2A3542; --soft:#1A232E;
    --key:#5EC5BB; --keybg:#17302E; --warn:#F2928B; --bg:#111821;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EDF2; --mut:#93A3B4; --line:#2A3542; --soft:#1A232E;
  --key:#5EC5BB; --keybg:#17302E; --warn:#F2928B; --bg:#111821;
}
html{-webkit-text-size-adjust:100%}
body{font-family:Tajawal,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.7;padding:0 16px env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:22px 0 60px}
header{text-align:center;margin-bottom:18px}
h1{font-size:25px;font-weight:800;letter-spacing:-.2px}
header p{font-size:13.5px;color:var(--mut);margin-top:4px}
.box{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:5}
.field{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;
  padding:12px 14px;transition:border-color .15s,box-shadow .15s;background:var(--bg)}
.field:focus-within{border-color:var(--key);box-shadow:0 0 0 4px var(--keybg)}
.field svg{flex:none;width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2}
input{flex:1;border:0;outline:0;font:inherit;font-size:17px;background:transparent;color:var(--ink)}
input::placeholder{color:var(--mut);opacity:.85}
.clr{border:0;background:transparent;color:var(--mut);font:inherit;font-size:20px;cursor:pointer;
  line-height:1;padding:0 2px;display:none}
.clr.on{display:block}
.meta{font-size:12.5px;color:var(--mut);margin:8px 2px 0;min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sec{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:9px;
  padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.sec:hover{border-color:var(--key);color:var(--key)}
.sec.on{background:var(--key);border-color:var(--key);color:#fff}
.sec .c{font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.sec.off{opacity:.55}

.toci{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin-bottom:7px;background:transparent;font:inherit;
  text-align:right;color:var(--ink);cursor:pointer}
.toci.no{cursor:default;opacity:.52;border-style:dashed}
.toci:not(.no):hover{border-color:var(--key)}
.toci .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mut)}
.toci:not(.no) .num{background:var(--keybg);color:var(--key)}
.toci .nm{flex:1;min-width:0;font-size:14.5px;font-weight:700;line-height:1.45}
.toci .pgx{flex:none;font-size:11.5px;color:var(--mut)}
.toci .st{flex:none;font-size:11px;font-weight:700;color:var(--key)}
.toci.no .st{color:var(--mut);font-weight:400}
.unote{font-size:12.5px;color:var(--mut);margin-bottom:11px}
.merged{border:1px solid var(--key);background:var(--keybg);border-radius:9px;padding:9px 12px;
  font-size:12.5px;line-height:1.65;margin-bottom:12px}
.merged b{color:var(--key)}
.grp{margin-top:18px}
.grp h3{font-size:14.5px;font-weight:700;margin-bottom:3px}
.grp .sub{font-size:12.5px;color:var(--mut)}
.soon{border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:14px;
  text-align:center;color:var(--mut);font-size:14px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:13.5px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--key);color:var(--key);outline:0}
.card{border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-top:12px;background:var(--bg)}
.card h2{font-size:18.5px;font-weight:800;margin-bottom:6px}
.card .def{font-size:15.5px}
.card .def b{color:var(--key);font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700}
.src{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--mut);
  background:var(--soft);border-radius:8px;padding:4px 10px}

.empty{text-align:center;padding:26px 10px;color:var(--mut);font-size:14.5px}
.none{border:1px solid var(--line);border-right:4px solid var(--warn);border-radius:12px;
  padding:15px 16px;margin-top:12px;background:var(--soft)}
.none b{color:var(--warn)}
.none p{font-size:14.5px;margin-top:4px}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--mut);text-align:center;line-height:1.9}
mark{background:var(--keybg);color:inherit;border-radius:3px;padding:0 2px}
.src.go{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);cursor:pointer;
  font:inherit;font-size:12.5px;color:var(--ink);background:var(--soft);padding:6px 11px;border-radius:9px}
.src.go:hover{border-color:var(--key);color:var(--key)}
.src.go svg{width:14px;height:14px;fill:currentColor;opacity:.65;flex:none}
.src.go .arw{color:var(--key);font-weight:700;border-right:1px solid var(--line);padding-right:8px;margin-right:2px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--key);
  font:inherit;font-size:14px;cursor:pointer;padding:4px 0;margin-bottom:6px}
.tv h2{font-size:21px;font-weight:800;margin-bottom:2px}
.tv .where{font-size:13px;color:var(--mut);margin-bottom:14px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--mut);
  font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;padding:8px 10px;margin-bottom:-1px}
.tab.on{color:var(--key);border-bottom-color:var(--key)}
.sheet{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sheet img{display:block;width:100%;height:auto}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px;text-align:center}
.qa{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:11px}
.qa .n{font-size:12px;color:var(--key);font-weight:800;margin-bottom:3px}
.qa .p{font-size:15.5px;font-weight:700;margin-bottom:10px}
.opt{display:block;width:100%;text-align:right;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--ink);font:inherit;font-size:14.5px;cursor:pointer;
  padding:9px 12px;margin-bottom:7px}
.opt:hover:not(:disabled){border-color:var(--key)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--key);background:var(--keybg);font-weight:700}
.opt.no{border-color:var(--warn);opacity:.75;text-decoration:line-through}
.exp{font-size:13.5px;color:var(--mut);border-right:3px solid var(--key);
  background:var(--soft);border-radius:8px;padding:9px 12px;margin-top:4px;line-height:1.7}
.score{text-align:center;font-size:14px;color:var(--mut);padding:12px}
/* ===== قواعد الرسم البصري ===== */
.vz{margin-bottom:22px}
.vz > h3{font-size:15px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.vz > h3::after{content:"";flex:1;height:1px;background:var(--line)}
.idea{background:var(--soft);border-right:3px solid var(--key);border-radius:0 10px 10px 0;
  padding:12px 14px;font-size:14.5px;line-height:1.75;margin-bottom:22px}
.idea b{color:var(--key)}
/* الهرم */
.lad2{display:flex;flex-direction:column;gap:4px}
.rung{display:flex;align-items:center;gap:9px;cursor:pointer;border:0;background:transparent;
  padding:0;font:inherit;text-align:right;width:100%}
.rung .bar{height:30px;border-radius:7px;background:var(--keybg);border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;transition:.15s;flex:none}
.rung .bar span{font-size:13px;font-weight:700;color:var(--key);white-space:nowrap}
.rung:hover .bar,.rung.on .bar{border-color:var(--key)}
.rung.on .bar{background:var(--key)}
.rung.on .bar span{color:#fff}
.rung .d{font-size:12.5px;color:var(--mut);flex:1;min-width:0}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin:6px 2px 0}
.keyline{background:var(--keybg);border-radius:9px;padding:9px 12px;margin-top:11px;font-size:13.5px}
.keyline b{color:var(--key);font-size:16px;letter-spacing:1.5px}
/* الشجرة */
.tree2{display:flex;flex-direction:column;align-items:center}
.node{border:1.5px solid var(--ink);border-radius:9px;padding:8px 14px;font-size:14px;font-weight:700;
  background:var(--bg);text-align:center}
.stem{width:2px;height:16px;background:var(--line)}
.fork{display:flex;width:100%;gap:10px}
.limb{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.limb::before{content:"";position:absolute;top:0;height:2px;background:var(--line);width:50%}
.limb:first-child::before{right:50%}
.limb:last-child::before{left:50%}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;margin-top:16px}
.tag.p{background:#FBF1DC;color:#8A5E08}
.tag.e{background:#E3EEF7;color:#17557E}
:root[data-theme="dark"] .tag.p,
:root:not([data-theme="light"]) .tag.p{background:#3A2E12;color:#E0B64A}
:root[data-theme="dark"] .tag.e,
:root:not([data-theme="light"]) .tag.e{background:#15293A;color:#79B6E0}
.ask{font-size:12.5px;color:var(--mut);margin:7px 0;text-align:center}
.leaves{display:flex;flex-direction:column;gap:6px;width:100%}
.leaf2{border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;
  background:transparent;font:inherit;text-align:right;width:100%}
.leaf2:hover{border-color:var(--key)}
.leaf2.on{border-color:var(--key);background:var(--keybg)}
.leaf2 b{font-size:13.5px;display:block}
.leaf2 span{font-size:11.5px;color:var(--mut)}
.detail{border:1px solid var(--key);background:var(--keybg);border-radius:10px;padding:11px 13px;
  margin-top:12px;font-size:13.5px;line-height:1.7}
.detail b{display:block;margin-bottom:3px}
/* الجدول */
.mx{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.mx table{border-collapse:separate;border-spacing:0;width:100%;min-width:470px;font-size:12.5px}
.mx th,.mx td{border:1px solid var(--line);padding:7px 8px;text-align:center;line-height:1.5}
.mx th{background:var(--soft);font-weight:700;cursor:pointer;white-space:nowrap}
.mx th.pr{color:#8A5E08}.mx th.eu{color:#17557E}
:root[data-theme="dark"] .mx th.pr,:root:not([data-theme="light"]) .mx th.pr{color:#E0B64A}
:root[data-theme="dark"] .mx th.eu,:root:not([data-theme="light"]) .mx th.eu{color:#79B6E0}
.mx td.h{text-align:right;font-weight:700;background:var(--soft);white-space:nowrap;
  position:sticky;right:0;z-index:2;box-shadow:-1px 0 0 var(--line)}
.mx .hi{background:var(--keybg);box-shadow:inset 0 0 0 1px var(--key)}
.mx td.df{font-weight:700}
.mxh{font-size:12px;color:var(--mut);margin-top:7px;text-align:center}
/* المصائد */
.trp{display:flex;gap:9px;border:1px solid var(--line);border-right:3px solid var(--warn);
  border-radius:0 9px 9px 0;background:var(--soft);padding:9px 12px;margin-bottom:7px;font-size:13.5px;line-height:1.65}
.trp .x{color:var(--warn);font-weight:800;flex:none}
.trp b{color:var(--warn)}

/* الشرح */
.exl{border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden}
.exl > button{width:100%;text-align:right;border:0;background:var(--soft);font:inherit;
  font-size:14.5px;font-weight:700;padding:11px 13px;cursor:pointer;color:var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.exl > button .cv{color:var(--key);font-size:17px;line-height:1;transition:.2s}
.exl.on > button .cv{transform:rotate(45deg)}
.exl .bd{padding:12px 14px;font-size:14px;line-height:1.85;border-top:1px solid var(--line)}
.exl .bd p{margin-bottom:9px}
.exl .bd p:last-child{margin-bottom:0}
.exl .bd b{color:var(--key)}
.pdfl{display:block;text-align:center;border:1px dashed var(--line);border-radius:10px;
  padding:11px;font-size:13px;color:var(--key);cursor:pointer;background:transparent;
  font:inherit;width:100%;margin-top:4px}


</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>اسأل الأحياء</h1>
  <p>اكتب أي مصطلح، ويظهر تعريفه من الكتاب</p>
</header>

<div class="box">
  <div class="field">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="مثال: الكروموسوم" aria-label="ابحث عن مصطلح">
    <button class="clr" id="clr" aria-label="مسح">&times;</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="secs" id="secs"></div>
</div>

<div id="out"></div>

<footer>
  المصدر: كتاب تأسيس يَلو للأحياء · أحياء ١ ص ٦ · أحياء ٤ ص ٥٦<br>
  كل تعريف هنا من نصّ الكتاب، ولا مادّة من خارجه. وما لا يذكره الكتاب يقول البحث إنه غير موجود.
</footer>

</div>

<script>
/* ===== بنك المصطلحات — كل تعريف منقول من الكتاب ===== */
const DATA = [
 /* --- أحياء ١ · الموضوع الثاني: تنظيم تنوّع الحياة · ص ٦ --- */
 {t:"التصنيف", a:["تصنيف"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"وضع الأشياء أو المخلوقات الحية في مجموعات بناءً على مجموعة من الخصائص.", r:["علم التصنيف","المصنّف","فوق المملكة"]},
 {t:"علم التصنيف", a:[], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"أحد فروع علم الأحياء، يهتم بتعريف الأنواع وتسميتها وتصنيفها بناءً على صفاتها وعلاقاتها الطبيعية.", r:["التصنيف","كارلوس لينيوس"]},
 {t:"المصنّف", a:["مصنف"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"مجموعة المخلوقات الحية التي اتخذت اسماً.", r:["التصنيف","فوق المملكة"]},
 {t:"التسمية الثنائية", a:["الاسم العلمي","التسميه الثنائيه"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"اسم ثنائي للمخلوق الحي باللغة اللاتينية، وضعه <b>كارلوس لينيوس</b>. ويتكون من كلمتين: الأولى اسم <b>الجنس</b> وتبدأ بحرف كبير، والثانية اسم <b>النوع</b> وأحرفه كلها صغيرة. ويُكتب بخط مائل في المطبوع، ويوضع تحته خط إذا كُتب بخط اليد.", r:["كارلوس لينيوس","الجنس","النوع"]},
 {t:"فوق المملكة", a:["فوق المملكه","المجال"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"أوسع المصنّفات، تضم مملكة أو أكثر. ويوجد <b>٣ فوق ممالك</b>، وصُنفت حسب نوع الخلية والتركيب.", r:["المملكة","المصنّف"]},
 {t:"المملكة", a:["الممالك","المملكه"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"صُنفت حسب نوع الخلية والتركيب والتغذي، وتضم شعباً أو أقساماً، وعددها <b>٦ ممالك</b>: مملكتان بدائيتا النوى، وأربع حقيقية النوى.", r:["فوق المملكة","الشعبة","البدائيات"]},
 {t:"الشعبة", a:["القسم","الشعبه"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"تضم طوائف متقاربة. ويُستخدم مصطلح <b>القسم</b> بدلاً منها في تصنيف البكتيريا والنباتات، وهما اسمان لمستوى واحد.", r:["المملكة","الطائفة"]},
 {t:"الطائفة", a:["الطائفه"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"تضم رتباً متقاربة.", r:["الشعبة","الرتبة"]},
 {t:"الرتبة", a:["الرتبه"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"تضم فصائل متقاربة.", r:["الطائفة","الفصيلة"]},
 {t:"الفصيلة", a:["الفصيله","العائلة"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"المصنّف الأعلى من الجنس، وتتكون من أجناس متشابهة.", r:["الرتبة","الجنس"]},
 {t:"الجنس", a:[], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"مجموعة من الأنواع الأكثر ترابطاً وتشابهاً وتشترك خصائصها.", r:["الفصيلة","النوع"]},
 {t:"النوع", a:[], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"مجموعة من المخلوقات الحية المتشابهة في الشكل والتركيب، <b>قادرة على التزاوج فيما بينها وإنتاج نسل خصب</b>. وهو أصغر مستويات التصنيف.", r:["الجنس","التسمية الثنائية"]},
 {t:"أرسطو", a:["ارسطو"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",
  d:"صنّف الحيوانات تبعاً لوجود <b>الدم الأحمر</b> أو عدمه، وصنّف النباتات إلى أشجار وشجيرات وأعشاب.", r:["كارلوس لينيوس","التصنيف"]},
 {t:"كارلوس لينيوس", a:["لينيوس"], s:"أحياء 1 · تنظيم تنوّع الحياة · ص 6",

function topicOf(e){
  const pr = e.s.split('·').map(x => x.trim());
  const direct = TOPICS.find(t => t.unit === pr[0] && t.name === pr[1]);
  if(direct) return direct;
  const row = TOC.find(x => x.u === pr[0] && x.name === pr[1]);
  return row && row.t ? TOPICS.find(t => t.id === row.t) || null : null;
}

/* ===== تطبيع النص العربي ===== */
function norm(x){
  return (x||"")
   .replace(/[ً-ْـٰ]/g,"")   // تشكيل وتطويل
   .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
   .replace(/[ؤئ]/g,"ء")
   .replace(/[^ء-يa-zA-Z0-9 ]/g," ")
   .replace(/\s+/g," ").trim();
}
function stripAl(x){ return x.replace(/(^|\s)(ال)/g,"$1"); }
function key(x){ return stripAl(norm(x)); }

const IDX = DATA.map(e=>({
  e, k:key(e.t), ak:(e.a||[]).map(key), dk:key(e.d.replace(/<[^>]+>/g,""))
}));
const BY = {}; DATA.forEach(e=>BY[key(e.t)]=e);

const STOP = new Set(["وش","ايش","وشو","شنو","يعني","معني","معنا","تعريف","عرف","ما","ماهو",
 "هو","هي","هذا","هذه","من","عن","في","على","اشرح","وضح","كيف","ليش","لماذا","لمادا","ايه","ما هو"]);

function scoreEntry(it, q, words){
  if(it.k === q || it.ak.includes(q)) return 1000;
  if(it.k.length > 2 && q.includes(it.k)) return 900;
  if(it.ak.some(a => a.length > 2 && q.includes(a))) return 880;
  if(q.length > 2 && it.k.includes(q)) return 820;
  if(q.length > 2 && it.ak.some(a => a.includes(q))) return 800;
  const toks = (it.k + " " + it.ak.join(" ")).split(" ").filter(t => t.length > 2);
  let hits = 0;
  words.forEach(w => { if(toks.some(t => t.includes(w) || w.includes(t))) hits++; });
  if(hits) return 400 + hits * 30;
  let dh = 0;
  words.forEach(w => { if(it.dk.includes(w)) dh++; });
  if(dh) return 100 + dh * 10;
  return 0;
}

function search(raw){
  const q = key(raw);
  if(!q) return {hit:[], near:[]};
  const words = q.split(" ").filter(w => w.length > 2 && !STOP.has(w));
  const all = [];
  IDX.forEach(it => {
    const sc = scoreEntry(it, q, words);
    if(sc) all.push({sc, e:it.e});
  });
  all.sort((a,b) => b.sc - a.sc || a.e.t.length - b.e.t.length);
  return {
    hit:  all.filter(o => o.sc >= 400).slice(0,6).map(o => o.e),
    near: all.filter(o => o.sc < 400).slice(0,5).map(o => o.e)
  };
}

      ${b.items.map((x,j) => `<button class="rung" data-rung="${j}">
         <span class="bar" style="width:${Math.round(100 - j*(52/(n-1)))}%"><span>${esc(x.n)}</span></span>
         </button>`).join('')}
    </div>
    <div class="axis"><span>&#8593; ${esc(b.hi)}</span><span>${esc(b.lo)} &#8595;</span></div>
    <div class="detail" id="ld-${i}" hidden></div>
    <div class="keyline">من الأكبر إلى الأصغر: <b>${esc(b.key)}</b> &nbsp;·&nbsp; اضغط أي مستوى لتعريفه</div>
  </div>`;
}
function vTree(b, i){
  return `<div class="vz"><h3>${esc(b.h)}</h3>
    <div class="tree2">
      <div class="node">${esc(b.q)}</div><div class="stem"></div>
      <div class="fork">
        ${b.branches.map((br,bi) => `<div class="limb">
          <span class="tag ${br.cls}">${esc(br.tag)}</span>
          <div class="ask">${esc(br.ask)}</div>
          <div class="leaves">
            ${br.leaves.map((lf,li) => `<button class="leaf2" data-leaf="${i}-${bi}-${li}">
               <b>${esc(lf.n)}</b><span>${esc(lf.s)}</span></button>`).join('')}
          </div></div>`).join('')}
      </div>
    </div>
    <div class="detail" id="lf-${i}" hidden></div>
  </div>`;
}
function vMatrix(b, i){
  return `<div class="vz"><h3>${esc(b.h)}</h3>
    <div class="mx"><table data-mx="${i}">
      <tr><td class="h"></td>${b.cols.map((c,j) =>
        `<th class="${c.c}" data-col="${j}">${esc(c.n)}</th>`).join('')}</tr>
      ${b.rows.map(r => `<tr><td class="h">${esc(r.h)}</td>${r.v.map((v,j) =>
        `<td class="${(r.df||[]).includes(j) ? 'df' : ''}" data-c="${j}">${esc(v)}</td>`).join('')}</tr>`).join('')}
    </table></div>
    <div class="mxh">${esc(b.hint)}</div>
  </div>`;
}
function vTraps(b){
  return `<div class="vz"><h3>${esc(b.h)}</h3>
    ${b.items.map(x => `<div class="trp"><span class="x">!</span><div>${x}</div></div>`).join('')}</div>`;
}
function drawViz(t){
  return t.viz.map((b,i) =>
    b.k === 'idea'   ? `<div class="idea">${esc(b.t)}</div>` :
    b.k === 'text'   ? vText(b,i)   :
    b.k === 'ladder' ? vLadder(b,i) :
    b.k === 'tree'   ? vTree(b,i)   :
    b.k === 'matrix' ? vMatrix(b,i) :
    b.k === 'traps'  ? vTraps(b)    : '').join('')
   + (t.sheet ? `<button class="pdfl" data-png="1">افتح الورقة المطبوعة لهذا الموضوع</button>` : '');
}

let openTopic = null, tab = 'sheet';

function topicView(t){
  meta.textContent = '';
  secs.style.display = 'none';
  const body = tab === 'sheet' ? drawViz(t) : `<div id="qa"></div>`;
  out.innerHTML = `<div class="tv">
      <button class="back" data-back="1">&#8594; رجوع إلى البحث</button>
      <h2>${esc(t.name)}</h2>
      <div class="where">في الكتاب: ${esc(t.unit)} · صفحة ${esc(t.page)}</div>
      ${t.merge ? `<div class="merged"><b>هذا جمعٌ منّا لا عنوانٌ في الكتاب.</b> ${esc(t.merge)}</div>` : ''}
      <div class="tabs">
        <button class="tab${tab==='sheet'?' on':''}" data-tab="sheet">ملخّصنا</button>
        <button class="tab${tab==='qs'?' on':''}" data-tab="qs">الأسئلة (${t.qs.length})</button>
      </div>
      ${body}
    </div>`;
  if(tab === 'qs') drawQs(t);
}

function drawQs(t){
  const box = document.getElementById('qa');
  box.innerHTML = t.qs.map((x,i) => `<div class="qa" data-q="${i}">
      <div class="n">سؤال ${i+1}</div>
      <div class="p">${esc(x.p)}</div>
      ${x.o.map((o,j) => `<button class="opt" data-pick="${j}">${esc(o)}</button>`).join('')}
      <div class="exp" hidden></div>
    </div>`).join('') + `<div class="score" id="score"></div>`;
}

function answer(card, t, qi, pick){
  const x = t.qs[qi];
  if(card.dataset.done) return;
  card.dataset.done = '1';
  card.querySelectorAll('.opt').forEach((b,j) => {
    b.disabled = true;
    if(j === x.c) b.classList.add('ok');
    else if(j === pick) b.classList.add('no');
  });
  const ex = card.querySelector('.exp');
  ex.innerHTML = (pick === x.c ? '<b>إجابة صحيحة.</b> ' : '<b>الصحيح: ' + esc(x.o[x.c]) + '.</b> ') + esc(x.e);
  ex.hidden = false;
  const done = document.querySelectorAll('.qa[data-done]').length;
  if(done === t.qs.length){
    const right = [...document.querySelectorAll('.qa')].filter(c => !c.querySelector('.opt.no')).length;
    document.getElementById('score').textContent = `أجبت عن ${t.qs.length} أسئلة، وأصبت ${right} منها.`;
  }
}

function render(){
  const v = q.value.trim();
  clr.classList.toggle('on', !!v);
  if(openTopic){ topicView(openTopic); return; }
  secs.style.display = '';
  renderSecs();
  if(!v && activeUnit){ unitView(activeUnit); return; }
  if(!v){
    meta.textContent = `${DATA.length} مصطلحاً في البنك`;
    out.innerHTML = `<div class="empty">اكتب مصطلحاً، أو اختر قسماً، أو جرّب أحد هذه</div>` + chips(SUGG);
    return;
  }
  const {hit, near} = search(v);
  if(hit.length){
    meta.textContent = hit.length === 1 ? 'نتيجة واحدة' : `${hit.length} نتائج`;
    out.innerHTML = hit.map(card).join('');
    return;
  }
  meta.textContent = '';
  let html = `<div class="none">
      <b>هذا المصطلح غير موجود في مادّتنا.</b>
      <p>وهذا لا يعني أنه خطأ، بل أنه لم يُضَف بعد. ولا يُعطى جواب من خارج الكتاب حتى لا يختلف عمّا في الاختبار.</p>
    </div>`;
  if(near.length){
    html += `<div class="empty">لكن الكلمة وردت في شرح هذه المصطلحات</div>` + chips(near.map(e => e.t));
  } else {
    html += `<div class="empty">جرّب أحد هذه</div>` + chips(SUGG);
  }
  out.innerHTML = html;
}

q.addEventListener('input', render);
clr.addEventListener('click', ()=>{ q.value=''; q.focus(); render(); });
q.addEventListener('input', ()=>{ openTopic = null; if(q.value.trim()) activeUnit = null; });
document.addEventListener('click', ev=>{
  const tp = ev.target.closest('[data-topic]');
  if(tp){
    openTopic = TOPICS.find(t => t.id === tp.dataset.topic) || null;
    tab = 'sheet'; render(); window.scrollTo({top:0, behavior:'smooth'}); return;
  }
  if(ev.target.closest('[data-back]')){
    openTopic = null; render(); window.scrollTo({top:0, behavior:'smooth'}); return;
  }
  const tb = ev.target.closest('[data-tab]');
  if(tb && openTopic){ tab = tb.dataset.tab; topicView(openTopic); return; }
  const pick = ev.target.closest('[data-pick]');
  if(pick && openTopic){
    const c = pick.closest('.qa');
    answer(c, openTopic, +c.dataset.q, +pick.dataset.pick); return;
  }
  if(ev.target.closest('[data-png]') && openTopic){ window.open(openTopic.sheet, '_blank'); return; }
  const ex = ev.target.closest('.exl > button');
  if(ex){
    const w = ex.parentElement, bd = w.querySelector('.bd');
    w.classList.toggle('on'); bd.hidden = !w.classList.contains('on');
    return;
  }
  const rg = ev.target.closest('[data-rung]');
  if(rg && openTopic){
    const lad = rg.closest('[data-lad]'), bi = +lad.dataset.lad, j = +rg.dataset.rung;
    const was = rg.classList.contains('on'), box = document.getElementById('ld-' + bi);
    lad.querySelectorAll('.rung').forEach(r => r.classList.remove('on'));
    if(was){ box.hidden = true; }
    else {
      rg.classList.add('on');
      const x = openTopic.viz[bi].items[j];
      box.innerHTML = `<b>${esc(x.n)}</b>${esc(x.d)}`; box.hidden = false;
    }
    return;
  }
  const lf = ev.target.closest('[data-leaf]');
  if(lf && openTopic){
    const [bi, br, li] = lf.dataset.leaf.split('-').map(Number);
    const x = openTopic.viz[bi].branches[br].leaves[li];
    document.querySelectorAll('.leaf2').forEach(e => e.classList.remove('on'));
    lf.classList.add('on');
    const d = document.getElementById('lf-' + bi);
    d.innerHTML = `<b>${esc(x.n)}</b>${esc(x.d)}`; d.hidden = false;
    return;
  }
  const ch = ev.target.closest('[data-col]');
  if(ch){
    const tb = ch.closest('table'), j = +ch.dataset.col;
    const on = ch.classList.contains('hi');
    tb.querySelectorAll('.hi').forEach(e => e.classList.remove('hi'));
    if(!on){
      ch.classList.add('hi');
      tb.querySelectorAll(`td[data-c="${j}"]`).forEach(e => e.classList.add('hi'));
    }
    return;
  }
  const u = ev.target.closest('[data-unit]');
  if(u){
    activeUnit = activeUnit === u.dataset.unit ? null : u.dataset.unit;
    q.value = '';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  const b = ev.target.closest('[data-go]');
  if(!b) return;
  activeUnit = null; openTopic = null;
  q.value = b.dataset.go;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
render();
</script>
</body>
</html>
